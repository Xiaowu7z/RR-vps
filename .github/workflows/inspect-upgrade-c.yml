name: Inspect upgrade test C
on:
  push:
    branches: [audit/stability-20260907]
    paths: [.github/workflows/inspect-upgrade-c.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect the running disposable Ubuntu test host
        env:
          HOST: ${{ secrets.RR_C_HOST }}
          SSHPASS: ${{ secrets.RR_C_PASS }}
        run: |
          set -euo pipefail
          set +x
          sudo apt-get install -y -qq sshpass
          known="$RUNNER_TEMP/known-c"
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3\n' "$HOST" > "$known"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$known" -o HostKeyAlgorithms=ssh-ed25519 \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o ConnectTimeout=15 "root@$HOST" 'bash -s' <<'REMOTE'
          # Retire only the identified hung audit process and its descendants.
          python3 - <<'PY'
          import os, signal, time
          from pathlib import Path
          root = 1072453
          proc = Path(f'/proc/{root}')
          if proc.exists():
              args = (proc/'cmdline').read_bytes().split(b'\0')
              assert b'/root/rr-stability-candidate/audit-stability-host.sh' in args
              selected = {root}
              changed = True
              while changed:
                  changed = False
                  for item in Path('/proc').glob('[0-9]*'):
                      try:
                          stat = (item/'stat').read_text().rsplit(')', 1)[1].split()
                          if int(stat[1]) in selected and int(item.name) not in selected:
                              selected.add(int(item.name)); changed = True
                      except (OSError, ValueError, IndexError):
                          pass
              for pid in selected:
                  try: os.kill(pid, signal.SIGSTOP)
                  except ProcessLookupError: pass
              for pid in selected:
                  try: os.kill(pid, signal.SIGKILL)
                  except ProcessLookupError: pass
              print('Retired identified hung test processes:', len(selected))
          else:
              print('Identified hung audit has already exited')
          PY
          /usr/local/sbin/rr-update-recover status
          /usr/local/bin/rr --version
          systemctl show sing-box.service rr-nexus.service argo-rr-health.service \
            argo-rr-health.timer rr-update-recovery.service -p Id -p ActiveState -p SubState -p Job --no-pager
          ps -eo pid,ppid,comm,etimes,wchan:24 | awk '/bash|python|curl|systemctl|sing-box|cloudflared|flock|apt|dpkg|tar|sleep|go|PID/'
          lslocks -n -o PID,COMMAND,PATH
          python3 - <<'PY'
          import re
          from pathlib import Path
          for name in ['/root/rr-stability.log','/root/rr-stability-candidate/install-attempt.log']:
              print('LOG',name)
              if not Path(name).is_file():
                  continue
              for line in Path(name).read_text(errors='replace').splitlines()[-25:]:
                  line = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', line)
                  if ' DIAG ' not in line:
                      line = re.sub(r'[!-~]{8,}', '[redacted]', line)
                  print(line[:240])
          PY
          REMOTE
