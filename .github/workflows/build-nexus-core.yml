name: Build RR Nexus traffic core

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/build-nexus-core.yml"

permissions:
  contents: read

concurrency:
  group: rr-nexus-core
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - name: Resolve latest stable sing-box release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(curl -fsSL --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: RR-vps-builder' \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest)
          tag=$(jq -r '.tag_name // empty' <<<"$release_json")
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          version=${tag#v}
          source_sha=$(git ls-remote https://github.com/SagerNet/sing-box.git \
            "refs/tags/${tag}" "refs/tags/${tag}^{}" | \
            awk '/\^\{\}$/ {print $1; found=1} !first {first=$1} END {if (!found) print first}' | tail -n 1)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          release_tag="rr-nexus-core-${tag}"
          current_json=$(curl -fsSL --retry 2 \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: RR-vps-builder' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" \
            2>/dev/null || printf '{}')
          needed=true
          if [ "$(jq -r '.tag_name // empty' <<<"$current_json")" = "$release_tag" ]; then
            complete=true
            for asset in \
              "rr-sing-box-${version}-linux-amd64.tar.gz" \
              "rr-sing-box-${version}-linux-arm64.tar.gz" SHA256SUMS BUILD_INFO; do
              jq -e --arg name "$asset" '.assets[]? | select(.name == $name)' \
                <<<"$current_json" >/dev/null || complete=false
            done
            if [ "$complete" = true ]; then
              needed=false
            else
              echo "Incomplete immutable release ${release_tag}; refusing to overwrite it." >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Check out official sing-box source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ needs.version.outputs.tag }}" \
            https://github.com/SagerNet/sing-box.git sing-box
          test "$(git -C sing-box rev-parse HEAD)" = "${{ needs.version.outputs.source_sha }}"

      - name: Set up Go from upstream go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum

      - name: Build and execute API-enabled core
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd sing-box
          tags="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS),with_v2ray_api"
          shared_ldflags=$(tr -d '\r\n' < release/LDFLAGS)
          export CGO_ENABLED=0 GOOS=linux GOARCH GOTOOLCHAIN=local
          go build -trimpath -tags "$tags" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} ${shared_ldflags} -s -w -buildid=" \
            -o sing-box ./cmd/sing-box
          ./sing-box version | tee version.txt
          grep -qw 'with_v2ray_api' version.txt
          mkdir -p "../dist/sing-box-${VERSION}-linux-${GOARCH}"
          install -m 755 sing-box "../dist/sing-box-${VERSION}-linux-${GOARCH}/sing-box"
          cp LICENSE "../dist/sing-box-${VERSION}-linux-${GOARCH}/LICENSE"
          cd ../dist
          tar -czf "rr-sing-box-${VERSION}-linux-${GOARCH}.tar.gz" \
            "sing-box-${VERSION}-linux-${GOARCH}"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rr-sing-box-${{ matrix.arch }}
          path: dist/rr-sing-box-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, build]
    if: needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rr-sing-box-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums and build metadata
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum rr-sing-box-*.tar.gz | LC_ALL=C sort > SHA256SUMS
          printf '%s\n' \
            "SING_BOX_VERSION=${{ needs.version.outputs.version }}" \
            "SING_BOX_TAG=${{ needs.version.outputs.tag }}" \
            "SOURCE_COMMIT=${{ needs.version.outputs.source_sha }}" \
            "BUILD_TAG=with_v2ray_api" \
            "SOURCE=https://github.com/SagerNet/sing-box/tree/${{ needs.version.outputs.tag }}" \
            > BUILD_INFO

      - name: Publish without removing the working release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.release_tag }}"
          title="RR Nexus traffic core · sing-box ${{ needs.version.outputs.version }}"
          notes="Built from the official SagerNet/sing-box ${{ needs.version.outputs.tag }} source with the additional with_v2ray_api build tag. SHA256SUMS and BUILD_INFO are included. Latest release, refreshed automatically every day or on demand."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable core release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$title" --notes "$notes"
