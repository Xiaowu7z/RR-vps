name: Release recovery evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-recovery-evidence
  cancel-in-progress: false

# Keep this workflow path for installed 7.2.1 update guards. Its declared
# scope preserves the pinned historical Debian and LA 7.2.1 recovery receipts,
# and verifies reviewed current-candidate hashes and restricted changes separately. It does
# not claim a live VPS test for later versions or contact the deleted hosts.
jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    name: Verify approved recovery receipts and bounded 7.2.6 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify this commit's bundle and approved recovery evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          python3 scripts/verify-owner-recovery-evidence.py --require-approved-policy \
            | tee "$RUNNER_TEMP/rr-owner-recovery-evidence.txt"
          {
            printf 'Candidate commit: `%s`\n\n' "$GITHUB_SHA"
            printf '%s\n\n' 'Scope: the historical Debian 12 repair receipt remains bound to its original 7.2.4 bundle and helper. The separate owner-reported LA recovery stays bound to its executed 7.2.1 helper and local hotfix. Neither receipt is a 7.2.6 installation or upgrade result. This commit must match the pinned 7.2.6 candidate and explicit health, loopback, guard and related upgrade/rollback source boundaries; full exact-commit CI is independently required. No VPS is contacted and no public client connectivity is attested.'
            cat "$RUNNER_TEMP/rr-owner-recovery-evidence.txt"
          } >> "$GITHUB_STEP_SUMMARY"
