name: Release recovery evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-recovery-evidence
  cancel-in-progress: false

# Keep this workflow path for installed 7.2.1 update guards. Its declared
# scope is owner-reported Debian recovery evidence bound to this candidate;
# the three deleted VPS hosts are no longer an available validation target.
jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    name: Verify approved owner recovery evidence and candidate hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify this commit's bundle and approved recovery evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          python3 scripts/verify-owner-recovery-evidence.py --require-approved-policy \
            | tee "$RUNNER_TEMP/rr-owner-recovery-evidence.txt"
          {
            printf 'Candidate commit: `%s`\n\n' "$GITHUB_SHA"
            printf '%s\n\n' 'Scope: owner-reported Debian 12 repair, identity preservation and no Nexus installation; candidate artifacts are verified against that recorded evidence. This workflow does not run a three-host VPS test or establish client connectivity.'
            cat "$RUNNER_TEMP/rr-owner-recovery-evidence.txt"
          } >> "$GITHUB_STEP_SUMMARY"
