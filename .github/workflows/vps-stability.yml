name: Three-host installation diagnostics

on:
  push:
    branches: [audit/stability-20260907]
    paths: [.github/workflows/vps-stability.yml, scripts/audit-stability-host.sh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-release-audit
  cancel-in-progress: false

jobs:
  stability:
    if: github.ref == 'refs/heads/audit/stability-20260907'
    name: Stability · ${{ matrix.role }} · ${{ matrix.os }} ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: A
            os: debian
            version: '12'
            key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm
          - role: B
            os: ubuntu
            version: '22.04'
            key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A
          - role: C
            os: ubuntu
            version: '24.04'
            key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate candidate and prepare SSH
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          bash -n scripts/audit-stability-host.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass netcat-openbsd
      - name: Read previous installation log (no installation)
        env:
          HOST: ${{ secrets[format('RR_{0}_HOST', matrix.role)] }}
          SSHPASS: ${{ secrets[format('RR_{0}_PASS', matrix.role)] }}
          HOST_KEY: ${{ matrix.key }}
          ROLE: ${{ matrix.role }}
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_OS_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          set +x
          test -n "$HOST"
          test -n "$SSHPASS"
          known_hosts="$RUNNER_TEMP/rr-stability-known-hosts"
          (umask 077; printf '%s %s\n' "$HOST" "$HOST_KEY" > "$known_hosts")
          ssh_opts=(-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts" -o HostKeyAlgorithms=ssh-ed25519
            -o PreferredAuthentications=password -o PubkeyAuthentication=no
            -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=6)
          sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" 'install -d -m 700 /root/rr-stability-candidate'
          sha256sum rr-bundle.tar.gz scripts/install-core.sh scripts/update-guard.sh scripts/audit-stability-host.sh |
            sed 's@  scripts/@  @' > "$RUNNER_TEMP/transfer.sha256"
          sshpass -e scp "${ssh_opts[@]}" -q rr-bundle.tar.gz scripts/install-core.sh scripts/update-guard.sh \
            scripts/audit-stability-host.sh "$RUNNER_TEMP/transfer.sha256" "root@$HOST:/root/rr-stability-candidate/"
          sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" python3 - <<'PY'
          import re
          from pathlib import Path
          lines = Path('/root/rr-stability.log').read_text(errors='replace').splitlines()
          for line in lines[-75:]:
              line = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', line)
              line = re.sub(r'(?:\d{1,3}\.){3}\d{1,3}', '[IP]', line)
              line = re.sub(r'https?://\S+', '[URL]', line)
              line = re.sub(r'[!-~]{8,}', '[redacted]', line)
              if line.strip(): print(line[:240])
          for path in ('/etc/argo_vmess.conf','/usr/local/bin/sing-box'):
              print('exists',path,Path(path).exists())
          PY
