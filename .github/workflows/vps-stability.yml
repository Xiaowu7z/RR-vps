name: Release recovery evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-recovery-evidence
  cancel-in-progress: false

# Keep this workflow path for installed 7.2.1 update guards. Its declared
# scope preserves the pinned historical Debian recovery receipt and verifies
# reviewed current-candidate hashes and restricted changes separately. It does
# not claim a live VPS test for later versions or contact the deleted hosts.
jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    name: Verify approved historical recovery evidence and current candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify this commit's bundle and approved recovery evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          python3 scripts/verify-owner-recovery-evidence.py --require-approved-policy \
            | tee "$RUNNER_TEMP/rr-owner-recovery-evidence.txt"
          {
            printf 'Candidate commit: `%s`\n\n' "$GITHUB_SHA"
            printf '%s\n\n' 'Scope: the owner-reported Debian 12 repair receipt stays bound to its original 7.2.4 bundle and helper. Current release hashes and restricted Cloudflared-only changes are checked separately; full exact-commit CI is independently required. This workflow does not attest to a 7.2.5 AWS installation, run a VPS test or establish client connectivity.'
            cat "$RUNNER_TEMP/rr-owner-recovery-evidence.txt"
          } >> "$GITHUB_STEP_SUMMARY"
