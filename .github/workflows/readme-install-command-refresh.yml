name: Refresh README install commands

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readme-install-command-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cache-busting install commands
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'bash <(curl -fsSL https://raw.githubusercontent.com/Xiaowu7z/RR-vps/refs/heads/main/install.sh)':
              'bash <(curl -fsSL "https://raw.githubusercontent.com/Xiaowu7z/RR-vps/refs/heads/main/install.sh?t=$(date +%s)")',
              'bash <(wget -qO- https://raw.githubusercontent.com/Xiaowu7z/RR-vps/refs/heads/main/install.sh)':
              'bash <(wget -qO- "https://raw.githubusercontent.com/Xiaowu7z/RR-vps/refs/heads/main/install.sh?t=$(date +%s)")',
          }

          for filename in ('README.md', 'README_EN.md'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit README changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README_EN.md
          git diff --cached --check
          git commit -m 'docs: add cache-busting install commands'
          git push
