name: Cross OS multi-server management

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-release-audit
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory · ${{ matrix.role }}
    if: github.ref == 'refs/heads/codex/cross-os-management-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: A
            key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm
          - role: B
            key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A
          - role: C
            key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Read the existing test host state
        env:
          HOST: ${{ secrets[format('RR_{0}_HOST', matrix.role)] }}
          SSHPASS: ${{ secrets[format('RR_{0}_PASS', matrix.role)] }}
          HOST_KEY: ${{ matrix.key }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          set +x
          test -n "$HOST" && test -n "$SSHPASS"
          case "$HOST" in 154.17.22.91|191.223.212.73) echo 'Primary host refused'; exit 1;; esac
          known_hosts="$RUNNER_TEMP/cross-known-hosts"
          (umask 077; printf '%s %s\n' "$HOST" "$HOST_KEY" > "$known_hosts")
          ssh_opts=(-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts" -o HostKeyAlgorithms=ssh-ed25519
            -o PreferredAuthentications=password -o PubkeyAuthentication=no
            -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=3)
          sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" python3 - "$ROLE" \
            < scripts/audit-cross-inventory.py | tee "$RUNNER_TEMP/cross-inventory.txt"
          cat "$RUNNER_TEMP/cross-inventory.txt" >> "$GITHUB_STEP_SUMMARY"

  cross-management:
    name: Six directions · real TLS and remote management
    needs: inventory
    if: github.ref == 'refs/heads/codex/cross-os-management-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate the candidate and focused regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass python3-argon2
          python3 scripts/rebuild-bundle.py --check
          python3 -m py_compile scripts/audit-cross-*.py
          bash tests/test-nexus-remote-ui.sh
          PATH="/usr/bin:$PATH" bash tests/test-nexus-remote-add-concurrency.sh
          /usr/bin/python3 scripts/validate-7.1.py
      - name: Exercise six real cross-host management paths and restore fixtures
        env:
          RR_A_HOST: ${{ secrets.RR_A_HOST }}
          RR_A_PASS: ${{ secrets.RR_A_PASS }}
          RR_B_HOST: ${{ secrets.RR_B_HOST }}
          RR_B_PASS: ${{ secrets.RR_B_PASS }}
          RR_C_HOST: ${{ secrets.RR_C_HOST }}
          RR_C_PASS: ${{ secrets.RR_C_PASS }}
        run: |
          set -euo pipefail
          set +x
          python3 scripts/audit-cross-runner.py | tee "$RUNNER_TEMP/cross-results.txt"
      - name: Record credential-free result markers
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cross-results.txt" ]; then
            cat "$RUNNER_TEMP/cross-results.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
