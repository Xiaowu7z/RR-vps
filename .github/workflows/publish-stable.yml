name: Finalize stable release

on:
  workflow_run:
    workflows: [CI, Release recovery evidence]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: finalize-stable-release
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the existing publisher after both exact main checks
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          api="/repos/$GITHUB_REPOSITORY"
          current=$(gh api "$api/git/ref/heads/main" --jq '.object.sha')
          [ "$current" = "$EXPECTED_SHA" ] || exit 0
          version=$(gh api "$api/contents/version?ref=$EXPECTED_SHA" --jq '.content' | base64 -d | head -n 1)
          [[ "$version" =~ ^RR-vps\ ((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]] || {
            echo 'Version must be a canonical RR-vps MAJOR.MINOR.PATCH line.' >&2
            exit 1
          }
          release_tag="v${BASH_REMATCH[1]}"
          # Documentation-only main commits must not republish an existing
          # immutable version. Drafts remain eligible for publisher recovery.
          published_tags=$(gh api --paginate "$api/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')
          if grep -Fxq -- "$release_tag" <<<"$published_tags"; then
            echo "${release_tag} is already published; waiting for a new version."
            exit 0
          fi
          for workflow in ci.yml vps-stability.yml; do
            runs=$(gh api "$api/actions/workflows/$workflow/runs?branch=main&event=push&head_sha=$EXPECTED_SHA&per_page=100")
            if ! jq -e --arg sha "$EXPECTED_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")]
              | sort_by([.run_number,.run_attempt]) | last
              | .status == "completed" and .conclusion == "success"
            ' <<<"$runs" >/dev/null; then
              echo 'Waiting for both main checks.'
              exit 0
            fi
          done
          # The publisher independently rechecks main, complete run inventories,
          # immutable-release settings and asset ownership before every mutation.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "sha=$EXPECTED_SHA"
