name: Finish existing stability sessions

on:
  push:
    branches: [audit/stability-20260907]
    paths: [.github/workflows/vps-observe.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-stability-observe
  cancel-in-progress: false

jobs:
  stability:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/audit/stability-20260907'
    name: Stability · ${{ matrix.role }} · ${{ matrix.os }} ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: A
            os: debian
            version: '12'
            key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm
          - role: B
            os: ubuntu
            version: '22.04'
            key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A
          - role: C
            os: ubuntu
            version: '24.04'
            key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate candidate and prepare SSH
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          bash -n scripts/audit-stability-host.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass netcat-openbsd
      - name: Resume installed hosts and run stability check
        env:
          HOST: ${{ secrets[format('RR_{0}_HOST', matrix.role)] }}
          SSHPASS: ${{ secrets[format('RR_{0}_PASS', matrix.role)] }}
          HOST_KEY: ${{ matrix.key }}
          ROLE: ${{ matrix.role }}
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_OS_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          set +x
          test -n "$HOST"
          test -n "$SSHPASS"
          known_hosts="$RUNNER_TEMP/rr-stability-known-hosts"
          (umask 077; printf '%s %s\n' "$HOST" "$HOST_KEY" > "$known_hosts")
          ssh_opts=(-o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts" -o HostKeyAlgorithms=ssh-ed25519
            -o PreferredAuthentications=password -o PubkeyAuthentication=no
            -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=6)
          sshpass -e ssh "${ssh_opts[@]}" "root@$HOST" bash -s <<'SH'
          for module in /usr/local/lib/rr/modules/*.sh; do source "$module"; done
          release_test_channel() {
            load_config_with_defaults || return 1
            pid=$(cat "$SUB_PID_FILE") || return 1
            is_subscription_pid "$pid" || return 1
            if [ -e "/proc/$pid/fd/3" ]; then
              stop_subscription_servers || return 1
              SUB_BIND_ADDRESS=127.0.0.1
              start_subscription_server || return 1
              echo 'Closed inherited audit output descriptor by restarting the owned subscription worker.'
            fi
          }
          rr_menu_run_writer release_test_channel
          systemctl show sing-box.service rr-nexus.service -p ActiveState -p SubState
          SH
