name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-cryptography python3-argon2
          shellcheck --severity=error rr install.sh modules/*.sh scripts/*.sh tests/*.sh

      - name: Update guard compatibility contract
        run: |
          set -euo pipefail
          bash -n install.sh scripts/install-core.sh scripts/update-guard.sh
          grep -Fq 'RR_CORE_URL="${RR_RAW_BASE}/scripts/install-core.sh"' install.sh
          grep -Fq 'RR_GUARD_URL="${RR_RAW_BASE}/scripts/update-guard.sh"' install.sh
          grep -Fq '61-update-guard.sh' install.sh
          grep -q '^RR_UPDATE_GUARD_VERSION=' scripts/update-guard.sh
          grep -q '^check_update() {' scripts/update-guard.sh
          grep -q '^do_update() {' scripts/update-guard.sh
          grep -Fq 'bash "$bootstrap_tmp" --upgrade' scripts/update-guard.sh
          if grep -Eq 'rr_manifest_is_valid|rr_bundle_(archive|tree)_is_valid|tar[[:space:]].*rr-bundle' scripts/update-guard.sh; then
            echo 'Update guard must never parse manifest file types or bundle members.' >&2
            exit 1
          fi

          guard_tmp=$(mktemp -d)
          trap 'rm -rf "$guard_tmp"' EXIT
          # shellcheck disable=SC1091
          source scripts/update-guard.sh
          RR_LOCAL_MANIFEST="$guard_tmp/local.manifest"
          remote_fixture="$guard_tmp/remote.fixture"
          printf '%s\n' 'old-format-entry' > "$RR_LOCAL_MANIFEST"
          cp "$RR_LOCAL_MANIFEST" "$remote_fixture"
          rr_update_guard_download() { cp "$remote_fixture" "$2"; }
          check_update
          [ "$UPDATE_CHECK_STATE" = latest ]
          printf '%s\n' 'old-format-entry' 'future/new/type/file.xyz' > "$remote_fixture"
          check_update
          [ "$UPDATE_CHECK_STATE" = available ]
          [ "$UPDATE_AVAILABLE" = true ]

      - name: Python syntax
        run: |
          find nexus -type f -name '*.py' -print0 | xargs -0 python3 -m py_compile
          python3 -m py_compile scripts/rebuild-bundle.py
          python3 scripts/validate-7.1.py

      - name: Manifest SHA256
        run: |
          awk 'NF!=2||length($1)!=64{print"BAD:"$0;e=1}END{exit e}' manifest.sha256
          sha256sum -c manifest.sha256

      - name: Deterministic release bundle
        run: python3 scripts/rebuild-bundle.py --check

      - name: Repository regression suite
        run: bash scripts/validate.sh

      - name: Standalone security, firewall and concurrency regressions
        run: |
          set -euo pipefail
          for test_script in tests/test-*.sh; do
            echo "Running ${test_script}"
            bash "$test_script"
          done

  os-matrix:
    name: ${{ matrix.name }} clean install / hot update / rollback / uninstall
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates coreutils curl findutils mawk grep gzip jq \
            openssl procps python3 sed sqlite3 systemd tar util-linux wget \
            python3-cryptography python3-argon2
      - name: Full OS transaction smoke
        run: bash scripts/os-matrix-smoke.sh
