name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-cryptography python3-argon2 python3-yaml
          shellcheck --severity=error rr install.sh modules/*.sh scripts/*.sh \
            tests/*.sh assets/cf-optimizer/*.sh

      - name: Update guard compatibility contract
        run: |
          set -euo pipefail
          bash -n install.sh scripts/install-core.sh scripts/update-guard.sh
          grep -Fq 'RR_CORE_URL="${RR_RAW_BASE}/scripts/install-core.sh"' install.sh
          grep -Fq 'RR_GUARD_URL="${RR_RAW_BASE}/scripts/update-guard.sh"' install.sh
          grep -Fq '61-update-guard.sh' install.sh
          grep -q '^RR_UPDATE_GUARD_VERSION=' scripts/update-guard.sh
          grep -q '^check_update() {' scripts/update-guard.sh
          grep -q '^do_update() {' scripts/update-guard.sh
          grep -Fq 'bash "$bootstrap_tmp" --upgrade' scripts/update-guard.sh
          if grep -Eq 'rr_manifest_is_valid|rr_bundle_(archive|tree)_is_valid|tar[[:space:]].*rr-bundle' scripts/update-guard.sh; then
            echo 'Update guard must never parse manifest file types or bundle members.' >&2
            exit 1
          fi

          guard_tmp=$(mktemp -d)
          trap 'rm -rf "$guard_tmp"' EXIT
          # shellcheck disable=SC1091
          source scripts/update-guard.sh
          RR_LOCAL_MANIFEST="$guard_tmp/local.manifest"
          remote_fixture="$guard_tmp/remote.fixture"
          printf '%s\n' 'old-format-entry' > "$RR_LOCAL_MANIFEST"
          cp "$RR_LOCAL_MANIFEST" "$remote_fixture"
          # Stable consumes an immutable verified release asset, never Raw.
          rr_update_guard_download() { return 1; }
          rr_update_guard_copy_verified_asset() {
            [ "$1" = manifest.sha256 ] && cp "$remote_fixture" "$2"
          }
          check_update
          [ "$UPDATE_CHECK_STATE" = latest ]
          [ "$UPDATE_AVAILABLE" = false ]
          printf '%s\n' 'old-format-entry' 'future/new/type/file.xyz' > "$remote_fixture"
          check_update
          [ "$UPDATE_CHECK_STATE" = available ]
          [ "$UPDATE_AVAILABLE" = true ]

      - name: Python syntax
        run: |
          find nexus -type f -name '*.py' -print0 | xargs -0 python3 -m py_compile
          python3 -m py_compile scripts/rebuild-bundle.py scripts/update-external-state.py
          python3 scripts/validate-7.1.py

      - name: Manifest SHA256
        run: |
          awk 'NF!=2||length($1)!=64{print"BAD:"$0;e=1}END{exit e}' manifest.sha256
          sha256sum -c manifest.sha256

      - name: Deterministic release bundle
        run: python3 scripts/rebuild-bundle.py --check

      - name: v7.2 core, public-IP ACME, rollback, and release trust regressions
        # Every fixture redirects or mocks systemd/Nginx/GitHub. Most remain
        # unprivileged; only tests whose production contract proves uid 0
        # ownership use sudo. Both groups receive isolated HOME/TMPDIR/XDG.
        run: |
          set -euo pipefail
          trust_root=$(mktemp -d "${RUNNER_TEMP}/rr-v72-trust.XXXXXX")
          cleanup_trust_root() {
            case "$trust_root" in
              "${RUNNER_TEMP}"/rr-v72-trust.*)
                # Root-contract fixtures can leave root-owned temporary
                # objects when an assertion aborts, so cleanup uses sudo too.
                sudo rm -rf -- "$trust_root"
                ;;
              *) return 1 ;;
            esac
          }
          trap cleanup_trust_root EXIT
          install -d -m 700 \
            "$trust_root/home" "$trust_root/tmp" \
            "$trust_root/xdg-config" "$trust_root/xdg-cache" "$trust_root/xdg-data"
          export HOME="$trust_root/home"
          export TMPDIR="$trust_root/tmp"
          export XDG_CONFIG_HOME="$trust_root/xdg-config"
          export XDG_CACHE_HOME="$trust_root/xdg-cache"
          export XDG_DATA_HOME="$trust_root/xdg-data"
          # Defense in depth for any fixture that loads the production Nexus
          # helpers: fixed certificate-gate paths must remain under the
          # disposable test root even if a test forgets a local override.
          export NEXUS_IP_CERT_GATE_SCRIPT="$trust_root/runtime/nexus-ip-cert-gate"
          export NEXUS_IP_CERT_GATE_DROPIN="$trust_root/runtime/nginx.service.d/zzzzzz-rr-nexus-ip-cert-gate.conf"
          umask 077
          unprivileged_tests=(
            tests/test-installer-restore-gate.sh
            tests/test-nexus-core-supply-chain.sh
            tests/test-nexus-ip-subscription-urls.sh
            tests/test-release-evidence-events.sh
            tests/test-release-gate.sh
            tests/test-release-publication-races.sh
            tests/test-release-reconciliation.sh
            tests/test-singbox-114.sh
            tests/test-stable-update-trust.sh
            tests/test-vps-ip-acme-workflow.sh
          )
          root_contract_tests=(
            tests/test-install-recovery-runtime.sh
            tests/test-nexus-gate-rollback.sh
            tests/test-nexus-ip-acme.sh
          )
          for test_script in "${unprivileged_tests[@]}"; do
            [ -f "$test_script" ] && [ ! -L "$test_script" ]
            echo "Running isolated unprivileged ${test_script}"
            bash "$test_script"
          done
          for test_script in "${root_contract_tests[@]}"; do
            [ -f "$test_script" ] && [ ! -L "$test_script" ]
            echo "Running isolated root-ownership contract ${test_script}"
            sudo --preserve-env=HOME,TMPDIR,XDG_CONFIG_HOME,XDG_CACHE_HOME,XDG_DATA_HOME,NEXUS_IP_CERT_GATE_SCRIPT,NEXUS_IP_CERT_GATE_DROPIN \
              bash "$test_script"
          done

      - name: Repository regression suite
        # Restore/update regressions intentionally assert root:root ownership
        # for locks, stages, and durable transaction markers.
        run: sudo -E bash scripts/validate.sh

      - name: Standalone security, firewall and concurrency regressions
        run: |
          set -euo pipefail
          for test_script in tests/test-*.sh; do
            echo "Running ${test_script}"
            case "${test_script##*/}" in
              test-installer-restore-gate.sh|\
              test-install-recovery-runtime.sh|\
              test-nexus-core-supply-chain.sh|\
              test-nexus-gate-rollback.sh|\
              test-nexus-ip-acme.sh|\
              test-nexus-ip-subscription-urls.sh|\
              test-release-evidence-events.sh|\
              test-release-gate.sh|\
              test-release-publication-races.sh|\
              test-release-reconciliation.sh|\
              test-singbox-114.sh|\
              test-stable-update-trust.sh|\
              test-vps-ip-acme-workflow.sh)
                # Already executed above with explicit isolated privileges.
                continue
                ;;
              test-backup-archive.sh|\
              test-cert-hook.sh|\
              test-cert-reload-pending.sh|\
              test-cloudflared-supply-chain.sh|\
              test-firewall-transaction.sh|\
              test-health-transaction-lock.sh|\
              test-install-core-rollback-boundary.sh|\
              test-ip-acme-restore-update.sh|\
              test-menu-writer-lock.sh|\
              test-nexus-firewall-lifecycle.sh|\
              test-nexus-nginx.sh|\
              test-nexus-process-generation.sh|\
              test-nexus-sync.sh|\
              test-restore-watchdog.sh|\
              test-singbox-credential-atomicity.sh|\
              test-update-external-state.sh|\
              test-update-external-transaction.sh|\
              test-update-firewall-finalize.sh|\
              test-update-lock-security.sh|\
              test-update-recover-ip-acme.sh|\
              test-update-rollback-quarantine.sh|\
              test-update-side-effect-guards.sh|\
              test-uninstall-cert-hook.sh|\
              test-uninstall-ip-acme.sh|\
              test-uninstall-quarantine.sh|\
              test-update-writer-freeze.sh)
                sudo -E bash "$test_script"
                ;;
              *)
                bash "$test_script"
                ;;
            esac
          done

  os-matrix:
    name: ${{ matrix.name }} clean install / hot update / rollback / uninstall
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates coreutils curl findutils mawk grep gzip jq \
            openssl procps python3 sed sqlite3 systemd tar util-linux wget \
            python3-cryptography python3-argon2
      - name: Full OS transaction smoke
        run: bash scripts/os-matrix-smoke.sh
