name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck rr install.sh modules/*.sh 2>&1 | grep -v '^$' || true
      - name: Python syntax
        run: python3 -c "compile(open('nexus/rr_nexus.py').read(),'rr_nexus.py','exec')"
      - name: Manifest SHA256
        run: |
          awk 'NF!=2||length($1)!=64{print"BAD:"$0;e=1}END{exit e}' manifest.sha256
          sha256sum -c manifest.sha256
