name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error rr install.sh modules/*.sh scripts/*.sh

      - name: Python syntax
        run: |
          python3 -m py_compile nexus/rr_nexus.py scripts/rebuild-bundle.py

      - name: Manifest SHA256
        run: |
          awk 'NF!=2||length($1)!=64{print"BAD:"$0;e=1}END{exit e}' manifest.sha256
          sha256sum -c manifest.sha256

      - name: Deterministic release bundle
        run: python3 scripts/rebuild-bundle.py --check

      - name: Repository regression suite
        run: bash scripts/validate.sh
