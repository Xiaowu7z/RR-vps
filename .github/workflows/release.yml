name: Publish release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve and verify release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^SCRIPT_VERSION="\([0-9][0-9.]*\)"/\1/p' modules/00-runtime.sh)
          [[ -n "$version" ]]
          grep -Fq "## ${version} -" CHANGELOG.md
          python3 scripts/rebuild-bundle.py --check
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          sha256sum rr-bundle.tar.gz

          awk -v prefix="## ${version} " '
            index($0, prefix) == 1 { capture = 1 }
            capture && /^## / && index($0, prefix) != 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          [[ -s release-notes.md ]]

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; keeping the immutable published version."
            exit 0
          fi
          gh release create "$TAG" rr-bundle.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "RR-vps ${VERSION} 正式版" \
            --notes-file release-notes.md
