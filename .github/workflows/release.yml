name: Publish release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA that already passed CI and VPS audit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require the current main tip and successful CI and VPS gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_SETTINGS_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN || github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "sha must be a full lowercase commit SHA." >&2
            exit 1
          }
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]
          [ "$GITHUB_REF" = refs/heads/main ] || {
            echo "Releases must be dispatched from the main workflow ref." >&2
            exit 1
          }
          [ "$GITHUB_SHA" = "$REQUESTED_SHA" ] || {
            echo "The dispatched workflow revision is not the requested commit." >&2
            exit 1
          }

          main_sha=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [ "$main_sha" = "$REQUESTED_SHA" ] || {
            echo "Requested SHA is not the current remote main tip." >&2
            exit 1
          }

          require_workflow_success_for_sha() (
            local workflow_file="$1" expected_event="$2" gate_name="$3"
            local page=1 page_count=0 expected_total="" accumulated=0
            local response="" runs_file=""
            runs_file=$(mktemp) || return 1
            trap 'rm -f -- "$runs_file"' EXIT
            while :; do
              response=$(gh api \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&event=${expected_event}&head_sha=${REQUESTED_SHA}&per_page=100&page=${page}") || return 1
              jq -e '
                type == "object" and
                (.total_count | type == "number") and
                .total_count == (.total_count | floor) and
                .total_count >= 0 and .total_count <= 10000 and
                (.workflow_runs | type == "array") and
                (.workflow_runs | length) <= 100 and
                all(.workflow_runs[]; type == "object")
              ' <<<"$response" >/dev/null || return 1
              if [ -z "$expected_total" ]; then
                expected_total=$(jq -r '.total_count' <<<"$response")
              elif [ "$(jq -r '.total_count' <<<"$response")" != "$expected_total" ]; then
                echo "The ${gate_name} run inventory changed while it was paginated." >&2
                return 1
              fi
              page_count=$(jq -r '.workflow_runs | length' <<<"$response")
              jq -c '.workflow_runs[]' <<<"$response" >>"$runs_file" || return 1
              accumulated=$((accumulated + page_count))
              [ "$accumulated" -le "$expected_total" ] || return 1
              [ "$page_count" -eq 100 ] || break
              page=$((page + 1))
              [ "$page" -le 101 ] || return 1
            done
            [ "$accumulated" -eq "$expected_total" ] || {
              echo "The ${gate_name} run inventory was incomplete." >&2
              return 1
            }
            jq -se --arg sha "$REQUESTED_SHA" --arg event "$expected_event" '
              . as $inventory |
              ($inventory | map(select(
                .head_sha == $sha and .head_branch == "main" and .event == $event
              ))) as $exact |
              all($inventory[];
                (.id | type == "number") and .id == (.id | floor) and .id > 0 and
                (.run_number | type == "number") and
                  .run_number == (.run_number | floor) and .run_number > 0 and
                (.run_attempt | type == "number") and
                  .run_attempt == (.run_attempt | floor) and .run_attempt > 0 and
                (.status | type == "string") and
                (.conclusion == null or (.conclusion | type == "string"))) and
              ([$inventory[].id] | length) ==
                ([$inventory[].id] | unique | length) and
              ($inventory | group_by([.run_number, .run_attempt]) |
                all(.[]; length == 1)) and
              ($exact | length) > 0 and
              ($exact | sort_by([.run_number, .run_attempt]) | last) as $run |
              $run.status == "completed" and $run.conclusion == "success"
            ' "$runs_file" >/dev/null || {
              echo "The latest exact ${gate_name} run is not a completed success for the requested SHA." >&2
              return 1
            }
          )

          require_workflow_success_for_sha ci.yml push "CI push"
          require_workflow_success_for_sha vps-audit.yml push "VPS audit push"
          require_workflow_success_for_sha vps-audit.yml workflow_dispatch \
            "VPS audit workflow_dispatch"
          main_sha=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [ "$main_sha" = "$REQUESTED_SHA" ] || {
            echo "Main advanced while the CI and VPS gates were being checked." >&2
            exit 1
          }

          if ! immutable_settings=$(GH_TOKEN="$IMMUTABLE_SETTINGS_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/immutable-releases"); then
            echo "Cannot read immutable-release settings. Configure IMMUTABLE_RELEASES_READ_TOKEN with Administration:read for this repository." >&2
            exit 1
          fi
          jq -e '.enabled == true' <<<"$immutable_settings" >/dev/null || {
            echo "Repository immutable releases must be enabled before publishing." >&2
            exit 1
          }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error rr install.sh modules/*.sh scripts/*.sh

      - name: Resolve and verify release
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$REQUESTED_SHA" ]
          version=$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)"/\1/p' modules/00-runtime.sh)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "SCRIPT_VERSION must be a canonical MAJOR.MINOR.PATCH version." >&2
            exit 1
          }
          grep -Fq "## ${version} -" CHANGELOG.md
          bash scripts/pre-push-test.sh
          {
            printf 'version=%s\n' "$version"
            printf 'tag=v%s\n' "$version"
            printf 'sha=%s\n' "$REQUESTED_SHA"
          } >> "$GITHUB_OUTPUT"
          grep -Fxq "RR_RELEASE_TAG=\"v${version}\"" install.sh
          grep -Fxq "RR_RELEASE_TAG=\"v${version}\"" scripts/install-core.sh
          cat > RELEASE_INFO <<EOF
          VERSION=${version}
          TAG=v${version}
          COMMIT=${REQUESTED_SHA}
          EOF
          sha256sum install.sh manifest.sha256 rr-bundle.tar.gz RELEASE_INFO > SHA256SUMS
          sha256sum -c SHA256SUMS
          for asset in install.sh manifest.sha256 rr-bundle.tar.gz RELEASE_INFO SHA256SUMS; do
            if [ ! -f "$asset" ] || [ -L "$asset" ]; then
              echo "Release asset is not a regular non-symlink file: $asset" >&2
              exit 1
            fi
          done

          awk -v prefix="## ${version} " '
            index($0, prefix) == 1 { capture = 1 }
            capture && /^## / && index($0, prefix) != 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          [[ -s release-notes.md ]]

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Product and auxiliary releases share this repository-wide publication
    # lock. A running publication is never cancelled halfway through.
    concurrency:
      group: rr-vps-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate verification outputs
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.tag }}
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFIED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [ "$VERIFIED_SHA" = "$REQUESTED_SHA" ]
          [ "$VERIFIED_SHA" = "$GITHUB_SHA" ]
          [ "$VERIFIED_TAG" = "v${VERIFIED_VERSION}" ]
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]
          [ "$GITHUB_REF" = refs/heads/main ]

      # This job deliberately checks out only the exact verified revision and
      # never executes a script from it while holding contents:write.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            install.sh
            manifest.sha256
            modules/00-runtime.sh
            rr-bundle.tar.gz
          sparse-checkout-cone-mode: false

      - name: Prepare and verify the fixed release payload without repository scripts
        shell: bash
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.tag }}
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$VERIFIED_SHA" ]
          version=$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)"/\1/p' modules/00-runtime.sh)
          [ "$version" = "$VERIFIED_VERSION" ]
          grep -Fq "## ${VERIFIED_VERSION} -" CHANGELOG.md
          grep -Fxq "RR_RELEASE_TAG=\"${VERIFIED_TAG}\"" install.sh

          cat > RELEASE_INFO <<EOF
          VERSION=${VERIFIED_VERSION}
          TAG=${VERIFIED_TAG}
          COMMIT=${VERIFIED_SHA}
          EOF
          sha256sum install.sh manifest.sha256 rr-bundle.tar.gz RELEASE_INFO > SHA256SUMS
          sha256sum -c SHA256SUMS
          for asset in install.sh manifest.sha256 rr-bundle.tar.gz RELEASE_INFO SHA256SUMS; do
            [ -f "$asset" ] && [ ! -L "$asset" ] || {
              echo "Release asset is not a regular non-symlink file: $asset" >&2
              exit 1
            }
          done

          awk -v prefix="## ${VERIFIED_VERSION} " '
            index($0, prefix) == 1 { capture = 1 }
            capture && /^## / && index($0, prefix) != 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] && [ ! -L release-notes.md ]

      - name: Publish a new immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
          IMMUTABLE_SETTINGS_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN || github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          api() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "$@"
          }

          assert_workflow_gate() (
            local workflow_file="$1" expected_event="$2" gate_name="$3"
            local page=1 page_count=0 expected_total="" accumulated=0
            local response="" runs_file=""
            runs_file=$(mktemp) || return 1
            trap 'rm -f -- "$runs_file"' EXIT
            while :; do
              response=$(api \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&event=${expected_event}&head_sha=${EXPECTED_SHA}&per_page=100&page=${page}") || return 1
              jq -e '
                type == "object" and
                (.total_count | type == "number") and
                .total_count == (.total_count | floor) and
                .total_count >= 0 and .total_count <= 10000 and
                (.workflow_runs | type == "array") and
                (.workflow_runs | length) <= 100 and
                all(.workflow_runs[]; type == "object")
              ' <<<"$response" >/dev/null || return 1
              if [ -z "$expected_total" ]; then
                expected_total=$(jq -r '.total_count' <<<"$response")
              elif [ "$(jq -r '.total_count' <<<"$response")" != "$expected_total" ]; then
                echo "The ${gate_name} run inventory changed while it was paginated." >&2
                return 1
              fi
              page_count=$(jq -r '.workflow_runs | length' <<<"$response")
              jq -c '.workflow_runs[]' <<<"$response" >>"$runs_file" || return 1
              accumulated=$((accumulated + page_count))
              [ "$accumulated" -le "$expected_total" ] || return 1
              [ "$page_count" -eq 100 ] || break
              page=$((page + 1))
              [ "$page" -le 101 ] || return 1
            done
            [ "$accumulated" -eq "$expected_total" ] || {
              echo "The ${gate_name} run inventory was incomplete." >&2
              return 1
            }
            jq -se --arg sha "$EXPECTED_SHA" --arg event "$expected_event" '
              . as $inventory |
              ($inventory | map(select(
                .head_sha == $sha and .head_branch == "main" and .event == $event
              ))) as $exact |
              all($inventory[];
                (.id | type == "number") and .id == (.id | floor) and .id > 0 and
                (.run_number | type == "number") and
                  .run_number == (.run_number | floor) and .run_number > 0 and
                (.run_attempt | type == "number") and
                  .run_attempt == (.run_attempt | floor) and .run_attempt > 0 and
                (.status | type == "string") and
                (.conclusion == null or (.conclusion | type == "string"))) and
              ([$inventory[].id] | length) ==
                ([$inventory[].id] | unique | length) and
              ($inventory | group_by([.run_number, .run_attempt]) |
                all(.[]; length == 1)) and
              ($exact | length) > 0 and
              ($exact | sort_by([.run_number, .run_attempt]) | last) as $run |
              $run.status == "completed" and $run.conclusion == "success"
            ' "$runs_file" >/dev/null || {
              echo "The latest exact ${gate_name} run is not a completed success for the release SHA." >&2
              return 1
            }
          )

          assert_verified_sha_gate() {
            assert_workflow_gate ci.yml push "CI push"
            assert_workflow_gate vps-audit.yml push "VPS audit push"
            assert_workflow_gate vps-audit.yml workflow_dispatch \
              "VPS audit workflow_dispatch"
          }

          assert_main_tip() {
            local main_sha
            # This is deliberately the final remote read in the gate. Never
            # publish an older candidate after main has advanced.
            main_sha=$(api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
            [ "$main_sha" = "$EXPECTED_SHA" ] || {
              echo "Main no longer points to the verified release SHA." >&2
              return 1
            }
          }

          assert_release_gate() {
            assert_verified_sha_gate
            assert_main_tip
          }

          assert_immutable_releases_enabled() {
            local settings
            if ! settings=$(GH_TOKEN="$IMMUTABLE_SETTINGS_TOKEN" gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/immutable-releases"); then
              echo "Cannot read immutable-release settings. Configure IMMUTABLE_RELEASES_READ_TOKEN with Administration:read for this repository." >&2
              return 1
            fi
            jq -e '.enabled == true' <<<"$settings" >/dev/null || {
              echo "Repository immutable releases are not enabled." >&2
              return 1
            }
          }

          resolve_remote_tag_sha() {
            local tag="$1" lines peeled
            if ! lines=$(git ls-remote --tags origin \
              "refs/tags/${tag}" "refs/tags/${tag}^{}"); then
              echo "Failed to read remote tag $tag." >&2
              return 1
            fi
            peeled=$(awk '$2 ~ /\^\{\}$/ { print $1; exit }' <<<"$lines")
            if [ -n "$peeled" ]; then
              printf '%s\n' "$peeled"
            else
              awk -v ref="refs/tags/${tag}" '$2 == ref { print $1; exit }' <<<"$lines"
            fi
          }

          wait_for_remote_tag_sha() {
            local tag="$1" expected="$2" attempt actual
            for attempt in 1 2 3 4 5 6; do
              if actual=$(resolve_remote_tag_sha "$tag") && [ "$actual" = "$expected" ]; then
                return 0
              fi
              [ "$attempt" -eq 6 ] || sleep 2
            done
            echo "Remote tag $tag did not resolve to $expected." >&2
            return 1
          }

          list_target_releases() {
            local inventory
            inventory=$(api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100") || return 1
            jq -ce --arg tag "$TAG" '(add // []) | map(select(.tag_name == $tag))' \
              <<<"$inventory"
          }

          list_target_tag_refs() {
            local inventory
            inventory=$(api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${TAG}") || return 1
            jq -ce --arg ref "refs/tags/${TAG}" \
              '(add // []) | map(select(.ref == $ref))' <<<"$inventory"
          }

          load_owned_target_tag() {
            local refs="" count=0 ref_sha="" ref_type="" tag_json="" marker=""
            local owner_commit="" nonce="" payload_sha="" payload_b64="" payload="" canonical=""
            LOADED_TAG_STATE=unknown
            LOADED_TAG_OBJECT_SHA=""
            LOADED_TAG_OWNER_MARKER=""
            LOADED_TAG_OWNER_COMMIT=""
            LOADED_TAG_EXPECTED_ASSETS=""
            refs=$(list_target_tag_refs) || return 1
            count=$(jq -r 'length' <<<"$refs")
            [ "$count" -le 1 ] || {
              echo "Multiple exact refs exist for $TAG; refusing mutation." >&2
              return 1
            }
            if [ "$count" -eq 0 ]; then
              LOADED_TAG_STATE=absent
              return 0
            fi
            ref_sha=$(jq -r '.[0].object.sha' <<<"$refs")
            ref_type=$(jq -r '.[0].object.type' <<<"$refs")
            [[ "$ref_sha" =~ ^[0-9a-f]{40}$ ]] && [ "$ref_type" = tag ] || {
              LOADED_TAG_STATE=foreign
              echo "$TAG is not an owned annotated release tag." >&2
              return 1
            }
            tag_json=$(api "/repos/${GITHUB_REPOSITORY}/git/tags/${ref_sha}") || return 1
            marker=$(jq -r '.message' <<<"$tag_json")
            if [[ "$marker" =~ ^rr-vps-release-owner:v2:([^:]+):([0-9a-f]{40}):([0-9a-f]{64}):([0-9a-f]{64}):([A-Za-z0-9+/]*={0,2})$ ]]; then
              [ "${BASH_REMATCH[1]}" = "$TAG" ] || {
                LOADED_TAG_STATE=foreign
                return 1
              }
              owner_commit="${BASH_REMATCH[2]}"
              nonce="${BASH_REMATCH[3]}"
              payload_sha="${BASH_REMATCH[4]}"
              payload_b64="${BASH_REMATCH[5]}"
            else
              LOADED_TAG_STATE=foreign
              return 1
            fi
            payload=$(printf '%s' "$payload_b64" | base64 --decode) || {
              LOADED_TAG_STATE=foreign
              return 1
            }
            [ "$(printf '%s' "$payload" | base64 -w 0)" = "$payload_b64" ] &&
              [ "$(printf '%s' "$payload" | sha256sum | awk '{print $1}')" = "$payload_sha" ] || {
              LOADED_TAG_STATE=foreign
              return 1
            }
            canonical=$(jq -ceS '
              if type == "array" then
                [.[] | {name, size, digest}] | sort_by(.name)
              else error("asset payload is not an array") end
            ' <<<"$payload") || {
              LOADED_TAG_STATE=foreign
              return 1
            }
            [ "$canonical" = "$payload" ] && jq -e '
              length == 5 and
              ([.[].name] | sort) ==
                (["install.sh", "manifest.sha256", "rr-bundle.tar.gz", "RELEASE_INFO", "SHA256SUMS"] | sort) and
              ([.[].name] | length == (unique | length)) and
              all(.[];
                (keys | sort) == (["digest", "name", "size"] | sort) and
                (.name | type) == "string" and
                (.size | type) == "number" and .size == (.size | floor) and .size > 0 and
                (.digest | type) == "string" and
                (.digest | test("^sha256:[0-9a-f]{64}$")))
            ' <<<"$payload" >/dev/null || {
              LOADED_TAG_STATE=foreign
              return 1
            }
            jq -e --arg sha "$ref_sha" --arg tag "$TAG" --arg commit "$owner_commit" \
              --arg marker "$marker" \
              '.sha == $sha and .tag == $tag and .message == $marker and
               .object.type == "commit" and .object.sha == $commit and
               .tagger.name == "github-actions[bot]" and
               .tagger.email == "41898282+github-actions[bot]@users.noreply.github.com"' \
              <<<"$tag_json" >/dev/null || {
              LOADED_TAG_STATE=foreign
              echo "$TAG ownership metadata is inconsistent; refusing mutation." >&2
              return 1
            }
            LOADED_TAG_STATE=owned
            LOADED_TAG_OBJECT_SHA="$ref_sha"
            LOADED_TAG_OWNER_MARKER="$marker"
            LOADED_TAG_OWNER_COMMIT="$owner_commit"
            LOADED_TAG_EXPECTED_ASSETS="$payload"
          }

          assert_run_owned_target_tag() {
            load_owned_target_tag || return 1
            [ "$LOADED_TAG_STATE" = owned ] &&
              [ -n "${RUN_TAG_OBJECT_SHA:-}" ] &&
              [ -n "${RUN_OWNER_MARKER:-}" ] &&
              [ "$LOADED_TAG_OBJECT_SHA" = "$RUN_TAG_OBJECT_SHA" ] &&
              [ "$LOADED_TAG_OWNER_MARKER" = "$RUN_OWNER_MARKER" ] &&
              [ "$LOADED_TAG_OWNER_COMMIT" = "$EXPECTED_SHA" ] &&
              [ "$LOADED_TAG_EXPECTED_ASSETS" = "$expected_assets" ]
          }

          is_owned_mutable_draft() {
            local release_json="$1" owner_marker="$2" owner_commit="$3"
            local owner_assets="$4" body_marker=""
            body_marker="<!-- ${owner_marker} -->"
            jq -e --arg tag "$TAG" --arg sha "$owner_commit" \
              --arg title "$RELEASE_TITLE" --arg marker "$body_marker" \
              --argjson expected "$owner_assets" '
              (.id | type == "number") and .tag_name == $tag and
              .target_commitish == $sha and .name == $title and
              .draft == true and .prerelease == false and .immutable == false and
              .author.login == "github-actions[bot]" and
              (.body | type == "string") and
              (.body as $body | ($body | index($marker)) as $first |
                $first != null and
                (($body[($first + ($marker | length)):] | contains($marker)) | not)) and
              (.assets | type == "array") and
              ([.assets[].name] | length == (unique | length)) and
              all(.assets[];
                . as $actual | any($expected[];
                  .name == $actual.name and
                  (($actual.state == "uploaded" and
                    .size == $actual.size and .digest == $actual.digest and
                    $actual.uploader.login == "github-actions[bot]") or
                   ($actual.state == "starter" and $actual.size == 0 and
                    ($actual.digest == null or $actual.digest == "") and
                    $actual.uploader.login == "github-actions[bot]"))))
            ' <<<"$release_json" >/dev/null
          }

          is_exact_mutable_draft() {
            local release_json="$1" owner_marker="$2" owner_commit="$3"
            local owner_assets="$4"
            is_canonical_owned_partial_draft "$release_json" "$owner_marker" \
              "$owner_commit" "$owner_assets" &&
              jq -e --argjson expected "$owner_assets" '
                ([.assets[] | {name, size, digest}] | sort_by(.name)) == $expected
              ' \
                <<<"$release_json" >/dev/null
          }

          is_canonical_owned_partial_draft() {
            local release_json="$1" owner_marker="$2" owner_commit="$3"
            local owner_assets="$4" body_marker=""
            body_marker="<!-- ${owner_marker} -->"
            is_owned_mutable_draft "$release_json" "$owner_marker" \
              "$owner_commit" "$owner_assets" &&
              jq -e --rawfile notes "$RELEASE_NOTES_FILE" \
                --arg marker "$body_marker" '
                .body == ($notes + "\n" + $marker + "\n")
              ' <<<"$release_json" >/dev/null
          }

          is_exact_public_release() {
            local release_json="$1" expected_id="$2" owner_marker="$3"
            local owner_commit="$4" owner_assets="$5" body_marker=""
            body_marker="<!-- ${owner_marker} -->"
            jq -e --rawfile notes "$RELEASE_NOTES_FILE" \
              --argjson id "$expected_id" --arg tag "$TAG" --arg sha "$owner_commit" \
              --arg title "$RELEASE_TITLE" --arg marker "$body_marker" \
              --argjson expected "$owner_assets" '
              .id == $id and .tag_name == $tag and .target_commitish == $sha and
              .name == $title and .draft == false and .prerelease == false and
              (.immutable == true or .immutable == false) and
              .author.login == "github-actions[bot]" and
              .body == ($notes + "\n" + $marker + "\n") and
              ([.assets[].name] | length == (unique | length)) and
              ([.assets[] | {name, size, digest}] | sort_by(.name)) == $expected and
              all(.assets[];
                .state == "uploaded" and
                .uploader.login == "github-actions[bot]")
            ' <<<"$release_json" >/dev/null
          }

          delete_owned_target_tag() {
            local expected_object_sha="$1" expected_marker="$2" push_status=0
            load_owned_target_tag || return 1
            [ "$LOADED_TAG_STATE" = absent ] && return 0
            [ "$LOADED_TAG_STATE" = owned ] &&
              [ "$LOADED_TAG_OBJECT_SHA" = "$expected_object_sha" ] &&
              [ "$LOADED_TAG_OWNER_MARKER" = "$expected_marker" ] || return 1

            # GitHub's REST ref deletion endpoint has no conditional-write
            # contract. Smart push gives the deletion a server-side CAS: the
            # remote ref is removed only while it still names the exact owned
            # annotated object that was just verified.
            gh auth setup-git >/dev/null
            git push --porcelain \
              --force-with-lease="refs/tags/${TAG}:${expected_object_sha}" \
              origin ":refs/tags/${TAG}" >/dev/null 2>&1 || push_status=$?

            # A failed transport may still have delivered the push. Classify
            # the authoritative post-push state; never retry deletion against
            # a ref that could now be foreign.
            if ! load_owned_target_tag; then
              echo "Tag $TAG changed to an unrecognized object during CAS cleanup; it was not retried." >&2
              return 1
            fi
            case "$LOADED_TAG_STATE" in
              absent) return 0 ;;
              owned)
                if [ "$LOADED_TAG_OBJECT_SHA" = "$expected_object_sha" ]; then
                  echo "CAS cleanup left owned tag $TAG in place (push status $push_status)." >&2
                else
                  echo "Tag $TAG changed during CAS cleanup; the replacement was preserved." >&2
                fi
                return 1
                ;;
              *) return 1 ;;
            esac
          }

          reconcile_owned_mutable_target() {
            local releases="" count=0 release_json="" fresh_json=""
            local release_id="" expected_marker=""
            local required_object_sha="${1:-}" required_marker="${2:-}"
            releases=$(list_target_releases) || return 1
            count=$(jq -r 'length' <<<"$releases")
            [ "$count" -le 1 ] || {
              echo "Multiple releases use $TAG; refusing reconciliation." >&2
              return 1
            }
            if [ "$count" -eq 0 ]; then
              load_owned_target_tag || return 1
              case "$LOADED_TAG_STATE" in
                absent) return 0 ;;
                owned)
                  if [ -n "$required_object_sha" ] &&
                     { [ "$LOADED_TAG_OBJECT_SHA" != "$required_object_sha" ] ||
                       [ "$LOADED_TAG_OWNER_MARKER" != "$required_marker" ]; }; then
                    echo "The current tag is not owned by this cleanup transaction." >&2
                    return 1
                  fi
                  delete_owned_target_tag "$LOADED_TAG_OBJECT_SHA" "$LOADED_TAG_OWNER_MARKER"
                  ;;
                *) return 1 ;;
              esac
              return
            fi

            load_owned_target_tag || return 1
            [ "$LOADED_TAG_STATE" = owned ] || return 1
            if [ -n "$required_object_sha" ] &&
               { [ "$LOADED_TAG_OBJECT_SHA" != "$required_object_sha" ] ||
                 [ "$LOADED_TAG_OWNER_MARKER" != "$required_marker" ]; }; then
              echo "The current release/tag pair is not owned by this cleanup transaction." >&2
              return 1
            fi
            expected_marker="$LOADED_TAG_OWNER_MARKER"
            release_json=$(jq -c '.[0]' <<<"$releases")
            release_id=$(jq -r '.id' <<<"$release_json")
            [[ "$release_id" =~ ^[0-9]+$ ]] || return 1
            fresh_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}") || return 1
            [ "$(jq -r '.id' <<<"$fresh_json")" = "$release_id" ] || return 1

            # GitHub does not support conditional DELETE/PATCH semantics for a
            # draft release. Never delete a draft automatically. A canonical
            # owned subset is durable retry state; every other release state
            # is left untouched and rejected.
            is_canonical_owned_partial_draft "$fresh_json" "$expected_marker" \
              "$LOADED_TAG_OWNER_COMMIT" "$LOADED_TAG_EXPECTED_ASSETS" || {
              echo "Existing $TAG release is not the exact owned retry draft; it was preserved." >&2
              return 1
            }
            [ "$LOADED_TAG_OWNER_COMMIT" = "$EXPECTED_SHA" ] &&
              [ "$LOADED_TAG_EXPECTED_ASSETS" = "$expected_assets" ] || {
              echo "Owned retry draft belongs to another release input; it was preserved." >&2
              return 1
            }
            echo "Canonical owned draft $release_id is preserved for retry." >&2
            return 0
          }

          classify_target_release_state() {
            local releases="" count=0 release_json="" release_id=""
            TARGET_RELEASE_STATE=unknown
            TARGET_RELEASE_ID=""
            TARGET_RELEASE_JSON=""
            releases=$(list_target_releases) || return 1
            count=$(jq -r 'length' <<<"$releases")
            [ "$count" -le 1 ] || {
              echo "Multiple releases use $TAG; refusing publication." >&2
              return 1
            }
            load_owned_target_tag || return 1
            if [ "$count" -eq 0 ]; then
              case "$LOADED_TAG_STATE" in
                absent) TARGET_RELEASE_STATE=absent ;;
                owned)
                  [ "$LOADED_TAG_OWNER_COMMIT" = "$EXPECTED_SHA" ] &&
                    [ "$LOADED_TAG_EXPECTED_ASSETS" = "$expected_assets" ] || {
                    echo "Owned tag-only state belongs to another release input; refusing mutation." >&2
                    return 1
                  }
                  TARGET_RELEASE_STATE=owned_tag_only_current
                  ;;
                *) return 1 ;;
              esac
              return 0
            fi
            [ "$LOADED_TAG_STATE" = owned ] || return 1
            release_json=$(jq -c '.[0]' <<<"$releases")
            release_id=$(jq -r '.id' <<<"$release_json")
            [[ "$release_id" =~ ^[0-9]+$ ]] || return 1
            release_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}") || return 1
            [ "$(jq -r '.id' <<<"$release_json")" = "$release_id" ] || return 1
            if [ "$LOADED_TAG_OWNER_COMMIT" = "$EXPECTED_SHA" ] &&
              [ "$LOADED_TAG_EXPECTED_ASSETS" = "$expected_assets" ] &&
              is_exact_mutable_draft "$release_json" "$LOADED_TAG_OWNER_MARKER" \
                "$EXPECTED_SHA" "$expected_assets"; then
              TARGET_RELEASE_STATE=exact_owned_draft_current
              TARGET_RELEASE_ID="$release_id"
              TARGET_RELEASE_JSON="$release_json"
              return 0
            fi
            if [ "$LOADED_TAG_OWNER_COMMIT" = "$EXPECTED_SHA" ] &&
              [ "$LOADED_TAG_EXPECTED_ASSETS" = "$expected_assets" ] &&
              is_canonical_owned_partial_draft "$release_json" \
                "$LOADED_TAG_OWNER_MARKER" "$EXPECTED_SHA" "$expected_assets"; then
              TARGET_RELEASE_STATE=exact_owned_partial_draft_current
              TARGET_RELEASE_ID="$release_id"
              TARGET_RELEASE_JSON="$release_json"
              return 0
            fi
            if is_exact_public_release "$release_json" "$release_id" \
              "$LOADED_TAG_OWNER_MARKER" "$LOADED_TAG_OWNER_COMMIT" \
              "$LOADED_TAG_EXPECTED_ASSETS" &&
              [ "$LOADED_TAG_OWNER_COMMIT" = "$EXPECTED_SHA" ] &&
              [ "$LOADED_TAG_EXPECTED_ASSETS" = "$expected_assets" ]; then
              TARGET_RELEASE_STATE=exact_public_current
              TARGET_RELEASE_ID="$release_id"
              TARGET_RELEASE_JSON="$release_json"
              return 0
            fi
            echo "Existing $TAG state is public, foreign, or inconsistent; refusing mutation." >&2
            return 1
          }

          release_cleanup_on_exit() {
            local status=$?
            trap - EXIT
            if [ "${cleanup_armed:-false}" = true ]; then
              if [ "${draft_creation_attempted:-false}" = true ]; then
                # Once the POST may have reached GitHub, an empty inventory is
                # not authoritative: the response and subsequent list reads
                # can both lag.  Preserve the exact owned tag so any delayed
                # draft remains adoptable by the next run.
                echo "Draft creation was attempted; preserving the owned tag and any delayed draft for exact re-adoption." >&2
              else
                reconcile_owned_mutable_target "${RUN_TAG_OBJECT_SHA:-}" "${RUN_OWNER_MARKER:-}" ||
                  echo "Automatic reconciliation refused or failed; every draft and unverified object was preserved." >&2
              fi
            fi
            exit "$status"
          }

          publish_draft_and_confirm() {
            local draft_id="$1" owner_marker="$2" attempt=0 release_json=""
            # The PATCH transport result is never authoritative. It may have
            # reached GitHub even when the response was lost.
            api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${draft_id}" \
              -F draft=false -f make_latest=true >/dev/null 2>&1 || true
            for attempt in 1 2 3 4 5 6; do
              if release_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${draft_id}"); then
                if is_exact_public_release "$release_json" "$draft_id" "$owner_marker" \
                  "$EXPECTED_SHA" "$expected_assets"; then
                  return 0
                fi
                if ! is_exact_mutable_draft "$release_json" "$owner_marker" \
                  "$EXPECTED_SHA" "$expected_assets"; then
                  echo "Release $draft_id changed to an unrecognized state after PATCH; refusing mutation." >&2
                  return 1
                fi
              fi
              [ "$attempt" -eq 6 ] || sleep 2
            done
            echo "Release publication outcome is not yet authoritative; the draft was left untouched." >&2
            return 1
          }

          complete_owned_draft_assets() {
            local draft_id="$1" owner_marker="$2" asset="" draft_json=""
            local slot_state="" upload_template="" upload_url=""
            local attempt=0 upload_status=0 converged=false
            for asset in install.sh manifest.sha256 rr-bundle.tar.gz RELEASE_INFO SHA256SUMS; do
              draft_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${draft_id}") || return 1
              [ "$(jq -r '.id' <<<"$draft_json")" = "$draft_id" ] &&
                is_canonical_owned_partial_draft "$draft_json" "$owner_marker" \
                  "$EXPECTED_SHA" "$expected_assets" || {
                echo "Draft $draft_id changed before the $asset slot could be resumed." >&2
                return 1
              }
              slot_state=$(jq -r --arg name "$asset" '
                [.assets[] | select(.name == $name)] |
                if length == 0 then "missing"
                elif length == 1 then .[0].state
                else "invalid"
                end
              ' <<<"$draft_json")
              case "$slot_state" in
                uploaded) continue ;;
                starter) ;;
                missing)
                  assert_run_owned_target_tag || {
                    echo "Owned annotated tag changed before uploading $asset." >&2
                    return 1
                  }
                  # Re-read all three exact-SHA evidence classes immediately
                  # before every asset mutation. A newer failed rerun blocks
                  # this write even when an older attempt succeeded.
                  assert_release_gate || return 1
                  upload_template=$(jq -r '.upload_url // empty' <<<"$draft_json")
                  [ "$upload_template" = \
                    "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${draft_id}/assets{?name,label}" ] || {
                    echo "Draft $draft_id does not expose its exact upload relation." >&2
                    return 1
                  }
                  upload_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${draft_id}/assets?name=${asset}"
                  upload_status=0
                  # Upload exactly one missing slot to the exact release ID.
                  # Never overwrite and never delete an uncertain asset slot.
                  printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
                    curl --config - --proto '=https' --proto-redir '=https' \
                      --tlsv1.2 --fail-with-body --silent --show-error --location \
                      --request POST \
                      --header 'Accept: application/vnd.github+json' \
                      --header 'X-GitHub-Api-Version: 2026-03-10' \
                      --header 'Content-Type: application/octet-stream' \
                      --data-binary "@${asset}" "$upload_url" \
                      >/dev/null 2>&1 || upload_status=$?
                  ;;
                *)
                  echo "Draft $draft_id contains an uncertain $asset slot; it was not overwritten." >&2
                  return 1
                  ;;
              esac

              # The upload response is not authoritative. Re-adopt an exact
              # uploaded slot by release-ID GET, including its size, digest,
              # uploader, and the canonical state of every other slot.
              converged=false
              for attempt in 1 2 3 4 5 6; do
                if draft_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${draft_id}") &&
                  [ "$(jq -r '.id' <<<"$draft_json")" = "$draft_id" ] &&
                  is_canonical_owned_partial_draft "$draft_json" "$owner_marker" \
                    "$EXPECTED_SHA" "$expected_assets" &&
                  jq -e --arg name "$asset" --argjson expected "$expected_assets" '
                    ([.assets[] | select(.name == $name)] | length) == 1 and
                    (.assets[] | select(.name == $name)) as $actual |
                    any($expected[];
                      .name == $name and $actual.state == "uploaded" and
                      $actual.size == .size and $actual.digest == .digest and
                      $actual.uploader.login == "github-actions[bot]")
                  ' <<<"$draft_json" >/dev/null; then
                  converged=true
                  break
                fi
                [ "$attempt" -eq 6 ] || sleep 2
              done
              [ "$converged" = true ] || {
                echo "Asset $asset did not converge on exact draft $draft_id (upload status $upload_status); the slot was preserved." >&2
                return 1
              }
            done

            draft_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${draft_id}") || return 1
            [ "$(jq -r '.id' <<<"$draft_json")" = "$draft_id" ] &&
              is_exact_mutable_draft "$draft_json" "$owner_marker" \
                "$EXPECTED_SHA" "$expected_assets"
          }

          version_gt() {
            local candidate="$1" baseline="$2"
            [ "$candidate" != "$baseline" ] &&
              [ "$(printf '%s\n%s\n' "$baseline" "$candidate" | sort -V | tail -n 1)" = "$candidate" ]
          }

          assert_new_monotonic_version() {
            local releases remote_tags existing highest="" existing_version
            releases=$(api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100")
            if jq -e --arg tag "$TAG" 'add | any(.tag_name == $tag)' \
              <<<"$releases" >/dev/null; then
              echo "Release $TAG already exists; existing releases are never modified." >&2
              return 1
            fi

            remote_tags=$(git ls-remote --tags --refs origin 'refs/tags/v*')
            while IFS= read -r existing; do
              [[ "$existing" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
              existing_version=${existing#v}
              if [ -z "$highest" ] || version_gt "$existing_version" "$highest"; then
                highest=$existing_version
              fi
            done < <(
              {
                jq -r 'add | .[].tag_name' <<<"$releases"
                awk '{ sub("refs/tags/", "", $2); print $2 }' <<<"$remote_tags"
              } | LC_ALL=C sort -u
            )
            if [ -n "$highest" ] && ! version_gt "$VERSION" "$highest"; then
              echo "Version $VERSION is not newer than existing product version $highest." >&2
              return 1
            fi
          }

          assert_no_newer_product_version() {
            local releases release_tags remote_tags remote_tag_names all_tags
            local existing existing_version
            releases=$(api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100") || return 1
            jq -e '
              type == "array" and
              all(.[]; type == "array") and
              all(.[][]; type == "object" and (.tag_name | type == "string"))
            ' <<<"$releases" >/dev/null || return 1
            release_tags=$(jq -r '.[][] | .tag_name' <<<"$releases") || return 1
            remote_tags=$(git ls-remote --tags --refs origin 'refs/tags/v*') || return 1
            remote_tag_names=$(awk '{ sub("refs/tags/", "", $2); print $2 }' \
              <<<"$remote_tags") || return 1
            all_tags=$(printf '%s\n%s\n' "$release_tags" "$remote_tag_names" | \
              LC_ALL=C sort -u) || return 1
            while IFS= read -r existing; do
              [[ "$existing" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
              existing_version=${existing#v}
              if version_gt "$existing_version" "$VERSION"; then
                echo "A newer product version $existing_version appeared during publication." >&2
                return 1
              fi
            done <<<"$all_tags"
            return 0
          }

          assert_latest_product() {
            local release_id="$1" owner_marker="$2" attempt latest_json
            for attempt in 1 2 3 4 5 6; do
              if latest_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/latest") &&
                is_exact_public_release "$latest_json" "$release_id" "$owner_marker" \
                  "$EXPECTED_SHA" "$expected_assets" &&
                jq -e '.immutable == true' <<<"$latest_json" >/dev/null; then
                return 0
              fi
              [ "$attempt" -eq 6 ] || sleep 2
            done
            echo "$TAG is not immutable repository Latest with the expected assets." >&2
            return 1
          }

          verify_published_release() {
            local release_id="$1" owner_marker="$2" attempt=0 release_json=""
            local exact_public=false published_dir="" asset="" asset_json=""
            local asset_id="" asset_size="" asset_digest="" verified=false
            for attempt in 1 2 3 4 5 6; do
              if release_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}") &&
                is_exact_public_release "$release_json" "$release_id" "$owner_marker" \
                  "$EXPECTED_SHA" "$expected_assets"; then
                exact_public=true
                break
              fi
              [ "$attempt" -eq 6 ] || sleep 2
            done
            [ "$exact_public" = true ] || {
              echo "Public release $release_id is not the exact verified payload." >&2
              return 1
            }

            jq -e --arg repo "$GITHUB_REPOSITORY" --arg tag "$TAG" '
              ([.assets[].id] | length == (unique | length)) and
              all(.assets[];
                (.id | type) == "number" and .id == (.id | floor) and .id > 0 and
                .uploader.login == "github-actions[bot]" and
                .url == ("https://api.github.com/repos/" + $repo +
                  "/releases/assets/" + (.id | tostring)) and
                .browser_download_url == ("https://github.com/" + $repo +
                  "/releases/download/" + $tag + "/" + .name))
            ' <<<"$release_json" >/dev/null || {
              echo "Release $release_id asset identities are not bound to the exact tag/API contract." >&2
              return 1
            }

            published_dir=$(mktemp -d) || return 1
            for asset in install.sh manifest.sha256 rr-bundle.tar.gz RELEASE_INFO SHA256SUMS; do
              asset_json=$(jq -ce --arg name "$asset" '
                [.assets[] | select(.name == $name)] |
                if length == 1 then .[0] else error("asset identity is not unique") end
              ' <<<"$release_json") || {
                rm -rf -- "$published_dir"
                return 1
              }
              asset_id=$(jq -r '.id' <<<"$asset_json")
              asset_size=$(jq -r '.size' <<<"$asset_json")
              asset_digest=$(jq -r '.digest' <<<"$asset_json")
              [[ "$asset_id" =~ ^[1-9][0-9]*$ ]] &&
                [[ "$asset_size" =~ ^[1-9][0-9]*$ ]] &&
                [[ "$asset_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                rm -rf -- "$published_dir"
                return 1
              }
              verified=false
              for attempt in 1 2 3 4 5 6; do
                if api -H 'Accept: application/octet-stream' \
                  "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                  > "$published_dir/${asset}.part" &&
                  [ "$(stat -c %s "$published_dir/${asset}.part")" = "$asset_size" ] &&
                  [ "sha256:$(sha256sum "$published_dir/${asset}.part" | awk '{print $1}')" = "$asset_digest" ] &&
                  cmp -s "$asset" "$published_dir/${asset}.part"; then
                  mv "$published_dir/${asset}.part" "$published_dir/$asset"
                  verified=true
                  break
                fi
                [ "$attempt" -eq 6 ] || sleep 2
              done
              [ "$verified" = true ] || {
                echo "Exact release asset $asset differs from its ID, size, digest, or CI source." >&2
                rm -rf -- "$published_dir"
                return 1
              }
            done
            (cd "$published_dir" && sha256sum -c SHA256SUMS) || {
              rm -rf -- "$published_dir"
              return 1
            }
            rm -rf -- "$published_dir"

            # Downloads are not the end of the transaction: re-read every
            # mutable trust anchor afterwards so a concurrent Latest/tag/main
            # or workflow-attempt change cannot be masked by valid bytes.
            exact_public=false
            for attempt in 1 2 3 4 5 6; do
              if release_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}") &&
                is_exact_public_release "$release_json" "$release_id" "$owner_marker" \
                  "$EXPECTED_SHA" "$expected_assets" &&
                jq -e '.immutable == true' <<<"$release_json" >/dev/null; then
                exact_public=true
                break
              fi
              [ "$attempt" -eq 6 ] || sleep 2
            done
            [ "$exact_public" = true ] || {
              echo "Release $release_id is not the exact immutable publication after download." >&2
              return 1
            }
            assert_run_owned_target_tag || {
              echo "The immutable release is not bound to the owned annotated tag object." >&2
              return 1
            }
            assert_latest_product "$release_id" "$owner_marker" || return 1
            assert_verified_sha_gate || return 1
            assert_main_tip || return 1
            assert_no_newer_product_version || return 1
          }

          expected_assets=$(
            for asset in install.sh manifest.sha256 rr-bundle.tar.gz RELEASE_INFO SHA256SUMS; do
              digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
              size=$(stat -c %s "$asset")
              jq -cn --arg name "$asset" --arg digest "$digest" --argjson size "$size" \
                '{name: $name, size: $size, digest: $digest}'
            done | jq -scS 'sort_by(.name)'
          )
          RELEASE_NOTES_FILE=release-notes.md
          RELEASE_TITLE="RR-vps ${VERSION} 正式版"
          cleanup_armed=false
          draft_creation_attempted=false

          # Classify before any version gate that assumes target absence. An
          # exact public release is verification-only; an exact current draft
          # is re-adopted by its annotated owner marker and exact release ID.
          # Draft releases are never automatically deleted because GitHub has
          # no conditional mutation contract for release DELETE.
          classify_target_release_state
          case "$TARGET_RELEASE_STATE" in
            exact_public_current)
              RUN_TAG_OBJECT_SHA="$LOADED_TAG_OBJECT_SHA"
              RUN_OWNER_MARKER="$LOADED_TAG_OWNER_MARKER"
              assert_immutable_releases_enabled
              assert_release_gate
              verify_published_release "$TARGET_RELEASE_ID" "$RUN_OWNER_MARKER"
              exit 0
              ;;
            exact_owned_draft_current|exact_owned_partial_draft_current)
              RUN_TAG_OBJECT_SHA="$LOADED_TAG_OBJECT_SHA"
              RUN_OWNER_MARKER="$LOADED_TAG_OWNER_MARKER"
              draft_id="$TARGET_RELEASE_ID"
              assert_immutable_releases_enabled
              assert_no_newer_product_version
              assert_release_gate
              draft_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${draft_id}")
              [ "$(jq -r '.id' <<<"$draft_json")" = "$draft_id" ]
              is_canonical_owned_partial_draft "$draft_json" "$RUN_OWNER_MARKER" \
                "$EXPECTED_SHA" "$expected_assets"
              assert_run_owned_target_tag || {
                echo "The re-adopted draft is no longer bound to its owned annotated tag." >&2
                exit 1
              }
              complete_owned_draft_assets "$draft_id" "$RUN_OWNER_MARKER"
              draft_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${draft_id}")
              [ "$(jq -r '.id' <<<"$draft_json")" = "$draft_id" ]
              is_exact_mutable_draft "$draft_json" "$RUN_OWNER_MARKER" \
                "$EXPECTED_SHA" "$expected_assets"
              # The exact-ID draft and tag are rechecked after slot recovery,
              # followed by the final main/gate read before publication.
              # No draft or uncertain asset is deleted or overwritten.
              assert_run_owned_target_tag || {
                echo "The completed draft is no longer bound to its owned annotated tag." >&2
                exit 1
              }
              assert_release_gate
              publish_draft_and_confirm "$draft_id" "$RUN_OWNER_MARKER"
              verify_published_release "$draft_id" "$RUN_OWNER_MARKER"
              exit 0
              ;;
            owned_tag_only_current)
              reconcile_owned_mutable_target "$LOADED_TAG_OBJECT_SHA" \
                "$LOADED_TAG_OWNER_MARKER"
              ;;
            absent) ;;
            *) exit 1 ;;
          esac
          classify_target_release_state
          [ "$TARGET_RELEASE_STATE" = absent ] || {
            echo "$TAG did not reconcile to authoritative tag/release absence." >&2
            exit 1
          }
          assert_new_monotonic_version

          # Re-read immediately before constructing this run's owned annotated
          # tag object. Any newly appeared state is a race and is never deleted.
          classify_target_release_state
          [ "$TARGET_RELEASE_STATE" = absent ] || {
            echo "$TAG changed during release preparation; refusing mutation." >&2
            exit 1
          }
          assert_new_monotonic_version
          assert_immutable_releases_enabled
          assert_release_gate
          release_nonce=$(openssl rand -hex 32)
          [[ "$release_nonce" =~ ^[0-9a-f]{64}$ ]]
          release_payload_sha=$(printf '%s' "$expected_assets" | sha256sum | awk '{print $1}')
          release_payload_b64=$(printf '%s' "$expected_assets" | base64 -w 0)
          [[ "$release_payload_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$release_payload_b64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          TAG_OWNER_MARKER="rr-vps-release-owner:v2:${TAG}:${EXPECTED_SHA}:${release_nonce}:${release_payload_sha}:${release_payload_b64}"
          [ "${#TAG_OWNER_MARKER}" -le 4096 ]
          RELEASE_MARKER="<!-- ${TAG_OWNER_MARKER} -->"
          {
            cat release-notes.md
            printf '\n%s\n' "$RELEASE_MARKER"
          } > release-draft-notes.md
          [ -s release-draft-notes.md ] && [ ! -L release-draft-notes.md ]

          # Creating the annotated object is harmless until a ref names it,
          # but still revalidate the evidence immediately before the write.
          assert_release_gate
          tag_object=$(api --method POST "/repos/${GITHUB_REPOSITORY}/git/tags" \
            -f "tag=${TAG}" -f "message=${TAG_OWNER_MARKER}" \
            -f "object=${EXPECTED_SHA}" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com')
          tag_object_sha=$(jq -r '.sha' <<<"$tag_object")
          [[ "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]
          jq -e --arg sha "$tag_object_sha" --arg tag "$TAG" --arg commit "$EXPECTED_SHA" \
            --arg marker "$TAG_OWNER_MARKER" '
            .sha == $sha and .tag == $tag and .message == $marker and
            .object.type == "commit" and .object.sha == $commit and
            .tagger.name == "github-actions[bot]" and
            .tagger.email == "41898282+github-actions[bot]@users.noreply.github.com"
          ' <<<"$tag_object" >/dev/null
          RUN_TAG_OBJECT_SHA="$tag_object_sha"
          RUN_OWNER_MARKER="$TAG_OWNER_MARKER"

          assert_no_newer_product_version
          # This gate's main-tip read is immediately adjacent to the atomic ref
          # creation; creating the unreachable annotated object above is safe.
          assert_release_gate
          cleanup_armed=true
          trap release_cleanup_on_exit EXIT
          created_ref=$(api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${tag_object_sha}")
          jq -e --arg ref "refs/tags/${TAG}" --arg sha "$tag_object_sha" '
            .ref == $ref and .object.type == "tag" and .object.sha == $sha
          ' <<<"$created_ref" >/dev/null
          wait_for_remote_tag_sha "$TAG" "$EXPECTED_SHA"
          assert_run_owned_target_tag || {
            echo "The annotated release tag changed before draft creation." >&2
            exit 1
          }
          # Recheck main after the exact annotated-tag read. The complete
          # three-evidence gate is repeated below after request construction.
          assert_main_tip
          jq -n --arg tag "$TAG" --arg target "$EXPECTED_SHA" \
            --arg title "$RELEASE_TITLE" --rawfile body release-draft-notes.md '
            {tag_name:$tag,target_commitish:$target,name:$title,body:$body,
             draft:true,prerelease:false}
          ' > release-create-request.json
          [ -s release-create-request.json ] && [ ! -L release-create-request.json ]
          assert_release_gate
          create_status=0
          draft_creation_attempted=true
          api --method POST --input release-create-request.json \
            "/repos/${GITHUB_REPOSITORY}/releases" >/dev/null 2>&1 || create_status=$?

          draft_verified=false
          for attempt in 1 2 3 4 5 6; do
            if draft_inventory=$(list_target_releases) &&
               [ "$(jq -r 'length' <<<"$draft_inventory")" -eq 1 ]; then
              draft_json=$(jq -c '.[0]' <<<"$draft_inventory")
            else
              draft_json=""
            fi
            if [ -n "$draft_json" ] &&
               is_canonical_owned_partial_draft "$draft_json" "$RUN_OWNER_MARKER" \
                 "$EXPECTED_SHA" "$expected_assets"; then
              draft_id=$(jq -r '.id' <<<"$draft_json")
              if [[ "$draft_id" =~ ^[0-9]+$ ]] &&
                draft_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${draft_id}") &&
                [ "$(jq -r '.id' <<<"$draft_json")" = "$draft_id" ] &&
                is_canonical_owned_partial_draft "$draft_json" "$RUN_OWNER_MARKER" \
                  "$EXPECTED_SHA" "$expected_assets" &&
                [ "$(jq -r '.assets | length' <<<"$draft_json")" -eq 0 ]; then
                draft_verified=true
                break
              fi
            fi
            [ "$attempt" -eq 6 ] || sleep 2
          done
          [ "$draft_verified" = true ] || {
            echo "Draft creation status $create_status did not converge to the exact owned empty release ID; any draft was preserved." >&2
            exit 1
          }

          complete_owned_draft_assets "$draft_id" "$RUN_OWNER_MARKER"
          draft_json=$(api "/repos/${GITHUB_REPOSITORY}/releases/${draft_id}")
          [ "$(jq -r '.id' <<<"$draft_json")" = "$draft_id" ]
          is_exact_mutable_draft "$draft_json" "$RUN_OWNER_MARKER" \
            "$EXPECTED_SHA" "$expected_assets"
          wait_for_remote_tag_sha "$TAG" "$EXPECTED_SHA"
          assert_run_owned_target_tag || {
            echo "The annotated release tag changed before publication." >&2
            exit 1
          }
          assert_immutable_releases_enabled
          assert_no_newer_product_version
          # assert_release_gate ends with the main-tip GET. After local trap
          # disarm, PATCH is the very next remote operation.
          assert_release_gate
          cleanup_armed=false
          trap - EXIT
          publish_draft_and_confirm "$draft_id" "$RUN_OWNER_MARKER"
          verify_published_release "$draft_id" "$RUN_OWNER_MARKER"
