          expected_device="dev_a1b2c3d4e5f6|legacy-phone|${legacy_credential}|${legacy_token}|1|10737418240|1234567|456789|777778|2026-08-27T00:00:00+00:00|<NULL>|2027-08-27|2026-09-27|27|12|3|2026-08-01T00:00:00+00:00|2026-08-27T00:00:00+00:00"
          test "$(device_row)" = "$expected_device"
