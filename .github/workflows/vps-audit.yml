# Temporary owner-authorized audit status probe; remove after the three-VPS gate.
name: Temporary VPS gate status probe

on:
  push:
    branches: [main]
    paths: [".github/workflows/vps-audit.yml"]

permissions:
  contents: read
  statuses: write

concurrency:
  group: temporary-vps-audit
  cancel-in-progress: false

jobs:
  report:
    name: "${{ matrix.role }} · publish redacted gate status"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        role: [A, B]
    env:
      RR_A_HOST: ${{ secrets.RR_A_HOST }}
      RR_A_PASS: ${{ secrets.RR_A_PASS }}
      RR_A_NAIVE_DOMAIN: ${{ secrets.RR_A_NAIVE_DOMAIN }}
      RR_B_HOST: ${{ secrets.RR_B_HOST }}
      RR_B_PASS: ${{ secrets.RR_B_PASS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read only non-secret release gates
        shell: bash
        run: |
          set -euo pipefail
          set +x
          role="${{ matrix.role }}"
          case "$role" in
            A)
              host="$RR_A_HOST"
              export SSHPASS="$RR_A_PASS"
              remote_args=(A "$RR_A_HOST" "$RR_A_NAIVE_DOMAIN")
              ;;
            B)
              host="$RR_B_HOST"
              export SSHPASS="$RR_B_PASS"
              remote_args=(B '' '')
              ;;
            *) exit 2 ;;
          esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          known_hosts="$RUNNER_TEMP/known-hosts-$role"
          state=failure
          description="${role} gate incomplete"
          if sshpass -e ssh \
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2 \
            -o LogLevel=ERROR -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$known_hosts" \
            "root@$host" bash -s -- "${remote_args[@]}" <<'REMOTE'
          set -euo pipefail
          role="$1"
          panel_domain="$2"
          naive_domain="$3"
          /usr/local/bin/rr --version | grep -F 'RR-vps 7.1.1' >/dev/null
          test "$(grep -c '^INSTALL_COMPLETE=true$' /etc/argo_vmess.conf)" -eq 1
          systemctl is-active --quiet sing-box
          systemctl is-active --quiet rr-nexus
          systemctl is-active --quiet nginx
          test "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA quick_check;')" = ok
          if [ "$role" = A ]; then
            test -s "/etc/letsencrypt/live/${panel_domain}/fullchain.pem"
            test -s "/etc/letsencrypt/live/${naive_domain}/fullchain.pem"
            curl -fsS --resolve "${panel_domain}:8443:127.0.0.1" \
              --connect-timeout 5 --max-time 15 "https://${panel_domain}:8443/healthz" >/dev/null
          else
            test "$(cat /root/rr-audit-stage 2>/dev/null)" = second-upgrade-complete
            sqlite3 /var/lib/rr-nexus/nexus.db \
              "SELECT id FROM devices WHERE id='dev_a1b2c3d4e5f6';" \
              | grep -qx dev_a1b2c3d4e5f6
            test -s /run/rr-vps-subscription.pid
            kill -0 "$(cat /run/rr-vps-subscription.pid)"
          fi
          REMOTE
          then
            state=success
            description="${role} real VPS gate passed"
          fi
          payload=$(jq -nc --arg state "$state" --arg context "rr-vps/audit-${role}" \
            --arg description "$description" \
            '{state:$state,context:$context,description:$description}')
          curl -fsS --retry 3 --connect-timeout 10 --max-time 30 \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
          test "$state" = success
