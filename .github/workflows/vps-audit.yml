               [ -L "$source_config_recover_tmp" ]; then
              validate_source_config "$source_config_recover_tmp" \
                "$source_config_sha"
              cmp -s "$source_config_backup" "$source_config_recover_tmp"
              rm -f -- "$source_config_recover_tmp"
            fi
