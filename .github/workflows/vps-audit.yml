            path_identity=$(/usr/bin/stat -Lc '%d:%i:%u:%g:%h' \
              /run/rr-vps/locks/firewall.lock 2>/dev/null) || return 1
            descriptor_identity=$(/usr/bin/stat -Lc '%d:%i:%u:%g:%h' \
              "/dev/fd/$firewall_lock_fd" 2>/dev/null) || return 1
            [ "$path_identity" = "$descriptor_identity" ] || return 1
            flock -w 60 "$firewall_lock_fd" || return 1
            path_identity=$(/usr/bin/stat -Lc '%d:%i:%u:%g:%h' \
              /run/rr-vps/locks/firewall.lock 2>/dev/null) || return 1
            descriptor_identity=$(/usr/bin/stat -Lc '%d:%i:%u:%g:%h' \
              "/dev/fd/$firewall_lock_fd" 2>/dev/null) || return 1
            [ "$path_identity" = "$descriptor_identity" ] && lock_file_is_safe
          }

          release_firewall_lock() {
            local path_identity="" descriptor_identity=""
            [[ "$firewall_lock_fd" =~ ^[0-9]+$ ]] || return 1
            path_identity=$(/usr/bin/stat -Lc '%d:%i:%u:%g:%h' \
              /run/rr-vps/locks/firewall.lock 2>/dev/null) || return 1
            descriptor_identity=$(/usr/bin/stat -Lc '%d:%i:%u:%g:%h' \
              "/dev/fd/$firewall_lock_fd" 2>/dev/null) || return 1
            [ "$path_identity" = "$descriptor_identity" ] && lock_file_is_safe
            flock -u "$firewall_lock_fd"
            exec {firewall_lock_fd}>&-
            firewall_lock_fd=""
          }

          remove_audit_rule_all() {
            local backend="$1" table="$2" chain="$3" state=0
            shift 3
            while :; do
              if "$backend" -w 5 -t "$table" -C "$chain" "$@" \
                   >/dev/null 2>&1; then
                "$backend" -w 5 -t "$table" -D "$chain" "$@" \
                  >/dev/null 2>&1 || return 1
              else
                state=$?
                [ "$state" -eq 1 ] && return 0
                return "$state"
              fi
            done
          }

