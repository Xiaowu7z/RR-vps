                    --dport 65434 -m comment --comment rr-audit-user-sentinel \
                    -j REDIRECT --to-ports 65433
                }
                acquire_firewall_lock
                backend_count=0
                for backend in iptables ip6tables; do
                  command -v "$backend" >/dev/null 2>&1
                  remove_audit_rule_all "$backend" filter INPUT -p tcp --dport 65431 \
                    -m comment --comment argo-rr-managed-block -j DROP
                  remove_audit_rule_all "$backend" filter INPUT -p tcp --dport 65433 \
                    -m comment --comment rr-audit-user-sentinel -j ACCEPT
                  remove_audit_rule_all "$backend" nat PREROUTING -p udp --dport 65434 \
                    -m comment --comment rr-audit-user-sentinel \
                    -j REDIRECT --to-ports 65433
                  # Converge fixtures left by the preceding audit contract.
