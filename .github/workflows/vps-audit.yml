                set -o pipefail
                for module_file in "$CLEANUP_RUNTIME"/modules/*.sh; do
                  # shellcheck disable=SC1090
                  source "$module_file"
                done
                rr_audit_waited_uninstall() {
                  local deadline=$((SECONDS + 180)) remaining=0 result=0
                  while :; do
                    remaining=$((deadline - SECONDS))
                    [ "$remaining" -ge 1 ] || return 75
                    if rr_run_with_update_locks direct "$remaining" \
                        uninstall_all_locked; then
                      return 0
                    else
                      result=$?
                    fi
                    [ "$result" = 75 ] || return "$result"
                    sleep 1
                  done
                }
                rr_audit_waited_uninstall
              ' >/root/rr-audit-candidate-preclean.log 2>&1; then
              echo 'C candidate pre-clean failed; root-only log retained on VPS.' >&2
              exit 1
            fi
          fi
          stop_subscription_servers >/root/rr-audit-orphan-cleanup.log 2>&1 || true
          rm -rf -- "$cleanup_runtime"

          for unit in sing-box rr-nexus argo-rr-health.timer argo-rr-health.service \
            rr-update-recovery rr-restore-recovery rr-restore-watchdog \
            rr-subscription-quarantine; do
            systemctl disable --now "$unit" >/dev/null 2>&1 || true
          done
          rm -f -- \
            /etc/systemd/system/sing-box.service \
            /etc/systemd/system/rr-nexus.service \
            /etc/systemd/system/argo-rr-health.timer \
            /etc/systemd/system/argo-rr-health.service \
            /etc/systemd/system/rr-update-recovery.service \
            /etc/systemd/system/rr-restore-recovery.service \
            /etc/systemd/system/rr-restore-watchdog.service \
            /etc/systemd/system/rr-subscription-quarantine.service \
            /usr/local/bin/rr /usr/local/sbin/rr-update-recover \
            /usr/local/sbin/rr-update-external-state /usr/local/bin/sing-box \
            /etc/nginx/sites-enabled/rr-nexus.conf \
            /etc/nginx/sites-available/rr-nexus.conf \
            /etc/nginx/sites-enabled/rr-naive-acme.conf \
            /etc/nginx/sites-available/rr-naive-acme.conf \
            /run/rr-subscription-quarantine.ready \
            /tmp/sub_server.pid /tmp/sub_server.bind
          rm -rf -- \
            /usr/local/lib/rr /var/lib/rr-update /var/lib/rr-nexus \
            /var/lib/rr-backup /etc/rr-nexus /etc/rr-update \
            /etc/rr-naive /etc/rr-cloudflared /etc/argo_vmess.conf \
            /etc/sing-box /tmp/sub_server /run/rr-vps /var/www/rr-nexus-certbot
          systemctl daemon-reload >/dev/null 2>&1
          test ! -e /usr/local/bin/rr
          test ! -e /usr/local/lib/rr
          test ! -e /var/lib/rr-update
          test ! -e /etc/argo_vmess.conf

          install_candidate() {
            RR_BUNDLE_FILE="$stage/rr-bundle.tar.gz" \
            RR_GUARD_FILE="$stage/update-guard.sh" \
              bash "$stage/install-core.sh" --upgrade
          }
          assert_candidate() {
            /usr/local/bin/rr --version | grep -F "RR-vps ${expected_version}" >/dev/null
            test -x /usr/local/bin/rr
            test -x /usr/local/sbin/rr-update-recover
            test -x /usr/local/sbin/rr-update-external-state
            test -s /usr/local/lib/rr/modules/61-update-guard.sh
            test -s /usr/local/lib/rr/manifest.sha256
            expected_rr=$(awk '$2 == "rr" {print $1}' /usr/local/lib/rr/manifest.sha256)
            test "$(sha256sum /usr/local/bin/rr | awk '{print $1}')" = "$expected_rr"
            (
              cd /usr/local/lib/rr
              awk '$2 != "rr"' manifest.sha256 | sha256sum -c - >/dev/null
            )
            test "$(stat -c %a /var/lib/rr-update)" = 700
            test ! -L /usr/local/lib/rr
          }

          install_candidate >/root/rr-audit-clean-install.log 2>&1
          assert_candidate
          /usr/local/sbin/rr-update-recover rollback \
            >/root/rr-audit-clean-rollback.log 2>&1
          test ! -e /usr/local/bin/rr
          test ! -e /usr/local/lib/rr
          test ! -e /usr/local/sbin/rr-update-recover
          test ! -e /usr/local/sbin/rr-update-external-state
          test ! -e /var/lib/rr-update

          install_candidate >>/root/rr-audit-clean-install.log 2>&1
          assert_candidate
