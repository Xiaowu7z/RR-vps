name: Temporary safe VPS pre-clean remediation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-release-audit
  cancel-in-progress: false

jobs:
  diagnose:
    name: Safe remediation · ${{ matrix.role }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/audit/fix-v720-ip-acme-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: A
            host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm
          - role: B
            host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A
          - role: C
            host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare SSH client
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/audit/fix-v720-ip-acme-final
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Remediate and report fixed-enum pre-clean state
        shell: bash
        env:
          RR_A_HOST_VALUE: ${{ secrets.RR_A_HOST }}
          RR_A_PASS_VALUE: ${{ secrets.RR_A_PASS }}
          RR_B_HOST_VALUE: ${{ secrets.RR_B_HOST }}
          RR_B_PASS_VALUE: ${{ secrets.RR_B_PASS }}
          RR_C_HOST_VALUE: ${{ secrets.RR_C_HOST }}
          RR_C_PASS_VALUE: ${{ secrets.RR_C_PASS }}
          TARGET_HOST_KEY: ${{ matrix.host_key }}
          TARGET_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          set +x
          [[ "$TARGET_ROLE" =~ ^[ABC]$ ]]
          case "$TARGET_ROLE" in
            A) host="$RR_A_HOST_VALUE"; target_pass="$RR_A_PASS_VALUE" ;;
            B) host="$RR_B_HOST_VALUE"; target_pass="$RR_B_PASS_VALUE" ;;
            C) host="$RR_C_HOST_VALUE"; target_pass="$RR_C_PASS_VALUE" ;;
          esac
          unset RR_A_HOST_VALUE RR_A_PASS_VALUE RR_B_HOST_VALUE \
            RR_B_PASS_VALUE RR_C_HOST_VALUE RR_C_PASS_VALUE
          test -n "$host"
          test -n "$target_pass"
          export SSHPASS="$target_pass"
          unset target_pass
          [[ "$host" != *$'\n'* ]]
          [[ "$host" != *$'\r'* ]]
          [[ "$TARGET_HOST_KEY" != *$'\n'* ]]
          read -r host_key_type host_key_data host_key_extra <<<"$TARGET_HOST_KEY"
          test "$host_key_type" = ssh-ed25519
          [[ "$host_key_data" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          test -z "$host_key_extra"
          diag_nonce=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          [[ "$diag_nonce" =~ ^[0-9a-f]{32}$ ]]
          known_hosts="$RUNNER_TEMP/known-hosts-${TARGET_ROLE}"
          runner_log=$(mktemp "$RUNNER_TEMP/rr-safe-diag-${TARGET_ROLE}.XXXXXX")
          stage_out=$(mktemp "$RUNNER_TEMP/rr-safe-stage-${TARGET_ROLE}.XXXXXX")
          chmod 600 "$runner_log" "$stage_out"
          validated_stage=""
          cleanup_runner() {
            local rc=$?
            trap - EXIT
            set +e
            if [[ "$validated_stage" =~ ^/root/rr-safe-diag\.[A-Za-z0-9]+$ ]] &&
               declare -p ssh_opts >/dev/null 2>&1; then
              sshpass -e ssh "${ssh_opts[@]}" "root@$host" bash -s -- \
                "$validated_stage" >>"$runner_log" 2>&1 <<'CLEANUP_REMOTE'
              set -u
              remote_stage="$1"
              [[ "$remote_stage" =~ ^/root/rr-safe-diag\.[A-Za-z0-9]+$ ]] || exit 2
              rm -rf -- "$remote_stage"
          CLEANUP_REMOTE
              cleanup_ssh_rc=$?
              [ "$cleanup_ssh_rc" -eq 0 ] || rc=1
            fi
            rm -f -- "$runner_log" "$stage_out" "$known_hosts" \
              >/dev/null 2>&1 || rc=1
            exit "$rc"
          }
          trap cleanup_runner EXIT
          (umask 077; printf '%s %s %s\n' "$host" "$host_key_type" "$host_key_data" > "$known_hosts")
          ssh-keygen -F "$host" -f "$known_hosts" >/dev/null
          ssh_opts=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts"
          )
          if ! sshpass -e ssh "${ssh_opts[@]}" "root@$host" \
              'umask 077; mktemp -d /root/rr-safe-diag.XXXXXX' \
              >"$stage_out" 2>"$runner_log"; then
            printf 'SAFE_DIAG role=%s runner=create-stage-error\n' "$TARGET_ROLE" >&2
            exit 1
          fi
          mapfile -t stage_lines < "$stage_out"
          if [ "${#stage_lines[@]}" -ne 1 ]; then
            printf 'SAFE_DIAG role=%s runner=invalid-stage-output\n' "$TARGET_ROLE" >&2
            exit 1
          fi
          stage="${stage_lines[0]}"
          [[ "$stage" =~ ^/root/rr-safe-diag\.[A-Za-z0-9]+$ ]]
          validated_stage="$stage"
          bundle_sha=$(sha256sum rr-bundle.tar.gz | awk '{print $1}')
          if ! sshpass -e scp "${ssh_opts[@]}" -q rr-bundle.tar.gz \
              "root@$host:$stage/rr-bundle.tar.gz" >"$runner_log" 2>&1; then
            printf 'SAFE_DIAG role=%s runner=upload-error\n' "$TARGET_ROLE" >&2
            exit 1
          fi
          preboot_id=""
          if [ "$TARGET_ROLE" != B ]; then
            if ! preboot_id=$(sshpass -e ssh "${ssh_opts[@]}" "root@$host" \
                'cat /proc/sys/kernel/random/boot_id' 2>/dev/null) ||
               [[ ! "$preboot_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
              printf 'SAFE_DIAG role=%s runner=preboot-id-error\n' \
                "$TARGET_ROLE" >&2
              exit 1
            fi
          fi
          set +e
          sshpass -e ssh "${ssh_opts[@]}" "root@$host" bash -s -- \
            "$TARGET_ROLE" "$stage" "$bundle_sha" "$diag_nonce" \
            >"$runner_log" 2>&1 <<'REMOTE'
          set -uo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb
          role="$1"
          stage="$2"
          expected_bundle_sha="$3"
          diag_nonce="$4"
          [[ "$role" =~ ^[ABC]$ ]] || exit 2
          [[ "$stage" =~ ^/root/rr-safe-diag\.[A-Za-z0-9]+$ ]] || exit 2
          [[ "$diag_nonce" =~ ^[0-9a-f]{32}$ ]] || exit 2
          cleanup_remote() {
            local rc=$?
            trap - EXIT
            rm -rf -- "$stage" || rc=1
            exit "$rc"
          }
          trap cleanup_remote EXIT
          runtime="$stage/runtime"
          trace="$stage/trace.log"
          product_log="$stage/product.log"
          recovery_log="$stage/recovery.log"
          install -d -m 700 "$runtime" || exit 3
          test "$(sha256sum "$stage/rr-bundle.tar.gz" | awk '{print $1}')" = \
            "$expected_bundle_sha" || exit 3
          tar --no-same-owner --no-same-permissions -xzf \
            "$stage/rr-bundle.tar.gz" -C "$runtime" --strip-components=1 || exit 3
          for module_file in "$runtime"/modules/*.sh; do
            source "$module_file" || exit 3
          done
          set +e
          safe_object_state() {
            local label="$1" target="$2" state=""
            if [ -L "$target" ]; then state=symlink
            elif [ ! -e "$target" ]; then state=absent
            elif [ -f "$target" ]; then state=file
            elif [ -d "$target" ]; then state=dir
            else state=other
            fi
            printf 'SAFE_DIAG nonce=%s role=%s object=%s state=%s\n' \
              "$diag_nonce" "$role" "$label" "$state"
          }
          safe_unit_value() {
            local unit="$1" property="$2" value=""
            if ! value=$(systemctl show "$unit" --property="$property" --value 2>/dev/null); then
              value=query-error
            elif [ -z "$value" ]; then
              value=empty
            else
              case "$value" in
                loaded|not-found|masked|active|inactive|failed|activating|deactivating|\
                reloading|maintenance|enabled|disabled|static|indirect|generated|transient|\
                linked|linked-runtime|enabled-runtime|alias) ;;
                *) value=other ;;
              esac
            fi
            printf '%s\n' "$value"
          }
          safe_object_state launcher /usr/local/bin/rr
          safe_object_state runtime /usr/local/lib/rr
          safe_object_state config /etc/argo_vmess.conf
          safe_object_state active_tx /var/lib/rr-update/active
          safe_object_state maintenance /run/rr-vps/update-maintenance
          safe_object_state restore_active /var/lib/rr-backup/active
          safe_object_state recovery_helper /usr/local/sbin/rr-update-recover
          safe_object_state external_helper /usr/local/sbin/rr-update-external-state
          safe_object_state recovery_unit /etc/systemd/system/rr-update-recovery.service
          for unit in rr-update-recovery.service rr-restore-recovery.service \
            rr-restore-watchdog.service rr-subscription-quarantine.service \
            rr-nexus.service rr-subscription.service sing-box.service \
            rr-nexus-ip-acme.service rr-nexus-ip-acme.timer \
            argo-rr-health.timer argo-rr-health.service; do
            load=$(safe_unit_value "$unit" LoadState)
            active=$(safe_unit_value "$unit" ActiveState)
            enabled=$(safe_unit_value "$unit" UnitFileState)
            printf 'SAFE_DIAG nonce=%s role=%s unit=%s load=%s active=%s enabled=%s\n' \
              "$diag_nonce" "$role" "$unit" "$load" "$active" "$enabled"
          done
          ufw_state=absent
          if dpkg-query -W -f='${db:Status-Abbrev}' ufw 2>/dev/null | grep -q '^ii'; then
            ufw_state=installed
          fi
          persistence_state=absent
          command -v netfilter-persistent >/dev/null 2>&1 && persistence_state=present
          printf 'SAFE_DIAG nonce=%s role=%s ufw=%s persistence=%s\n' \
            "$diag_nonce" "$role" "$ufw_state" "$persistence_state"
          rr_run_with_update_locks direct 5 true >/dev/null 2>&1
          raw_lock_rc=$?
          case "$raw_lock_rc" in
            0) lock_state=available ;;
            75) lock_state=busy ;;
            76) lock_state=unsafe ;;
            *) lock_state=other ;;
          esac
          printf 'SAFE_DIAG nonce=%s role=%s lock_probe=%s\n' \
            "$diag_nonce" "$role" "$lock_state"
          for backend in iptables ip6tables; do
            backend_state=missing
            if command -v "$backend" >/dev/null 2>&1; then
              if "$backend" -w 5 -t filter -S INPUT >/dev/null 2>&1; then
                backend_state=ready
              else
                backend_state=error
              fi
            fi
            printf 'SAFE_DIAG nonce=%s role=%s backend=%s state=%s\n' \
              "$diag_nonce" "$role" "$backend" "$backend_state"
          done
          rr_audit_path_absent() {
            [ ! -e "$1" ] && [ ! -L "$1" ]
          }
          rr_audit_unit_absent() {
            local unit="$1" load="" active="" enabled=""
            load=$(systemctl show "$unit" --property=LoadState --value 2>/dev/null) || return 1
            active=$(systemctl show "$unit" --property=ActiveState --value 2>/dev/null) || return 1
            enabled=$(systemctl show "$unit" --property=UnitFileState --value 2>/dev/null) || return 1
            [ "$load" = not-found ] && [ "$active" = inactive ] && \
              { [ -z "$enabled" ] || [ "$enabled" = not-found ]; }
          }
          rr_audit_cloudflared_process_present() {
            pgrep -x cloudflared >/dev/null 2>&1
          }
          rr_audit_callable_state() {
            local callback="$1" result=0
            declare -F "$callback" >/dev/null 2>&1 || {
              printf '%s\n' missing
              return 0
            }
            "$callback" >/dev/null 2>&1
            result=$?
            case "$result" in
              0) printf '%s\n' present ;;
              1) printf '%s\n' absent ;;
              *) printf '%s\n' error ;;
            esac
          }
          rr_audit_cloudflared_state() {
            if rr_audit_cloudflared_process_present; then
              printf '%s\n' present
            else
              printf '%s\n' absent
            fi
          }
          rr_audit_product_evidence_present() {
            local target=""
            for target in \
              /usr/local/bin/rr /usr/local/lib/rr /etc/argo_vmess.conf \
              /usr/local/bin/sing-box /usr/local/bin/auto_update_sub.py \
              /etc/sing-box /etc/rr-nexus /etc/rr-naive /etc/rr-update \
              /etc/rr-cloudflared /var/lib/rr-nexus /var/lib/rr-update \
              /var/lib/rr-backup \
              /usr/local/sbin/rr-update-recover \
              /usr/local/sbin/rr-update-external-state \
              /etc/systemd/system/rr-update-recovery.service \
              /etc/systemd/system/rr-update-recovery.service.d \
              /etc/systemd/system/rr-restore-recovery.service \
              /etc/systemd/system/rr-restore-watchdog.service \
              /etc/systemd/system/rr-subscription-quarantine.service \
              /etc/systemd/system/rr-nexus.service \
              /etc/systemd/system/rr-subscription.service \
              /etc/systemd/system/sing-box.service \
              /etc/systemd/system/rr-nexus-ip-acme.service \
              /etc/systemd/system/rr-nexus-ip-acme.timer \
              /etc/systemd/system/argo-rr-health.timer \
              /etc/systemd/system/argo-rr-health.service \
              /etc/nginx/sites-available/rr-nexus-ip-acme-http.conf \
              /etc/nginx/sites-enabled/rr-nexus-ip-acme-http.conf \
              /usr/local/lib/rr-vps/lego \
              /usr/local/lib/rr-vps/lego.install; do
              rr_audit_path_absent "$target" || return 0
            done
            return 1
          }
          rr_audit_non_external_product_evidence_present() {
            local target=""
            for target in \
              /usr/local/bin/rr /usr/local/lib/rr /etc/argo_vmess.conf \
              /usr/local/bin/sing-box /usr/local/bin/auto_update_sub.py \
              /etc/sing-box /etc/rr-nexus /etc/rr-naive /etc/rr-update \
              /etc/rr-cloudflared /var/lib/rr-nexus /var/lib/rr-update \
              /var/lib/rr-backup \
              /usr/local/sbin/rr-update-recover \
              /etc/systemd/system/rr-update-recovery.service \
              /etc/systemd/system/rr-update-recovery.service.d \
              /etc/systemd/system/rr-restore-recovery.service \
              /etc/systemd/system/rr-restore-watchdog.service \
              /etc/systemd/system/rr-subscription-quarantine.service \
              /etc/systemd/system/rr-nexus.service \
              /etc/systemd/system/rr-subscription.service \
              /etc/systemd/system/sing-box.service \
              /etc/systemd/system/rr-nexus-ip-acme.service \
              /etc/systemd/system/rr-nexus-ip-acme.timer \
              /etc/systemd/system/argo-rr-health.timer \
              /etc/systemd/system/argo-rr-health.service \
              /etc/nginx/sites-available/rr-nexus-ip-acme-http.conf \
              /etc/nginx/sites-enabled/rr-nexus-ip-acme-http.conf \
              /usr/local/lib/rr-vps/lego \
              /usr/local/lib/rr-vps/lego.install; do
              rr_audit_path_absent "$target" || return 0
            done
            return 1
          }
          rr_audit_remove_known_orphan_external_helper() {
            local target=/usr/local/sbin/rr-update-external-state
            local source="$runtime/scripts/update-external-state.py"
            local target_before="" target_after="" source_hash="" target_hash=""
            local unit=""
            rr_audit_non_external_product_evidence_present && return 1
            rr_audit_path_absent /var/lib/rr-backup/active || return 1
            for unit in subscription_server_running managed_singbox_running; do
              declare -F "$unit" >/dev/null 2>&1 || return 1
              "$unit" >/dev/null 2>&1 && return 1
            done
            rr_audit_cloudflared_process_present && return 1
            for unit in rr-update-recovery.service rr-restore-recovery.service \
              rr-restore-watchdog.service rr-subscription-quarantine.service \
              rr-nexus.service rr-subscription.service sing-box.service \
              rr-nexus-ip-acme.service rr-nexus-ip-acme.timer \
              argo-rr-health.timer argo-rr-health.service; do
              rr_audit_unit_absent "$unit" || return 1
            done
            rr_uninstall_regular_file_is_exact "$target" 755 || return 1
            [ -f "$source" ] && [ ! -L "$source" ] || return 1
            case "$(stat -c '%u:%g:%a:%h' -- "$source" 2>/dev/null)" in
              0:0:700:1|0:0:755:1) ;;
              *) return 1 ;;
            esac
            source_hash=$(sha256sum -- "$source" 2>/dev/null | awk '{print $1}') || return 1
            [ "$source_hash" = bf61a9ed170a67309f562937d4057252b81e3afc85c9f2e277f2aa30a9f06e98 ] || \
              return 1
            target_before=$(stat -c '%d:%i:%u:%g:%a:%h:%s' -- "$target" 2>/dev/null) || \
              return 1
            target_hash=$(sha256sum -- "$target" 2>/dev/null | awk '{print $1}') || return 1
            [ "$target_hash" = "$source_hash" ] && cmp -s -- "$target" "$source" || return 1
            sync -f "$target" || return 1
            sync -f /usr/local/sbin || return 1
            target_after=$(stat -c '%d:%i:%u:%g:%a:%h:%s' -- "$target" 2>/dev/null) || \
              return 1
            [ "$target_before" = "$target_after" ] || return 1
            [ "$(sha256sum -- "$target" 2>/dev/null | awk '{print $1}')" = "$source_hash" ] && \
              cmp -s -- "$target" "$source" || return 1
            unlink -- "$target" || return 1
            sync -f /usr/local/sbin || return 1
            rr_audit_path_absent "$target"
          }
          rr_audit_remove_v710_orphan_maintenance() {
            local marker=/run/rr-vps/update-maintenance parent=/run/rr-vps
            local target="" canonical="" marker_value="" last_byte=""
            local -a marker_lines=()
            rr_audit_product_evidence_present && return 1
            rr_audit_path_absent /var/lib/rr-backup/active || return 1
            for target in subscription_server_running managed_singbox_running; do
              declare -F "$target" >/dev/null 2>&1 || return 1
              "$target" && return 1
            done
            rr_audit_cloudflared_process_present && return 1
            for target in rr-update-recovery.service rr-restore-recovery.service \
              rr-restore-watchdog.service rr-subscription-quarantine.service \
              rr-nexus.service rr-subscription.service sing-box.service \
              rr-nexus-ip-acme.service rr-nexus-ip-acme.timer \
              argo-rr-health.timer \
              argo-rr-health.service; do
              rr_audit_unit_absent "$target" || return 1
            done
            [ -d "$parent" ] && [ ! -L "$parent" ] || return 1
            command -v mountpoint >/dev/null 2>&1 || return 1
            mountpoint -q -- "$parent" && return 1
            canonical=$(readlink -e -- "$parent" 2>/dev/null) || return 1
            [ "$canonical" = "$parent" ] || return 1
            [ "$(stat -c '%u:%g:%a' -- "$parent" 2>/dev/null)" = 0:0:700 ] || return 1
            [ -f "$marker" ] && [ ! -L "$marker" ] || return 1
            [ "$(stat -c '%u:%g:%a:%h' -- "$marker" 2>/dev/null)" = 0:0:600:1 ] || return 1
            mapfile -t marker_lines < "$marker"
            [ "${#marker_lines[@]}" -eq 1 ] || return 1
            [[ "${marker_lines[0]}" =~ ^/var/lib/rr-update/transactions/[0-9]{8}T[0-9]{6}Z-[1-9][0-9]*$ ]] || return 1
            marker_value="${marker_lines[0]}"
            [ "$(stat -c %s -- "$marker" 2>/dev/null)" -eq \
              "$(( ${#marker_value} + 1 ))" ] || return 1
            last_byte=$(tail -c 1 -- "$marker" 2>/dev/null | \
              od -An -tx1 | tr -d ' \n') || return 1
            [ "$last_byte" = 0a ] || return 1
            rr_audit_path_absent "$marker_value" || return 1
            sync -f "$marker" || return 1
            sync -f "$parent" || return 1
            [ "$(stat -c '%u:%g:%a' -- "$parent" 2>/dev/null)" = 0:0:700 ] || return 1
            [ "$(stat -c '%u:%g:%a:%h' -- "$marker" 2>/dev/null)" = 0:0:600:1 ] || return 1
            mapfile -t marker_lines < "$marker"
            [ "${#marker_lines[@]}" -eq 1 ] || return 1
            [ "${marker_lines[0]}" = "$marker_value" ] || return 1
            [ "$(stat -c %s -- "$marker" 2>/dev/null)" -eq \
              "$(( ${#marker_value} + 1 ))" ] || return 1
            last_byte=$(tail -c 1 -- "$marker" 2>/dev/null | \
              od -An -tx1 | tr -d ' \n') || return 1
            [ "$last_byte" = 0a ] || return 1
            rr_audit_path_absent "$marker_value" || return 1
            rm -f -- "$marker" || return 1
            sync -f "$parent" || return 1
            rr_audit_path_absent "$marker"
          }
          rr_audit_classify_update_root() {
            local root=/var/lib/rr-update transactions=/var/lib/rr-update/transactions
            [ "$role" = B ] || { printf '%s\n' not-applicable; return 0; }
            rr_audit_path_absent "$root" && { printf '%s\n' absent; return 0; }
            [ -d "$root" ] && [ ! -L "$root" ] || {
              printf '%s\n' unsafe
              return 0
            }
            command -v mountpoint >/dev/null 2>&1 || {
              printf '%s\n' unsafe
              return 0
            }
            mountpoint -q -- "$root" && { printf '%s\n' unsafe; return 0; }
            [ "$(readlink -e -- "$root" 2>/dev/null)" = "$root" ] || {
              printf '%s\n' unsafe
              return 0
            }
            [ "$(stat -c '%u:%g:%a' -- "$root" 2>/dev/null)" = 0:0:700 ] || {
              printf '%s\n' unsafe
              return 0
            }
            if [ -z "$(find "$root" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              printf '%s\n' empty
              return 0
            fi
            if [ -d "$transactions" ] && [ ! -L "$transactions" ] && \
               [ "$(readlink -e -- "$transactions" 2>/dev/null)" = "$transactions" ] && \
               [ "$(stat -c '%u:%g:%a' -- "$transactions" 2>/dev/null)" = 0:0:700 ] && \
               ! mountpoint -q -- "$transactions" && \
               [ -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -name transactions -print -quit 2>/dev/null)" ] && \
               [ -z "$(find "$transactions" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              printf '%s\n' transactions-empty
            else
              printf '%s\n' other
            fi
          }
          rr_audit_classify_v710_orphan() {
            local marker=/run/rr-vps/update-maintenance parent=/run/rr-vps
            local target="" canonical="" marker_value="" last_byte="" spec="" token=""
            local -a marker_lines=() evidence_specs=(
              launcher:/usr/local/bin/rr runtime:/usr/local/lib/rr
              config:/etc/argo_vmess.conf singbox-bin:/usr/local/bin/sing-box
              subscription-bin:/usr/local/bin/auto_update_sub.py
