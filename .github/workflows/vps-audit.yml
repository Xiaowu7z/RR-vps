          cleanup_cross_audit() {
            local body_rc="$?" failure_stage="${audit_stage:-runner-unknown}"
            local final_rc=0 cleanup_failed=false
            trap - EXIT
            final_rc="$body_rc"
            if [ "$body_rc" -ne 0 ]; then
              case "$failure_stage" in
                runner-preflight|runner-passphrase|runner-source|runner-copy|\
                runner-target|runner-complete) ;;
                *) failure_stage=runner-unknown ;;
              esac
              printf 'RR_AUDIT_CROSS_FAILURE side=runner stage=%s rc=%s\n' \
                "$failure_stage" "$body_rc" >&2
            fi
            if ! rm -f -- "$passphrase_file" "$backup_file" "$fingerprint_file" \
                 >/dev/null 2>&1; then
              printf 'RR_AUDIT_CROSS_FAILURE side=runner stage=runner-cleanup-local rc=1\n' >&2
              cleanup_failed=true
            fi
            for local_sensitive_file in "$passphrase_file" "$backup_file" \
              "$fingerprint_file"; do
              if [ -e "$local_sensitive_file" ] || [ -L "$local_sensitive_file" ]; then
                cleanup_failed=true
              fi
            done
            if ! recover_audit_source_config >/dev/null 2>&1; then
              printf 'RR_AUDIT_CROSS_FAILURE side=runner stage=runner-cleanup-source rc=1\n' >&2
              cleanup_failed=true
            fi
            if ! cleanup_audit_target_state >/dev/null 2>&1; then
              printf 'RR_AUDIT_CROSS_FAILURE side=runner stage=runner-cleanup-target rc=1\n' >&2
              cleanup_failed=true
            fi
            if [ "$cleanup_failed" = true ]; then
              [ "$final_rc" -ne 0 ] || final_rc=1
            fi
            exit "$final_rc"
          }
          trap cleanup_cross_audit EXIT

          prepare_known_hosts "$a_host" "$RR_A_HOST_KEY" "$a_known_hosts"
          prepare_known_hosts "$c_host" "$RR_C_HOST_KEY" "$c_known_hosts"
          recover_audit_source_config
          cleanup_audit_target_state
          arm_audit_source_cleanup_timer
          arm_audit_target_cleanup_timer
          audit_stage=runner-passphrase
          (umask 077; openssl rand -base64 48 > "$passphrase_file")
          test "$(stat -c %a "$passphrase_file")" = 600
          test "$(wc -c < "$passphrase_file")" -ge 48
          SSHPASS="$RR_A_PASS" sshpass -e scp "${ssh_common[@]}" \
            -o UserKnownHostsFile="$a_known_hosts" -q "$passphrase_file" \
