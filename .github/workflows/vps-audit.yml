# Temporary owner-authorized audit diagnostics; remove after the three-VPS gate.
name: Temporary VPS redacted failure diagnostics

on:
  push:
    branches: [main]
    paths: [".github/workflows/vps-audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: "${{ matrix.role }} · redacted diagnostics"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: A
            expected_id: debian
            expected_version: "12"
          - role: B
            expected_id: ubuntu
            expected_version: "22.04"
    env:
      RR_A_HOST: ${{ secrets.RR_A_HOST }}
      RR_A_PASS: ${{ secrets.RR_A_PASS }}
      RR_B_HOST: ${{ secrets.RR_B_HOST }}
      RR_B_PASS: ${{ secrets.RR_B_PASS }}
    steps:
      - name: Install SSH password client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Print only redacted error evidence
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
          EXPECTED_ID: ${{ matrix.expected_id }}
          EXPECTED_VERSION: ${{ matrix.expected_version }}
        run: |
          set -euo pipefail
          set +x
          case "$ROLE" in
            A) host="$RR_A_HOST"; export SSHPASS="$RR_A_PASS" ;;
            B) host="$RR_B_HOST"; export SSHPASS="$RR_B_PASS" ;;
            *) exit 2 ;;
          esac
          known_hosts="$RUNNER_TEMP/known-hosts-$ROLE"
          sshpass -e ssh \
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2 \
            -o LogLevel=ERROR -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$known_hosts" \
            "root@$host" bash -s -- "$ROLE" "$EXPECTED_ID" "$EXPECTED_VERSION" <<'REMOTE'
          set -euo pipefail
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          role="$1"
          expected_id="$2"
          expected_version="$3"
          # shellcheck disable=SC1091
          . /etc/os-release
          test "$ID" = "$expected_id"
          test "$VERSION_ID" = "$expected_version"
          printf 'RR_AUDIT_DIAG role=%s runtime=' "$role"
          if [ -x /usr/local/bin/rr ]; then
            /usr/local/bin/rr --version | head -1
          else
            printf 'missing\n'
          fi
          printf 'config=%s install_complete=%s active_tx=%s\n' \
            "$([ -f /etc/argo_vmess.conf ] && printf present || printf absent)" \
            "$(grep -q '^INSTALL_COMPLETE=true$' /etc/argo_vmess.conf 2>/dev/null && printf yes || printf no)" \
            "$([ -e /var/lib/rr-update/active ] && printf yes || printf no)"
          for unit in sing-box rr-nexus nginx; do
            printf 'service_%s=%s\n' "$unit" "$(systemctl is-active "$unit" 2>/dev/null || true)"
          done
          for log in \
            /root/rr-audit-core.log /root/rr-audit-install.log /root/rr-audit-nexus.log \
            /root/rr-audit-old-core.log /root/rr-audit-old-install.log /root/rr-audit-old-nexus.log \
            /root/rr-audit-upgrade.log /root/rr-audit-manual-rollback.log; do
            [ -r "$log" ] || continue
            printf 'error_log=%s\n' "$(basename "$log")"
            grep -Ei '\[失败\]|\[错误\]|failed|failure|error|invalid|refus|无法|拒绝|证书' "$log" 2>/dev/null \
              | tail -n 12 \
              | sed -E \
                  -e 's#(UUID|PASS|PASSWORD|TOKEN|SECRET|RECOVERY)([=: ]+)[^ ]+#\1\2[redacted]#Ig' \
                  -e 's#[A-Fa-f0-9]{32,}#[redacted]#g' \
                  -e 's#[A-Za-z0-9_-]{40,}#[redacted]#g' \
              || true
            if [ ! -f /etc/argo_vmess.conf ]; then
              printf 'redacted_tail=%s\n' "$(basename "$log")"
              tail -n 60 "$log" \
                | sed -E \
                    -e 's#(UUID|PASS|PASSWORD|TOKEN|SECRET|RECOVERY)([=: ]+)[^ ]+#\1\2[redacted]#Ig' \
                    -e 's#[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,36}#[redacted]#g' \
                    -e 's#[A-Za-z0-9_+/=-]{20,}#[redacted]#g'
            fi
          done
          printf 'RR_AUDIT_DIAG_COMPLETE role=%s\n' "$role"
          REMOTE
