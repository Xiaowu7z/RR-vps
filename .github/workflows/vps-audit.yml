            | cmp -s /run/rr-audit-cross-target-channel -
          test "$(stat -c '%U:%G:%a:%h' /run/rr-vps-subscription.bind)" = root:root:600:1
          cmp -s /run/rr-vps-subscription.bind /run/rr-audit-cross-target-bind
          audit_stage=c-firewall-verify
          verified_backend_count=0
          for backend in iptables ip6tables; do
