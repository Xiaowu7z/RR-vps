            local unit="$1" expected="$2" load_state="" active_state=""
            local unit_file_state=""
            load_state=$(systemctl show -p LoadState --value "$unit" 2>/dev/null) || return 1
            active_state=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null) || return 1
            unit_file_state=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null) || return 1
            if [ "$load_state" = not-found ] && [ -z "$unit_file_state" ]; then
              unit_file_state=not-found
            fi
            test "$load_state:$active_state:$unit_file_state" = "$expected"
          }
          assert_rr_http_routes_absent() {
            local path=""
            for path in \
              /etc/nginx/sites-available/rr-nexus.conf \
              /etc/nginx/sites-available/rr-nexus.conf.port \
              /etc/nginx/sites-available/rr-nexus-ip.conf \
              /etc/nginx/sites-available/rr-nexus-ip-acme-http.conf \
              /etc/nginx/sites-enabled/rr-nexus.conf \
              /etc/nginx/sites-enabled/rr-nexus-port.conf \
              /etc/nginx/sites-enabled/rr-nexus-ip.conf \
              /etc/nginx/sites-enabled/rr-nexus-ip-acme-http.conf; do
              [ ! -e "$path" ] && [ ! -L "$path" ] || return 1
            done
          }
          command -v pgrep >/dev/null
          old_nginx_master=$(systemctl show -p MainPID --value nginx.service)
          [[ "$old_nginx_master" =~ ^[1-9][0-9]*$ ]]
          test "$(systemctl show -p ActiveState --value nginx.service)" = active
          old_nginx_workers=()
          while IFS= read -r worker_pid; do
            [[ "$worker_pid" =~ ^[1-9][0-9]*$ ]]
            worker_start=$(awk '{print $22}' "/proc/${worker_pid}/stat")
            [[ "$worker_start" =~ ^[1-9][0-9]*$ ]]
            old_nginx_workers+=("${worker_pid}:${worker_start}")
          done < <(pgrep -P "$old_nginx_master" -x nginx)
          test "${#old_nginx_workers[@]}" -ge 1
          old_nginx_workers_retired() {
            local identity="" pid="" expected_start="" current_start=""
            for identity in "${old_nginx_workers[@]}"; do
              pid="${identity%%:*}"
              expected_start="${identity#*:}"
              if [ ! -e "/proc/${pid}" ]; then
                continue
              fi
              [ -r "/proc/${pid}/stat" ] || return 1
              current_start=$(awk '{print $22}' "/proc/${pid}/stat") || return 1
              [[ "$current_start" =~ ^[1-9][0-9]*$ ]] || return 1
              [ "$current_start" != "$expected_start" ] || return 1
            done
          }
          /usr/local/bin/rr --nexus-ip-acme-uninstall >>"$audit_log" 2>&1
          assert_unit_state rr-nexus-ip-acme.service not-found:inactive:not-found
          assert_unit_state rr-nexus-ip-acme.timer not-found:inactive:not-found
          for path in \
            /var/lib/rr-nexus/ip-acme /var/www/rr-nexus-ip-acme \
            /etc/systemd/system/rr-nexus-ip-acme.service \
            /etc/systemd/system/rr-nexus-ip-acme.timer \
            /etc/rr-nexus/certs/ip.crt /etc/rr-nexus/certs/ip.key \
            /etc/rr-nexus/certs/.ip-cert-pending \
            /usr/local/lib/rr-vps/nexus-ip-cert-gate \
            /etc/systemd/system/nginx.service.d/zzzzzz-rr-nexus-ip-cert-gate.conf; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              exit 1
            fi
          done
          assert_rr_http_routes_absent
          assert_unit_state rr-nexus.service loaded:active:enabled
          curl -fsS --connect-timeout 2 --max-time 10 \
            http://127.0.0.1:7900/healthz >/dev/null
          bash -c '
            set -o pipefail
            for module_file in /usr/local/lib/rr/modules/*.sh; do
              # shellcheck disable=SC1090
              source "$module_file"
            done
            rr_run_with_update_locks direct 180 uninstall_all_locked
          ' >>"$audit_log" 2>&1
          rm -rf -- /root/rr-audit-ip-candidate
          assert_rr_http_routes_absent
          test ! -e /usr/local/bin/rr
          test ! -e /usr/local/lib/rr
          old_workers_gone=false
          worker_wait=0
          while [ "$worker_wait" -lt 30 ]; do
            if old_nginx_workers_retired; then
              old_workers_gone=true
              break
            fi
            worker_wait=$((worker_wait + 1))
            [ "$worker_wait" -lt 30 ] && sleep 1
          done
          test "$old_workers_gone" = true
          new_nginx_master=$(systemctl show -p MainPID --value nginx.service)
          [[ "$new_nginx_master" =~ ^[1-9][0-9]*$ ]]
          test "$(systemctl show -p ActiveState --value nginx.service)" = active
          new_worker_count=0
          while IFS= read -r worker_pid; do
            [[ "$worker_pid" =~ ^[1-9][0-9]*$ ]]
            worker_start=$(awk '{print $22}' "/proc/${worker_pid}/stat")
            [[ "$worker_start" =~ ^[1-9][0-9]*$ ]]
            new_worker_count=$((new_worker_count + 1))
          done < <(pgrep -P "$new_nginx_master" -x nginx)
          test "$new_worker_count" -ge 1
          REMOTE_FINAL
          cleanup_required=false
          if nc -4 -z -w 5 "$RR_B_PUBLIC_IPV4" "$panel_port"; then
            echo 'IP ACME audit panel port remained reachable after uninstall.' >&2
            exit 1
          fi
          SSHPASS="$RR_C_PASS" sshpass -e ssh "${ssh_common[@]}" \
            -o UserKnownHostsFile="$c_known_hosts" "root@$RR_C_HOST" \
            bash -s -- "$RR_B_PUBLIC_IPV6" "$panel_port" <<'REMOTE_C_CLOSED'
          set -euo pipefail
          address="$1"
          panel_port="$2"
          if curl -gkfsS --noproxy '*' --connect-timeout 5 --max-time 10 \
            "https://[${address}]:${panel_port}/healthz" >/dev/null 2>&1; then
            echo 'IPv6 panel remained reachable after IP ACME uninstall.' >&2
            exit 1
          fi
          REMOTE_C_CLOSED
          echo 'Trusted public-IP audit passed for independent IPv4 and IPv6 certificates, externally verified personal subscriptions, renewal no-op, and owned cleanup.'

  vps-gate:
    name: Event-complete VPS release gate
    if: always()
    needs:
      - debian-full
      - ubuntu-upgrade
      - ubuntu-transaction
      - cross-machine-migration-scale
      - public-ip-acme
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the exact job set for this event
        env:
          A_RESULT: ${{ needs.debian-full.result }}
          B_RESULT: ${{ needs.ubuntu-upgrade.result }}
          C_RESULT: ${{ needs.ubuntu-transaction.result }}
          M_RESULT: ${{ needs.cross-machine-migration-scale.result }}
          IP_RESULT: ${{ needs.public-ip-acme.result }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          case "$GITHUB_EVENT_NAME" in
            push)
              test "$A_RESULT" = success
              test "$B_RESULT" = success
              test "$C_RESULT" = success
              test "$M_RESULT" = success
              test "$IP_RESULT" = skipped
              echo 'Push VPS release gate passed with pinned SSH host keys, encrypted A-to-C migration, and real 1/10/100/500-device synchronization; this is not a real client traffic claim.'
              ;;
            workflow_dispatch)
              test "$A_RESULT" = skipped
              test "$B_RESULT" = skipped
              test "$C_RESULT" = skipped
              test "$M_RESULT" = skipped
              test "$IP_RESULT" = success
              echo 'Dispatch VPS release gate passed with externally verified IPv4 and IPv6 trusted-IP HTTPS subscriptions and owned cleanup.'
              ;;
            *) exit 1 ;;
          esac
