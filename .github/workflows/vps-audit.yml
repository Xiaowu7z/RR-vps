                nexus_install
              ' >>"$old_panel_log" 2>&1; then
            echo 'B old-version Nexus install failed; root-only log retained on VPS.' >&2
            exit 1
          fi
          unset panel_pass
          rm -f -- /root/rr-audit-panel-pass
          test ! -e /root/rr-audit-panel-pass
          test ! -L /root/rr-audit-panel-pass

          # A disposable upgrade fixture must start from an empty device set.
          # This prevents an interrupted historical audit from contaminating
          # the next exact 7.1.0 -> candidate migration exercise.
          test "$(sqlite3 /var/lib/rr-nexus/nexus.db \
            'SELECT COUNT(*) FROM devices;')" -eq 0

          assert_unit_state sing-box.service loaded:active:enabled
          assert_unit_state rr-nexus.service loaded:active:enabled
          assert_unit_state nginx.service loaded:active:enabled
          test -s /tmp/sub_server.pid
          kill -0 "$(cat /tmp/sub_server.pid)"
          printf 'old-state-built\n' > /root/rr-audit-stage
          legacy_credential=$(cat /proc/sys/kernel/random/uuid)
          legacy_token=$(openssl rand -hex 24)
          device_row() {
            sqlite3 -separator '|' /var/lib/rr-nexus/nexus.db \
              "SELECT id,name,credential,subscription_token,enabled,quota_bytes,
                      used_bytes,uploaded_bytes,downloaded_bytes,traffic_updated_at,
                      COALESCE(group_id,'<NULL>'),expires_at,next_reset_at,
                      reset_anchor_day,reset_max,reset_count,created_at,updated_at
                 FROM devices WHERE id='dev_a1b2c3d4e5f6';"
          }
          sqlite3 /var/lib/rr-nexus/nexus.db <<SQL
          INSERT INTO devices(
            id,name,credential,subscription_token,enabled,quota_bytes,used_bytes,
            uploaded_bytes,downloaded_bytes,traffic_updated_at,group_id,expires_at,
            next_reset_at,reset_anchor_day,reset_max,reset_count,created_at,updated_at
          ) VALUES(
            'dev_a1b2c3d4e5f6','legacy-phone','$legacy_credential',
            '$legacy_token',1,10737418240,1234567,456789,777778,
            '2026-08-27T00:00:00+00:00',NULL,'2027-08-27','2026-09-27',27,12,3,
            '2026-08-01T00:00:00+00:00','2026-08-27T00:00:00+00:00'
          );
          SQL
          expected_device="dev_a1b2c3d4e5f6|legacy-phone|${legacy_credential}|${legacy_token}|1|10737418240|1234567|456789|777778|2026-08-27T00:00:00+00:00|<NULL>|2027-08-27|2026-09-27|27|12|3|2026-08-01T00:00:00+00:00|2026-08-27T00:00:00+00:00"
          test "$(device_row)" = "$expected_device"
          test "$(sqlite3 /var/lib/rr-nexus/nexus.db \
            'SELECT COUNT(*) FROM devices;')" -eq 1
          bash -c '
            set -eo pipefail
            for module_file in /usr/local/lib/rr/modules/*.sh; do
              # shellcheck disable=SC1090
              source "$module_file"
            done
            nexus_traffic_user_names \
              | jq -e '\''type == "array" and length == 1 and
                all(.[]; test("^dev_[a-f0-9]{12}$"))'\'' >/dev/null
          '
          printf '%s\n' "$expected_device" > /root/rr-audit-before-device.txt
          unset legacy_credential legacy_token
          systemctl restart rr-nexus
          sleep 2
          sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA wal_checkpoint(FULL);' >/dev/null
          cp -p /etc/argo_vmess.conf /root/rr-audit-before.conf
          cp -p /etc/rr-nexus/nexus.json /root/rr-audit-before-nexus.json
          jq -cS '{
            mode,listen,port,domain,stats_port,ssh_host,public_port,traffic_mode
          }' /etc/rr-nexus/nexus.json > /root/rr-audit-before-nexus-stable.json
          chmod 600 /root/rr-audit-before.* /root/rr-audit-before-device.txt

          install_candidate() {
            RR_BUNDLE_FILE="$candidate/rr-bundle.tar.gz" \
            RR_GUARD_FILE="$candidate/update-guard.sh" \
              bash "$candidate/install-core.sh" --upgrade
          }
          assert_persisted_data() {
            test "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA quick_check;')" = ok
            foreign_key_errors=$(sqlite3 /var/lib/rr-nexus/nexus.db \
              'PRAGMA foreign_key_check;') || return 1
            test -z "$foreign_key_errors"
            test "$(device_row)" = "$(cat /root/rr-audit-before-device.txt)"
            for key in UUID PORT SUB_PORT SUB_PUBLIC_PORT_IPV4 SUB_PUBLIC_PORT_IPV6 \
              VM_ENABLED VM_TLS_ENABLED VL_ENABLED VL_PORT \
              HY2_ENABLED HY2_PORT HY2_HOP_PORTS HY2_HOP_INTERVAL TU5_ENABLED TU5_PORT \
              TU5_HOP_PORTS AN_ENABLED AN_PORT NAIVE_ENABLED PRIVATE_KEY PUBLIC_KEY \
              SHORT_ID CERT_SHA256; do
              before=$(grep -m1 "^${key}=" /root/rr-audit-before.conf)
              after=$(grep -m1 "^${key}=" /etc/argo_vmess.conf)
              test "$before" = "$after"
            done
            jq -cS '{
              mode,listen,port,domain,stats_port,ssh_host,public_port,traffic_mode
            }' /etc/rr-nexus/nexus.json \
              | cmp -s /root/rr-audit-before-nexus-stable.json -
          }
          candidate_subscription_running() {
            bash -c '
              set -e
              for module_file in /usr/local/lib/rr/modules/*.sh; do
                # shellcheck disable=SC1090
                source "$module_file"
              done
              subscription_server_running
            ' >/dev/null
          }
          managed_subscription_process_exists() {
            expected_cwd=$(readlink -f /tmp/sub_server 2>/dev/null) || return 1
            for process_dir in /proc/[0-9]*; do
              [ -r "$process_dir/cmdline" ] || continue
              cmdline=$(tr '\0' ' ' < "$process_dir/cmdline" 2>/dev/null) || continue
              case "$cmdline" in
                *"python3 -m http.server"*|*"nexus/sub_server.py"*) ;;
                *) continue ;;
              esac
              process_cwd=$(readlink -f "$process_dir/cwd" 2>/dev/null) || continue
              [ "$process_cwd" = "$expected_cwd" ] && return 0
            done
            return 1
          }
          assert_candidate_runtime() {
            /usr/local/bin/rr --version | grep -F "RR-vps ${expected_version}" >/dev/null
            expected_rr=$(awk '$2 == "rr" {print $1}' /usr/local/lib/rr/manifest.sha256)
            test "$(sha256sum /usr/local/bin/rr | awk '{print $1}')" = "$expected_rr"
            (
              cd /usr/local/lib/rr
              awk '$2 != "rr"' manifest.sha256 | sha256sum -c - >/dev/null
            )
            /usr/local/bin/sing-box check -c /etc/sing-box/config.json >/dev/null
            assert_unit_state sing-box.service loaded:active:enabled
            assert_unit_state rr-nexus.service loaded:active:enabled
            assert_unit_state nginx.service loaded:active:enabled
            candidate_subscription_running
            test -s /run/rr-vps-subscription.pid
            bash -c '
              set -e
              for module_file in /usr/local/lib/rr/modules/*.sh; do
                # shellcheck disable=SC1090
                source "$module_file"
              done
              load_config_with_defaults
              test "$SUB_ACCESS_MODE" = local
              test -z "$SUB_DOMAIN"
            ' >/dev/null
            IFS='|' read -r candidate_sub_port candidate_sub_bind \
              candidate_sub_mode candidate_sub_domain _ \
              < /run/rr-vps-subscription.bind
            test "$candidate_sub_port" = 18081
            test "$candidate_sub_bind" = 127.0.0.1
            test "$candidate_sub_mode" = local
            test -z "$candidate_sub_domain"
            bash -c '
              set -e
              for module_file in /usr/local/lib/rr/modules/*.sh; do
                # shellcheck disable=SC1090
                source "$module_file"
              done
              load_config_with_defaults
              # Active UFW keeps the exact 7.1.0 ACCEPT until the manual
              # rollback window below is retired.  Accept either the final
              # DROP state or that one attributable legacy state, but only
              # while the live worker is proven loopback-only.
              rr_validate_local_subscription_firewall_transition 18081
            ' >/dev/null
            assert_persisted_data
            panel_port=$(jq -r '.public_port' /etc/rr-nexus/nexus.json)
            curl -kfsS --connect-timeout 5 --max-time 15 \
              "https://127.0.0.1:${panel_port}/healthz" >/dev/null
          }
          assert_legacy_quarantine() {
            /usr/local/bin/rr --version | grep -F 'RR-vps 7.1.0' >/dev/null
            assert_persisted_data
            status_json=$(/usr/local/sbin/rr-update-recover status)
            jq -e '
              .active == false and
              .subscription_quarantine.active == true and
              .subscription_quarantine.state == "quarantined" and
              .subscription_quarantine.target_version == "7.1.0" and
              .subscription_quarantine.port == 18081 and
              .subscription_quarantine.resume_subscription == 1
            ' <<<"$status_json" >/dev/null
            test "$(stat -c '%U:%G:%a' /var/lib/rr-update/subscription-quarantine)" = root:root:600
            test "$(stat -c '%U:%G:%a' /run/rr-subscription-quarantine.ready)" = root:root:600
            test "$(stat -c '%U:%G:%a' /var/lib/rr-quarantine/guard-state)" = root:root:600
            test "$(stat -c '%U:%G:%a' /usr/local/libexec/rr-vps/subscription-quarantine-guard)" = root:root:700
            assert_unit_state rr-subscription-quarantine.service loaded:active:enabled
            if managed_subscription_process_exists; then
              echo 'B quarantine left a managed legacy subscription worker running.' >&2
              return 1
            fi
            python3 - <<'PY'
          import errno
          import socket

          sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          try:
              sock.bind(("0.0.0.0", 18081))
          except OSError as exc:
              if exc.errno != errno.EADDRINUSE:
                  raise
          else:
              raise SystemExit("quarantine did not reserve the subscription port")
          finally:
              sock.close()
          PY
            # Product semantics require one exact IPv4 rule and require the
            # IPv6 twin only when the kernel has an enabled IPv6 interface.
            assert_product_quarantine_firewall
          }

          upgrade_log=/root/rr-audit-upgrade.log
          rm -f -- "$upgrade_log"
          (umask 077; : > "$upgrade_log")
          test "$(stat -c '%u:%g:%a:%h' -- "$upgrade_log")" = 0:0:600:1
          emit_safe_upgrade_diag() {
            local log="$1"
            local checkpoint_re="" phase_re="" writer_re=""
            [ -f "$log" ] && [ ! -L "$log" ] || return 0
            [ "$(stat -c '%u:%g:%a:%h' -- "$log" 2>/dev/null)" = \
              0:0:600:1 ] || return 0
            checkpoint_re='(pre-snapshot|phase-switching|old-runtime-move|runtime-install|phase-runtime-swapped|launcher-install|quarantine-suspend|phase-migrating|ip-acme-pre|post-update|writer-verify|durability-sync|phase-commit|unknown)'
            phase_re='(state_recorded|freezing|snapshotting|prepared|switching|runtime_swapped|migrating|unknown)'
            writer_re='(singbox-identity|nexus-identity|subscription-freeze|singbox-restore|ip-acme-restore|nexus-restore|health-timer-restore|health-service-restart|health-quiesce|subscription-resume|unknown)'
            LC_ALL=C grep -aE \
              "^\\[RR-vps\\] DIAG (update_failure_gate=${checkpoint_re} rollback_phase=${phase_re}|rollback_writer_gate=${writer_re})$" \
              -- "$log" >&2 || true
          }

          assert_pure_v710_recovery_runtime
          if ! install_candidate >"$upgrade_log" 2>&1; then
            emit_safe_upgrade_diag "$upgrade_log"
            echo 'B candidate upgrade failed; root-only log retained on the VPS.' >&2
            exit 1
          fi
          assert_candidate_runtime
          printf 'first-upgrade-complete\n' > /root/rr-audit-stage
          set +e
          /usr/local/sbin/rr-update-recover rollback \
            >/root/rr-audit-manual-rollback.log 2>&1
          rollback_rc=$?
          set -e
          test "$rollback_rc" -eq 3
          assert_legacy_quarantine
          printf 'manual-rollback-complete\n' > /root/rr-audit-stage
          test "$(stat -c '%u:%g:%a:%h' -- "$upgrade_log")" = 0:0:600:1
          if ! install_candidate >>"$upgrade_log" 2>&1; then
            emit_safe_upgrade_diag "$upgrade_log"
            echo 'B candidate re-upgrade failed; root-only log retained on the VPS.' >&2
            exit 1
          fi
          assert_candidate_runtime
          status_json=$(/usr/local/sbin/rr-update-recover status)
          jq -e '.subscription_quarantine.active == false' <<<"$status_json" >/dev/null
          test ! -e /var/lib/rr-update/subscription-quarantine
          test ! -e /run/rr-subscription-quarantine.ready
          test ! -e /etc/systemd/system/rr-subscription-quarantine.service
          test ! -e /var/lib/rr-quarantine/guard-state
          test ! -e /usr/local/libexec/rr-vps/subscription-quarantine-guard
          assert_unit_state rr-subscription-quarantine.service \
            not-found:inactive:not-found
          assert_product_quarantine_firewall_absent
          printf 'second-upgrade-complete\n' > /root/rr-audit-stage
          test "$(stat -c %a /etc/argo_vmess.conf)" = 600
          test "$(stat -c %a /var/lib/rr-nexus/nexus.db)" = 600
          printf 'RR_AUDIT_UPGRADE_RUNTIME role=B os=%s version=%s old=7.1.0 new=%s rollback=ok device_config=preserved\n' \
            "$ID" "$VERSION_ID" "$expected_version"
          REMOTE
          if nc -z -w 8 "$host" 18081 >/dev/null 2>&1; then
            echo 'B local-only subscription unexpectedly accepted a public connection.' >&2
            exit 1
          fi
          # Prove that the upgraded panel is reachable from outside the VPS
          # before the destructive legacy-uninstall compatibility check.
          curl -kfsS --connect-timeout 5 --max-time 20 \
            "https://${host}:10443/healthz" >/dev/null
          sshpass -e ssh "${ssh_opts[@]}" "root@$host" bash -s -- \
            "$(sed -n '1s/^RR-vps //p' version)" <<'REMOTE'
          set -euo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb
          expected_version="$1"
          # shellcheck disable=SC1091
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 22.04
          audit_exit() {
            rc=$?
            trap - EXIT
            if ! rm -f -- /root/rr-audit-panel-pass; then rc=1; fi
            if [ -e /root/rr-audit-panel-pass ] || \
               [ -L /root/rr-audit-panel-pass ]; then rc=1; fi
            find /root -maxdepth 1 -type f -name 'rr-audit-*.log' \
              -exec chmod 600 {} + 2>/dev/null || true
            exit "$rc"
          }
          trap audit_exit EXIT
          assert_unit_state() {
            local unit="$1" expected="$2" load_state="" active_state="" unit_file_state=""
            load_state=$(systemctl show -p LoadState --value "$unit" 2>/dev/null) || return 1
            active_state=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null) || return 1
            unit_file_state=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null) || return 1
            if [ "$load_state" = not-found ] && [ -z "$unit_file_state" ]; then
              unit_file_state=not-found
            fi
            test "$load_state:$active_state:$unit_file_state" = "$expected"
          }
          assert_product_quarantine_firewall() (
            export RR_UPDATE_RECOVER_SOURCE_ONLY=1
            # shellcheck disable=SC1091
            source /usr/local/sbin/rr-update-recover
            rr_quarantine_firewall_inventory_is_exact 18081
          )
          legacy_quarantine_fully_absent() {
            local artifact="" backend="" rules=""
            for artifact in \
              /var/lib/rr-update/subscription-quarantine \
              /run/rr-subscription-quarantine.ready \
              /etc/systemd/system/rr-subscription-quarantine.service \
              /var/lib/rr-quarantine/guard-state \
              /usr/local/libexec/rr-vps/subscription-quarantine-guard; do
              [ ! -e "$artifact" ] && [ ! -L "$artifact" ] || return 1
            done
            assert_unit_state rr-subscription-quarantine.service \
              not-found:inactive:not-found || return 1
            for backend in iptables ip6tables; do
              command -v "$backend" >/dev/null 2>&1 || continue
              rules=$("$backend" -w 5 -t raw -S PREROUTING 2>/dev/null) || return 1
              [[ "$rules" != *'rr-vps unsafe rollback subscription quarantine'* ]] || return 1
            done
          }
          test "$(id -u)" -eq 0
          # Re-enter the unsafe rollback once more and invoke the actual
          # restored 7.1.0 menu uninstaller. It knows nothing about quarantine
          # and deletes the helper before the marker; the independently loaded
          # guard must still remove its exact rule, unit and enablement.
          set +e
          /usr/local/sbin/rr-update-recover rollback \
            >/root/rr-audit-pre710-uninstall-rollback.log 2>&1
          rollback_rc=$?
          set -e
          test "$rollback_rc" -eq 3
          /usr/local/bin/rr --version | grep -F 'RR-vps 7.1.0' >/dev/null
          status_json=$(/usr/local/sbin/rr-update-recover status)
          jq -e '
            .active == false and
            .subscription_quarantine.active == true and
            .subscription_quarantine.state == "quarantined" and
            .subscription_quarantine.target_version == "7.1.0" and
            .subscription_quarantine.port == 18081 and
            .subscription_quarantine.resume_subscription == 1
          ' <<<"$status_json" >/dev/null
          test "$(stat -c '%U:%G:%a' /var/lib/rr-update/subscription-quarantine)" = root:root:600
          test "$(stat -c '%U:%G:%a' /run/rr-subscription-quarantine.ready)" = root:root:600
          test "$(stat -c '%U:%G:%a' /var/lib/rr-quarantine/guard-state)" = root:root:600
          test "$(stat -c '%U:%G:%a' /usr/local/libexec/rr-vps/subscription-quarantine-guard)" = root:root:700
          assert_unit_state rr-subscription-quarantine.service loaded:active:enabled
          assert_product_quarantine_firewall
          printf 'y\n' | bash -c '
            set -o pipefail
            for module_file in /usr/local/lib/rr/modules/*.sh; do
              # shellcheck disable=SC1090
              source "$module_file"
            done
            uninstall_all
          ' >/root/rr-audit-710-uninstall.log 2>&1
          legacy_quarantine_absent=false
          for _ in $(seq 1 30); do
            if legacy_quarantine_fully_absent; then
              legacy_quarantine_absent=true
              break
            fi
            sleep 1
          done
          legacy_quarantine_final=false
          if legacy_quarantine_fully_absent; then
            legacy_quarantine_final=true
          fi
          if [ "$legacy_quarantine_absent" != true ] ||
             [ "$legacy_quarantine_final" != true ]; then
            echo 'B legacy uninstall did not converge quarantine cleanup.' >&2
            exit 1
          fi
          test ! -e /usr/local/sbin/rr-update-recover
          test ! -e /usr/local/bin/rr
          assert_unit_state rr-nexus.service not-found:inactive:not-found
          test ! -e /etc/systemd/system/rr-nexus.service
          test ! -e /etc/rr-nexus
          test ! -e /var/lib/rr-nexus
          for nginx_path in \
            /etc/nginx/sites-enabled/rr-nexus.conf \
            /etc/nginx/sites-enabled/rr-nexus-ip.conf \
            /etc/nginx/sites-enabled/rr-nexus-port.conf \
            /etc/nginx/sites-available/rr-nexus.conf \
            /etc/nginx/sites-available/rr-nexus-ip.conf \
            /etc/nginx/sites-available/rr-nexus.conf.port; do
            test ! -e "$nginx_path" && test ! -L "$nginx_path"
          done
          if ! port_state=$(ss -H -ltn 'sport = :10443'); then
            echo 'B could not inspect the public panel port after uninstall.' >&2
            exit 1
          fi
          if grep -q . <<<"$port_state"; then
            echo 'B legacy uninstall left the public panel port listening.' >&2
            exit 1
          fi
          printf 'RR_AUDIT_UPGRADE_COMPLETE role=B os=%s version=%s old=7.1.0 new=%s rollback=ok device_config=preserved pre710_uninstall=clean\n' \
            "$ID" "$VERSION_ID" "$expected_version"
          REMOTE
          if curl -kfsS --connect-timeout 5 --max-time 20 \
            "https://${host}:10443/healthz" >/dev/null 2>&1; then
            echo 'B legacy uninstall left the public panel health endpoint reachable.' >&2
            exit 1
          fi

  ubuntu-transaction:
    name: C · Ubuntu 24.04 · clean transaction, recovery, and local tunnel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify candidate and prepare SSH client
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Clean host and install local Nexus
        shell: bash
        env:
          RR_C_HOST: ${{ secrets.RR_C_HOST }}
          RR_C_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3
          RR_C_PASS: ${{ secrets.RR_C_PASS }}
        run: |
          set -euo pipefail
          set +x
          export SSHPASS="$RR_C_PASS"
          host="$RR_C_HOST"
          [[ "$RR_C_HOST_KEY" != *$'\n'* ]]
          read -r host_key_type host_key_data host_key_extra <<<"$RR_C_HOST_KEY"
          [ "$host_key_type" = ssh-ed25519 ]
          [[ "$host_key_data" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          [ -z "$host_key_extra" ]
          expected_version=$(sed -n '1s/^RR-vps //p' version)
          [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bundle_sha=$(sha256sum rr-bundle.tar.gz | awk '{print $1}')
          core_sha=$(sha256sum scripts/install-core.sh | awk '{print $1}')
          guard_sha=$(sha256sum scripts/update-guard.sh | awk '{print $1}')
          known_hosts="$RUNNER_TEMP/known-hosts-C"
          (umask 077; printf '%s %s %s\n' "$host" "$host_key_type" "$host_key_data" > "$known_hosts")
          ssh-keygen -F "$host" -f "$known_hosts" >/dev/null
          ssh_opts=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes
            -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts"
          )
          sshpass -e ssh "${ssh_opts[@]}" "root@$host" \
            'install -d -m 700 /root/rr-audit-candidate'
          sshpass -e scp "${ssh_opts[@]}" -q \
            rr-bundle.tar.gz scripts/install-core.sh scripts/update-guard.sh \
            "root@$host:/root/rr-audit-candidate/"
          if ! sshpass -e ssh "${ssh_opts[@]}" "root@$host" bash -s -- \
            "$expected_version" "$bundle_sha" "$core_sha" "$guard_sha" <<'REMOTE'
          set -euo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb
          expected_version="$1"
          expected_bundle_sha="$2"
          expected_core_sha="$3"
          expected_guard_sha="$4"
          audit_exit() {
            rc=$?
            trap - EXIT
            if ! rm -f -- /root/rr-audit-panel-pass; then rc=1; fi
            if [ -e /root/rr-audit-panel-pass ] || \
