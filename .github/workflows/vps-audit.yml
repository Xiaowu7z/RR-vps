  public-ip-acme:
    name: B · trusted public-IP HTTPS · IPv4 and IPv6
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify candidate and prepare SSH client
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass netcat-openbsd

      - name: Issue and externally verify independent IPv4 and IPv6 certificates
        shell: bash
        env:
          RR_IP_ACME_EMAIL: ${{ secrets.RR_IP_ACME_EMAIL }}
          RR_B_HOST: ${{ secrets.RR_B_HOST }}
          RR_B_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A
          RR_B_PASS: ${{ secrets.RR_B_PASS }}
          RR_B_PUBLIC_IPV4: ${{ secrets.RR_B_PUBLIC_IPV4 }}
          RR_B_PUBLIC_IPV6: ${{ secrets.RR_B_PUBLIC_IPV6 }}
          RR_C_HOST: ${{ secrets.RR_C_HOST }}
          RR_C_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3
          RR_C_PASS: ${{ secrets.RR_C_PASS }}
        run: |
          set -euo pipefail
          set +x
          panel_port=18443
          node_port=24444
          b_known_hosts="$RUNNER_TEMP/known-hosts-ip-acme-B"
          c_known_hosts="$RUNNER_TEMP/known-hosts-ip-acme-C"
          ipv4_subscription="$RUNNER_TEMP/ip-acme-v4-subscription.txt"
          cleanup_required=true
          route_probe_name="rr-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          route_probe_value=$(openssl rand -hex 32)

          python3 - "$RR_IP_ACME_EMAIL" "$RR_B_PUBLIC_IPV4" \
            "$RR_B_PUBLIC_IPV6" <<'PY'
          import ipaddress
          import re
          import sys

          email, ipv4_raw, ipv6_raw = sys.argv[1:]
          if not re.fullmatch(r"[^\s@]+@[^\s@]+\.[^\s@]+", email):
              raise SystemExit("invalid IP ACME audit email secret")
          if any(character in email for character in "\r\n\0"):
              raise SystemExit("invalid IP ACME audit email secret")
          ipv4 = ipaddress.ip_address(ipv4_raw)
          ipv6 = ipaddress.ip_address(ipv6_raw)
          if ipv4.version != 4 or not ipv4.is_global or ipv4_raw != str(ipv4):
              raise SystemExit("RR_B_PUBLIC_IPV4 is not a global IPv4 address")
          if ipv6.version != 6 or not ipv6.is_global or ipv6_raw != str(ipv6):
              raise SystemExit("RR_B_PUBLIC_IPV6 is not a global IPv6 address")
          PY

          prepare_known_hosts() {
            local host="$1" pinned_key="$2" destination="$3"
            local key_type="" key_data="" key_extra=""
            [ -n "$host" ]
            [[ "$host" != *$'\n'* ]]
            [[ "$pinned_key" != *$'\n'* ]]
            read -r key_type key_data key_extra <<<"$pinned_key"
            [ "$key_type" = ssh-ed25519 ]
            [[ "$key_data" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
            [ -z "$key_extra" ]
            (umask 077; printf '%s %s %s\n' \
              "$host" "$key_type" "$key_data" > "$destination")
            ssh-keygen -F "$host" -f "$destination" >/dev/null
          }
          prepare_known_hosts "$RR_B_HOST" "$RR_B_HOST_KEY" "$b_known_hosts"
          prepare_known_hosts "$RR_C_HOST" "$RR_C_HOST_KEY" "$c_known_hosts"
          ssh_common=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
          )

          cleanup_b() {
            SSHPASS="$RR_B_PASS" sshpass -e ssh "${ssh_common[@]}" \
              -o UserKnownHostsFile="$b_known_hosts" "root@$RR_B_HOST" \
              bash -s -- "$panel_port" "$node_port" <<'REMOTE_CLEANUP'
          set -euo pipefail
          umask 077
          panel_port="$1"
          node_port="$2"
          failed=false
          rr_audit_unit_absent() {
            local unit="$1" load_state="" active_state="" unit_file_state=""
            load_state=$(systemctl show -p LoadState --value "$unit" \
              2>/dev/null) || return 1
            active_state=$(systemctl show -p ActiveState --value "$unit" \
              2>/dev/null) || return 1
            unit_file_state=$(systemctl show -p UnitFileState --value "$unit" \
              2>/dev/null) || return 1
            if [ "$load_state" = not-found ] && [ -z "$unit_file_state" ]; then
              unit_file_state=not-found
            fi
            [ "$load_state:$active_state:$unit_file_state" = \
              not-found:inactive:not-found ]
          }
          rr_audit_http_routes_absent() {
            local path=""
            for path in \
              /etc/nginx/sites-available/rr-nexus.conf \
              /etc/nginx/sites-available/rr-nexus.conf.port \
              /etc/nginx/sites-available/rr-nexus-ip.conf \
              /etc/nginx/sites-available/rr-nexus-ip-acme-http.conf \
              /etc/nginx/sites-enabled/rr-nexus.conf \
              /etc/nginx/sites-enabled/rr-nexus-port.conf \
              /etc/nginx/sites-enabled/rr-nexus-ip.conf \
              /etc/nginx/sites-enabled/rr-nexus-ip-acme-http.conf; do
              [ ! -e "$path" ] && [ ! -L "$path" ] || return 1
            done
          }
          nginx_generation_captured=false
          old_nginx_workers=()
          rr_audit_capture_nginx_generation() {
            local active_state="" master_pid="" worker_pid="" worker_start=""
            active_state=$(systemctl show -p ActiveState --value nginx.service \
              2>/dev/null) || return 1
            case "$active_state" in
              inactive) return 0 ;;
              active) ;;
              *) return 1 ;;
            esac
            command -v pgrep >/dev/null 2>&1 || return 1
            master_pid=$(systemctl show -p MainPID --value nginx.service \
              2>/dev/null) || return 1
            [[ "$master_pid" =~ ^[1-9][0-9]*$ ]] || return 1
            while IFS= read -r worker_pid; do
              [[ "$worker_pid" =~ ^[1-9][0-9]*$ ]] || return 1
              worker_start=$(awk '{print $22}' "/proc/${worker_pid}/stat" \
                2>/dev/null) || return 1
              [[ "$worker_start" =~ ^[1-9][0-9]*$ ]] || return 1
              old_nginx_workers+=("${worker_pid}:${worker_start}")
            done < <(pgrep -P "$master_pid" -x nginx)
            [ "${#old_nginx_workers[@]}" -ge 1 ] || return 1
            nginx_generation_captured=true
          }
          rr_audit_old_nginx_workers_retired() {
            local identity="" pid="" expected_start="" current_start=""
            for identity in "${old_nginx_workers[@]}"; do
              pid="${identity%%:*}"
              expected_start="${identity#*:}"
              if [ ! -e "/proc/${pid}" ]; then
                continue
              fi
              [ -r "/proc/${pid}/stat" ] || return 1
              current_start=$(awk '{print $22}' "/proc/${pid}/stat") || return 1
              [[ "$current_start" =~ ^[1-9][0-9]*$ ]] || return 1
