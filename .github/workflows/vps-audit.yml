                  if suffix in {".json", "-vl.json"}:
                      json.loads(private_bytes)
              if credential.encode() not in (private_root / f"{device_id}.txt").read_bytes():
                  raise RuntimeError("restored raw subscription omitted the credential")
          index = public_root / "index.html"
          if index.read_bytes() != b"":
              raise RuntimeError("restored public index is not empty")
          index_info = index.lstat()
          if not stat.S_ISREG(index_info.st_mode) or index_info.st_nlink != 1:
              raise RuntimeError("restored public index is not a single-link regular file")
          if (index_info.st_uid, index_info.st_gid, stat.S_IMODE(index_info.st_mode)) != (0, 0, 0o600):
              raise RuntimeError("restored public index metadata is unsafe")
          PY
          python3 - /var/lib/rr-nexus/nexus.db "$fingerprint_file" \
            "$restored_fingerprint" <<'PY'
          import hashlib
          import json
          import os
          import sqlite3
          import sys

          database, expected_file, output = sys.argv[1:]
          with open(expected_file, encoding="utf-8") as source:
              expected = json.load(source)
          if set(expected) != {"received_floor", "stable_sha256", "transmitted_floor"}:
              raise RuntimeError("source fingerprint metadata is malformed")
          connection = sqlite3.connect(f"file:{database}?mode=ro", uri=True, timeout=30)
          try:
              devices = connection.execute(
                  "SELECT id,name,credential,subscription_token,enabled,quota_bytes,"
                  "used_bytes,uploaded_bytes,downloaded_bytes,traffic_updated_at,"
                  "group_id,expires_at,created_at,updated_at,quota_reached_at,expiry_enforced_at,"
                  "next_reset_at,reset_anchor_day,reset_max,reset_count FROM devices ORDER BY id"
              ).fetchall()
              stable_policy = connection.execute(
                  "SELECT id,quota_bytes,count_mode,interface_name,initial_used_bytes,cycle_started_at "
                  "FROM server_traffic_policy WHERE id=1"
              ).fetchone()
              traffic = connection.execute(
                  "SELECT received_bytes,transmitted_bytes FROM server_traffic_policy WHERE id=1"
              ).fetchone()
          finally:
              connection.close()
          stable_payload = json.dumps(
              {"devices": devices, "server_traffic_policy": stable_policy},
              ensure_ascii=False, sort_keys=True, separators=(",", ":"),
          ).encode("utf-8")
          if hashlib.sha256(stable_payload).hexdigest() != expected["stable_sha256"]:
              raise RuntimeError("restored stable database fingerprint differs from source")
          if int(traffic[0]) < int(expected["received_floor"]):
              raise RuntimeError("restored received-byte counter regressed")
          if int(traffic[1]) < int(expected["transmitted_floor"]):
              raise RuntimeError("restored transmitted-byte counter regressed")
          descriptor = os.open(output, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as target:
              json.dump(expected, target, sort_keys=True, separators=(",", ":"))
              target.write("\n")
          PY
          test "$(stat -c '%U:%G:%a:%h' "$restored_fingerprint")" = root:root:600:1
          cmp -s "$fingerprint_file" "$restored_fingerprint"
          test "$(jq -r '.mode' /etc/rr-nexus/nexus.json)" = local
          test "$(jq -r '.listen' /etc/rr-nexus/nexus.json)" = 127.0.0.1
          test "$(jq -r '.port' /etc/rr-nexus/nexus.json)" = 7900
          test "$(jq -r '.public_port' /etc/rr-nexus/nexus.json)" = 17900
          jq -cS '{mode,domain,public_port} +
            (if has("acme_email") then {acme_email:.acme_email} else {} end)' \
            /etc/rr-nexus/nexus.json \
            | cmp -s /root/rr-audit-cross-target-access.json -
          grep -E '^(ENTRY_IP_MODE|OUTBOUND_IP_MODE|ENTRY_IPV4_ADDRESS|ENTRY_IPV6_ADDRESS|SUB_PORT|SUB_ACCESS_MODE|SUB_DOMAIN|SUB_PUBLIC_PORT_IPV4|SUB_PUBLIC_PORT_IPV6)=' \
            /etc/argo_vmess.conf | LC_ALL=C sort \
            | cmp -s /root/rr-audit-cross-target-network.txt -
          cmp -s /etc/rr-update/channel /root/rr-audit-cross-target-channel
          test "$(stat -c '%U:%G:%a:%h' /run/rr-vps-subscription.bind)" = root:root:600:1
          cmp -s /run/rr-vps-subscription.bind /root/rr-audit-cross-target-bind
          capture_rr_firewall_state /root/rr-audit-cross-restored-firewall
          cmp -s /root/rr-audit-cross-target-firewall \
            /root/rr-audit-cross-restored-firewall
          rm -f -- /root/rr-audit-cross-restored-firewall
          remove_rr_firewall_fixture
          firewall_fixture_active=false
          test ! -e /etc/nginx/sites-available/rr-nexus.conf
          for proxy in rr-nexus.conf rr-nexus-port.conf rr-nexus-ip.conf; do
            test ! -e "/etc/nginx/sites-enabled/$proxy"
          done
          assert_unit_state rr-nexus.service loaded:active:enabled
          assert_unit_state sing-box.service loaded:active:enabled
          curl -fsS --connect-timeout 5 --max-time 15 \
            http://127.0.0.1:7900/healthz >/dev/null
          local_listen=$(ss -H -ltn 'sport = :7900') || exit 1
          test "$(awk '{print $4}' <<<"$local_listen" | LC_ALL=C sort -u)" = \
            127.0.0.1:7900
          public_listen=$(ss -H -ltn 'sport = :17900') || exit 1
          test -z "$public_listen"
          IFS='|' read -r target_sub_port target_sub_bind target_sub_mode \
            target_sub_domain _ < /root/rr-audit-cross-target-bind
          [[ "$target_sub_port" =~ ^[0-9]+$ ]]
          test "$target_sub_bind" = 127.0.0.1
          test "$target_sub_mode" = local
          test -z "$target_sub_domain"
          subscription_listen=$(ss -H -ltn "sport = :${target_sub_port}") || exit 1
          test "$(awk '{print $4}' <<<"$subscription_listen" | LC_ALL=C sort -u)" = \
            "127.0.0.1:${target_sub_port}"

          sample_id=dev_a00000000001
          sample_token=RRAuditToken000000000001
          sample_credential=$(sqlite3 /var/lib/rr-nexus/nexus.db \
            "SELECT credential FROM devices WHERE id='$sample_id';")
          private_per_device=$(find /var/lib/rr-nexus/subscriptions -maxdepth 1 \
            -type f -name "${sample_id}*" -printf . | wc -c)
          public_per_device=$(find /tmp/sub_server/nexus -maxdepth 1 \
            -type f -name "${sample_token}*" -printf . | wc -c)
          test "$private_per_device" -gt 0
          test "$public_per_device" -gt 0
          test "$private_per_device" -eq 11
          test "$public_per_device" -eq 11
          test "$(find /var/lib/rr-nexus/subscriptions -maxdepth 1 \
            -type f -name 'dev_*' -printf . | wc -c)" \
            -eq "$((500 * private_per_device))"
          test "$(find /tmp/sub_server/nexus -maxdepth 1 \
            -type f ! -name index.html -printf . | wc -c)" \
            -eq "$((500 * public_per_device))"
          test -f /tmp/sub_server/nexus/index.html
          test ! -s /tmp/sub_server/nexus/index.html
          test "$(stat -c '%U:%G:%a' /var/lib/rr-nexus/subscriptions)" = root:root:700
          test "$(stat -c '%U:%G:%a' /tmp/sub_server/nexus)" = root:root:700
          unexpected_path=$(find /var/lib/rr-nexus/subscriptions \
            -mindepth 1 -maxdepth 1 -not -type f -print -quit) || exit 1
          test -z "$unexpected_path"
          unexpected_path=$(find /tmp/sub_server/nexus \
            -mindepth 1 -maxdepth 1 -not -type f -print -quit) || exit 1
          test -z "$unexpected_path"
          unexpected_path=$(find /var/lib/rr-nexus/subscriptions -maxdepth 1 \
            -type f -name 'dev_*' ! -perm 0600 -print -quit) || exit 1
          test -z "$unexpected_path"
          unexpected_path=$(find /tmp/sub_server/nexus -maxdepth 1 \
            -type f ! -perm 0600 -print -quit) || exit 1
          test -z "$unexpected_path"
          for suffix in .txt .json .yaml -vl.json -mihomo.yaml \
            -clash-verge.yaml -flclash.yaml -v2rayn.txt -v2rayng.txt \
            -sr.txt -nekobox.txt; do
            test -f "/var/lib/rr-nexus/subscriptions/${sample_id}${suffix}"
            test -f "/tmp/sub_server/nexus/${sample_token}${suffix}"
            cmp -s "/var/lib/rr-nexus/subscriptions/${sample_id}${suffix}" \
              "/tmp/sub_server/nexus/${sample_token}${suffix}"
          done
          grep -Fq "$sample_credential" \
            "/var/lib/rr-nexus/subscriptions/${sample_id}.txt"
          printf 'RR_AUDIT_CROSS_MIGRATION_COMPLETE devices=500 access=local hashes=verified\n'
          REMOTE_C

  vps-gate:
    name: Three-VPS release gate
    if: always()
    needs: [debian-full, ubuntu-upgrade, ubuntu-transaction, cross-machine-migration-scale]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require main and all three independent jobs
        env:
          A_RESULT: ${{ needs.debian-full.result }}
          B_RESULT: ${{ needs.ubuntu-upgrade.result }}
          C_RESULT: ${{ needs.ubuntu-transaction.result }}
          M_RESULT: ${{ needs.cross-machine-migration-scale.result }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$A_RESULT" = success
          test "$B_RESULT" = success
          test "$C_RESULT" = success
          test "$M_RESULT" = success
          echo 'Three-VPS release gate passed with pinned SSH host keys, encrypted A-to-C migration, and real 1/10/100/500-device synchronization; this is not a real client traffic claim.'
