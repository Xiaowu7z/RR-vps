          test "$(stat -c %a /etc/argo_vmess.conf)" = 600
          test "$(stat -c %a /var/lib/rr-nexus/nexus.db)" = 600
          printf 'RR_AUDIT_UPGRADE_COMPLETE role=B os=%s version=%s old=7.1.0 new=%s rollback=ok device_config=preserved\n' \
            "$ID" "$VERSION_ID" "$expected_version"
          REMOTE
          curl -kfsS --connect-timeout 5 --max-time 20 \
            "https://${host}:10443/healthz" >/dev/null

  ubuntu-transaction:
    name: C · Ubuntu 24.04 · clean transaction, recovery, and local tunnel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify candidate and prepare SSH client
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Clean host and install local Nexus
        shell: bash
        env:
          RR_C_HOST: ${{ secrets.RR_C_HOST }}
          RR_C_PASS: ${{ secrets.RR_C_PASS }}
        run: |
          set -euo pipefail
          set +x
          export SSHPASS="$RR_C_PASS"
          host="$RR_C_HOST"
          expected_version=$(sed -n '1s/^RR-vps //p' version)
          [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bundle_sha=$(sha256sum rr-bundle.tar.gz | awk '{print $1}')
          core_sha=$(sha256sum scripts/install-core.sh | awk '{print $1}')
          guard_sha=$(sha256sum scripts/update-guard.sh | awk '{print $1}')
