            test "$(firewall_rule_count "$backend" filter INPUT tcp 65433 \
              rr-audit-user-sentinel ACCEPT)" -eq 1
            test "$(firewall_rule_count "$backend" nat PREROUTING udp 65434 \
              rr-audit-user-sentinel REDIRECT 65433)" -eq 1
            verified_backend_count=$((verified_backend_count + 1))
          done
          test "$verified_backend_count" -eq 2
          capture_full_firewall_state \
            /run/rr-audit-cross-firewall-before-validate
          bash -c '
            set -euo pipefail
            for module_file in /usr/local/lib/rr/modules/*.sh; do
