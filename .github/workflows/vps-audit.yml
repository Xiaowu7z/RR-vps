                set -euo pipefail
                umask 077
                export PATH=/usr/sbin:/usr/bin:/sbin:/bin
                firewall_lock_fd=""
                lock_directory_is_safe() {
                  local directory="$1" mode=""
                  [ -d "$directory" ] && [ ! -L "$directory" ] || return 1
                  [ "$(stat -c '%u:%g' -- "$directory" 2>/dev/null)" = 0:0 ] || return 1
                  mode=$(stat -c '%a' -- "$directory" 2>/dev/null) || return 1
                  [[ "$mode" =~ ^[0-7]{3,4}$ ]] || return 1
                  (( (8#$mode & 8#022) == 0 ))
                }
                lock_file_is_safe() {
                  [ -f /run/rr-vps/locks/firewall.lock ] && \
                    [ ! -L /run/rr-vps/locks/firewall.lock ] || return 1
                  [ "$(stat -c '%u:%g:%a:%h:%s' -- \
                    /run/rr-vps/locks/firewall.lock 2>/dev/null)" = 0:0:600:1:0 ]
                }
                acquire_firewall_lock() {
                  local directory="" path_identity="" descriptor_identity=""
                  [ "${EUID:-$(id -u)}" -eq 0 ] || return 1
                  command -v flock >/dev/null 2>&1 || return 1
                  lock_directory_is_safe /run || return 1
                  for directory in /run/rr-vps /run/rr-vps/locks; do
                    if [ ! -e "$directory" ] && [ ! -L "$directory" ]; then
                      mkdir -m 700 -- "$directory" || return 1
                      chown 0:0 -- "$directory" || return 1
                      chmod 700 -- "$directory" || return 1
                    fi
                    lock_directory_is_safe "$directory" || return 1
