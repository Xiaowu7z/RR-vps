            done
            install_deps </dev/null
          ' >/root/rr-audit-deps.log 2>&1
          printf '%s\n' 0 '' '' '' | bash -c '
            set -o pipefail
            for module_file in /usr/local/lib/rr/modules/*.sh; do
              # shellcheck disable=SC1090
              source "$module_file"
            done
            install_deps() { return 0; }
            install_main
          ' >/root/rr-audit-framework.log 2>&1
          grep -qx INSTALL_COMPLETE=true /etc/argo_vmess.conf

          for tcp_port in 7900 17900; do
            if ! port_state=$(ss -H -ltn "sport = :${tcp_port}"); then
              echo "C audit could not inspect TCP port ${tcp_port}." >&2
