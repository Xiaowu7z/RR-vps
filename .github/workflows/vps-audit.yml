              break
            fi
            kill -0 "$tunnel_pid" 2>/dev/null || break
            sleep 1
          done
          [ "$tunnel_ok" = true ] || {
            echo 'C real runner SSH tunnel health check failed.' >&2
            exit 1
          }
          cleanup_tunnel
          tunnel_pid=

          if ! sshpass -e ssh "${ssh_opts[@]}" "root@$host" bash -s -- \
            "$expected_version" <<'REMOTE'
          set -euo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb
          expected_version="$1"
          stage=/root/rr-audit-candidate
          audit_exit() {
            rc=$?
            trap - EXIT
            find /root -maxdepth 1 -type f -name 'rr-audit-*.log' \
              -exec chmod 600 {} + 2>/dev/null || true
            exit "$rc"
          }
          trap audit_exit EXIT
          install_candidate() {
            RR_BUNDLE_FILE="$stage/rr-bundle.tar.gz" \
            RR_GUARD_FILE="$stage/update-guard.sh" \
              bash "$stage/install-core.sh" --upgrade
          }
          assert_candidate() {
            /usr/local/bin/rr --version | grep -F "RR-vps ${expected_version}" >/dev/null
            test -x /usr/local/sbin/rr-update-recover
            test -x /usr/local/sbin/rr-update-external-state
            (
              cd /usr/local/lib/rr
              expected_rr=$(awk '$2 == "rr" {print $1}' manifest.sha256)
              test "$(sha256sum /usr/local/bin/rr | awk '{print $1}')" = "$expected_rr"
              awk '$2 != "rr"' manifest.sha256 | sha256sum -c - >/dev/null
            )
          }
          assert_local_nexus() {
            assert_candidate
            test "$(jq -r '.mode' /etc/rr-nexus/nexus.json)" = local
            test "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA quick_check;')" = ok
            test -z "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA foreign_key_check;')"
            systemctl is-active --quiet rr-nexus
            systemctl is-enabled --quiet rr-nexus
            curl -fsS --connect-timeout 5 --max-time 15 \
              http://127.0.0.1:7900/healthz >/dev/null
            bash -c '
              set -e
              for module_file in /usr/local/lib/rr/modules/*.sh; do
                # shellcheck disable=SC1090
                source "$module_file"
              done
              subscription_server_running
            ' >/dev/null
          }
          crash_at() {
            crash_phase="$1"
            crash_log="$2"
            set +e
            (
              RR_TEST_FAULTS=1 RR_TEST_CRASH_PHASE="$crash_phase" \
              RR_BUNDLE_FILE="$stage/rr-bundle.tar.gz" \
              RR_GUARD_FILE="$stage/update-guard.sh" \
                exec bash "$stage/install-core.sh" --upgrade
            ) >>"$crash_log" 2>&1
            crash_rc=$?
            set -e
            test "$crash_rc" -eq 137
          }
          active_transaction() {
            active_file=/var/lib/rr-update/active
            test -f "$active_file"
            test ! -L "$active_file"
            test "$(stat -c '%U:%G:%a:%h' "$active_file")" = root:root:600:1
            mapfile -t active_lines < "$active_file"
            test "${#active_lines[@]}" -eq 1
            candidate_tx="${active_lines[0]}"
            case "$candidate_tx" in
              /var/lib/rr-update/transactions/*) ;;
              *) return 1 ;;
            esac
            tx_name="${candidate_tx##*/}"
            [[ "$tx_name" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+$ ]]
            test -d "$candidate_tx"
            test ! -L "$candidate_tx"
            test "$(readlink -f "$candidate_tx")" = "$candidate_tx"
            test "$(stat -c '%U:%G:%a' "$candidate_tx")" = root:root:700
            for metadata_file in transaction-format phase; do
              test -f "$candidate_tx/$metadata_file"
              test ! -L "$candidate_tx/$metadata_file"
              test "$(stat -c '%U:%G:%a:%h' "$candidate_tx/$metadata_file")" = \
                root:root:600:1
            done
            test "$(cat "$candidate_tx/transaction-format")" = 2
            systemctl is-enabled --quiet rr-update-recovery.service
            maintenance_file=/run/rr-vps/update-maintenance
            test -f "$maintenance_file"
            test ! -L "$maintenance_file"
            test "$(stat -c '%U:%G:%a:%h' "$maintenance_file")" = root:root:600:1
            test "$(cat "$maintenance_file")" = "$candidate_tx"
            printf '%s\n' "$candidate_tx"
          }

          assert_local_nexus
          runtime_marker=$(openssl rand -hex 24)
          printf '%s\n' "$runtime_marker" > /usr/local/lib/rr/.rr-audit-runtime-instance
          chmod 600 /usr/local/lib/rr/.rr-audit-runtime-instance
          crash_at old_runtime_moved /root/rr-audit-crash-old-runtime.log
          active_tx=$(active_transaction)
          test "$(cat "$active_tx/phase")" = switching
          test -e /run/rr-vps/update-maintenance
          ! systemctl is-active --quiet rr-nexus
          /usr/local/sbin/rr-update-recover recover \
            >>/root/rr-audit-crash-old-runtime.log 2>&1
          test ! -e /var/lib/rr-update/active
          test ! -e /run/rr-vps/update-maintenance
          test "$(cat "$active_tx/phase")" = rolled_back
          /usr/local/sbin/rr-update-external-state verify "$active_tx/backup" \
            --tx-root /var/lib/rr-update \
            >>/root/rr-audit-crash-old-runtime.log 2>&1
          assert_local_nexus
          test "$(cat /usr/local/lib/rr/.rr-audit-runtime-instance)" = "$runtime_marker"
          rm -f /usr/local/lib/rr/.rr-audit-runtime-instance
          unset runtime_marker

          install_candidate >/root/rr-audit-between-crashes.log 2>&1
          assert_local_nexus
          runtime_marker=$(openssl rand -hex 24)
          printf '%s\n' "$runtime_marker" > /usr/local/lib/rr/.rr-audit-runtime-instance
          chmod 600 /usr/local/lib/rr/.rr-audit-runtime-instance
          crash_at runtime_swapped /root/rr-audit-crash-runtime-swapped.log
          active_tx=$(active_transaction)
          test "$(cat "$active_tx/phase")" = runtime_swapped
          test -e /run/rr-vps/update-maintenance
          ! systemctl is-active --quiet rr-nexus
          systemctl start rr-update-recovery.service \
            >>/root/rr-audit-crash-runtime-swapped.log 2>&1
          test "$(systemctl show rr-update-recovery.service -p Result --value)" = success
          test ! -e /var/lib/rr-update/active
          test ! -e /run/rr-vps/update-maintenance
          test "$(cat "$active_tx/phase")" = rolled_back
          /usr/local/sbin/rr-update-external-state verify "$active_tx/backup" \
            --tx-root /var/lib/rr-update \
            >>/root/rr-audit-crash-runtime-swapped.log 2>&1
          assert_local_nexus
          test "$(cat /usr/local/lib/rr/.rr-audit-runtime-instance)" = "$runtime_marker"
          rm -f /usr/local/lib/rr/.rr-audit-runtime-instance
          unset runtime_marker
          install_candidate >>/root/rr-audit-between-crashes.log 2>&1
          assert_local_nexus
          printf 'RR_AUDIT_C_TRANSACTION_COMPLETE sigkill=2 recover=2 tunnel=runner\n'
          REMOTE
          then
            echo 'C SIGKILL/recovery gate failed; root-only 0600 logs retained on VPS.' >&2
            exit 1
          fi

  vps-gate:
    name: Three-VPS component gate
    if: always()
    needs: [debian-full, ubuntu-upgrade, ubuntu-transaction]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require main and all three independent jobs
        env:
          A_RESULT: ${{ needs.debian-full.result }}
          B_RESULT: ${{ needs.ubuntu-upgrade.result }}
          C_RESULT: ${{ needs.ubuntu-transaction.result }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$A_RESULT" = success
          test "$B_RESULT" = success
          test "$C_RESULT" = success
          echo 'Three-VPS component gate passed with TOFU SSH; this is not a trusted release or real client traffic claim.'
