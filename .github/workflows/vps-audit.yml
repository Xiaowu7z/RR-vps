            }
            mapfile -t marker_lines < "$marker" || { printf '%s\n' marker-read; return 0; }
            [ "${#marker_lines[@]}" -eq 1 ] || { printf '%s\n' marker-lines; return 0; }
            [[ "${marker_lines[0]}" =~ ^/var/lib/rr-update/transactions/[0-9]{8}T[0-9]{6}Z-[1-9][0-9]*$ ]] || {
              printf '%s\n' marker-format
