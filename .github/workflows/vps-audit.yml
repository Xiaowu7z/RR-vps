# Destructive checks run only on owner-authorized disposable audit hosts. Each
# password is released only after the server's independently copied Ed25519
# host key has been pinned, so this workflow can serve as a release gate.
name: VPS release audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-release-audit
  cancel-in-progress: false

jobs:
  debian-full:
    name: A · Debian 12 · all protocol services and public HTTPS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare SSH client
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass netcat-openbsd
      - name: Install all protocols and domain panel
        shell: bash
        env:
          RR_A_HOST: ${{ secrets.RR_A_HOST }}
          RR_A_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm
          RR_A_PASS: ${{ secrets.RR_A_PASS }}
          RR_A_NAIVE_DOMAIN: ${{ secrets.RR_A_NAIVE_DOMAIN }}
        run: |
          set -euo pipefail
          set +x
          export SSHPASS="$RR_A_PASS"
          host="$RR_A_HOST"
          [[ "$RR_A_HOST_KEY" != *$'\n'* ]]
          read -r host_key_type host_key_data host_key_extra <<<"$RR_A_HOST_KEY"
          [ "$host_key_type" = ssh-ed25519 ]
          [[ "$host_key_data" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          [ -z "$host_key_extra" ]
          bundle_sha=$(sha256sum rr-bundle.tar.gz | awk '{print $1}')
          core_sha=$(sha256sum scripts/install-core.sh | awk '{print $1}')
          guard_sha=$(sha256sum scripts/update-guard.sh | awk '{print $1}')
          known_hosts="$RUNNER_TEMP/known-hosts-A"
          (umask 077; printf '%s %s %s\n' "$host" "$host_key_type" "$host_key_data" > "$known_hosts")
          ssh-keygen -F "$host" -f "$known_hosts" >/dev/null
          ssh_opts=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes
            -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts"
          )
          sshpass -e ssh "${ssh_opts[@]}" "root@$host" \
            'install -d -m 700 /root/rr-audit-candidate'
          sshpass -e scp "${ssh_opts[@]}" -q \
            rr-bundle.tar.gz scripts/install-core.sh scripts/update-guard.sh \
            "root@$host:/root/rr-audit-candidate/"
          sshpass -e ssh "${ssh_opts[@]}" "root@$host" bash -s -- \
            "$RR_A_HOST" "$RR_A_NAIVE_DOMAIN" \
            "$(sed -n '1s/^RR-vps //p' version)" \
            "$bundle_sha" "$core_sha" "$guard_sha" <<'REMOTE'
          set -euo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb
          panel_domain="$1"
          naive_domain="$2"
          expected_version="$3"
          expected_bundle_sha="$4"
          expected_core_sha="$5"
          expected_guard_sha="$6"
          find /root -maxdepth 1 -type f -name 'rr-audit-*.log' -delete
          rm -f -- /root/rr-audit-stage
          audit_exit() {
            rc=$?
            trap - EXIT
            find /root -maxdepth 1 -type f -name 'rr-audit-*.log' \
              -exec chmod 600 {} + 2>/dev/null || true
            exit "$rc"
          }
          trap audit_exit EXIT
          assert_unit_state() {
            local unit="$1" expected="$2" load_state="" active_state="" unit_file_state=""
            load_state=$(systemctl show -p LoadState --value "$unit" 2>/dev/null) || return 1
            active_state=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null) || return 1
            unit_file_state=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null) || return 1
            if [ "$load_state" = not-found ] && [ -z "$unit_file_state" ]; then
              unit_file_state=not-found
            fi
            test "$load_state:$active_state:$unit_file_state" = "$expected"
          }
          test "$(id -u)" -eq 0
          # shellcheck disable=SC1091
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 12
          test "$(uname -m)" = x86_64
          test "$(ps -p 1 -o comm= | tr -d '[:space:]')" = systemd
          ssh_control_port=$(awk '{print $4}' <<<"${SSH_CONNECTION:-}")
          [[ "$ssh_control_port" =~ ^[0-9]+$ ]]
          test "$ssh_control_port" -ge 1
          test "$ssh_control_port" -le 65535
          if [ -x /usr/local/bin/rr ] && [ -d /usr/local/lib/rr/modules ]; then
            if ! bash -c '
                set -o pipefail
                for module_file in /usr/local/lib/rr/modules/*.sh; do
                  # shellcheck disable=SC1090
                  source "$module_file"
                done
                if declare -F rr_run_with_update_locks >/dev/null 2>&1 &&
                   declare -F uninstall_all_locked >/dev/null 2>&1; then
                  rr_audit_waited_uninstall() {
                    local deadline=$((SECONDS + 180)) remaining=0 result=0
                    while :; do
                      remaining=$((deadline - SECONDS))
                      [ "$remaining" -ge 1 ] || return 75
                      if rr_run_with_update_locks direct "$remaining" \
                          uninstall_all_locked; then
                        return 0
                      else
                        result=$?
                      fi
                      [ "$result" = 75 ] || return "$result"
                      sleep 1
                    done
                  }
                  rr_audit_waited_uninstall
                else
                  printf "%s\n" y | uninstall_all
                fi
              ' >/root/rr-audit-preclean.log 2>&1; then
              echo 'A pre-clean failed; root-only log retained on VPS.' >&2
              exit 1
            fi
          fi
          stage=/root/rr-audit-candidate
          chmod 700 "$stage"
          chmod 600 "$stage"/*
          printf '%s  %s\n' \
            "$expected_bundle_sha" "$stage/rr-bundle.tar.gz" \
            "$expected_core_sha" "$stage/install-core.sh" \
            "$expected_guard_sha" "$stage/update-guard.sh" \
            | sha256sum -c - >/root/rr-audit-transfer-sha.log 2>&1
          cleanup_runtime=$(mktemp -d /root/rr-audit-cleanup.XXXXXX)
          chmod 700 "$cleanup_runtime"
          tar --no-same-owner --no-same-permissions -xzf \
            "$stage/rr-bundle.tar.gz" -C "$cleanup_runtime" --strip-components=1
          for module_file in "$cleanup_runtime"/modules/*.sh; do
            # shellcheck disable=SC1090
            source "$module_file"
          done
          if [ -e /usr/local/bin/rr ] || [ -e /usr/local/lib/rr ] || \
             [ -e /etc/argo_vmess.conf ]; then
            if ! CLEANUP_RUNTIME="$cleanup_runtime" bash -c '
                set -o pipefail
                for module_file in "$CLEANUP_RUNTIME"/modules/*.sh; do
                  # shellcheck disable=SC1090
                  source "$module_file"
                done
                rr_audit_waited_uninstall() {
                  local deadline=$((SECONDS + 180)) remaining=0 result=0
                  while :; do
                    remaining=$((deadline - SECONDS))
                    [ "$remaining" -ge 1 ] || return 75
                    if rr_run_with_update_locks direct "$remaining" \
                        uninstall_all_locked; then
                      return 0
                    else
                      result=$?
                    fi
                    [ "$result" = 75 ] || return "$result"
                    sleep 1
                  done
                }
                rr_audit_waited_uninstall
              ' >>/root/rr-audit-preclean.log 2>&1; then
              echo 'A candidate pre-clean failed; root-only log retained on VPS.' >&2
              exit 1
            fi
          fi
          stop_subscription_servers >/root/rr-audit-orphan-cleanup.log 2>&1 || true
          rm -rf -- "$cleanup_runtime"
          test ! -e /usr/local/bin/rr
          test ! -e /usr/local/lib/rr
          test ! -e /etc/argo_vmess.conf
          RR_BUNDLE_FILE="$stage/rr-bundle.tar.gz" \
          RR_GUARD_FILE="$stage/update-guard.sh" \
            bash "$stage/install-core.sh" --upgrade >/root/rr-audit-core.log 2>&1

          # Real UFW regression: preserve an unrelated profile, explicitly
          # protect this session's actual SSH server port, then enable UFW
          # before installation so every RR rule is exercised through UFW.
          DEBIAN_FRONTEND=noninteractive apt-get install -y ufw \
            >/root/rr-audit-ufw-prepare.log 2>&1
          # These are owner-authorized destructive audit hosts.  Normalize a
          # dirty state where ufw.conf says enabled but the live user chains
          # are missing before proving the candidate's firewall behavior.
          ufw --force reset >/root/rr-audit-ufw-enable.log 2>&1
          LC_ALL=C ufw status | grep -qx 'Status: inactive'
          ufw_marker=/etc/ufw/applications.d/rr-audit-marker
          printf '%s\n' \
            '[RR-Audit-Marker]' \
            'title=RR audit preservation marker' \
            'description=Disposable audit profile' \
            'ports=61234/tcp' > "$ufw_marker"
          chmod 600 "$ufw_marker"
          ufw_marker_sha=$(sha256sum "$ufw_marker" | awk '{print $1}')
          ufw allow "$ssh_control_port/tcp" \
            comment 'rr-audit-ssh-control' >>/root/rr-audit-ufw-enable.log 2>&1
          LC_ALL=C ufw show added | \
            grep -Fqx "ufw allow ${ssh_control_port}/tcp comment 'rr-audit-ssh-control'"
          ufw --force enable >>/root/rr-audit-ufw-enable.log 2>&1
          LC_ALL=C ufw status | grep -qx 'Status: active'
          rr_ufw_rule_state "$ssh_control_port" tcp ALLOW 'rr-audit-ssh-control'
          bash -c '
              set -eo pipefail
              for module_file in /usr/local/lib/rr/modules/*.sh; do
                # shellcheck disable=SC1090
                source "$module_file"
              done
              install_deps </dev/null
            ' >/root/rr-audit-deps.log 2>&1
          dpkg-query -W -f='${db:Status-Status}\n' ufw | grep -qx installed
          test "$ufw_marker_sha" = "$(sha256sum "$ufw_marker" | awk '{print $1}')"
          ufw app info RR-Audit-Marker >/dev/null

          for tcp_port in 8443 24443 18080 21443 22443 28443; do
            if ! port_state=$(ss -H -ltn "sport = :${tcp_port}"); then
              echo "A audit could not inspect TCP port ${tcp_port}." >&2
              exit 1
            fi
            if grep -q . <<<"$port_state"; then
              echo "A audit TCP port ${tcp_port} is unexpectedly occupied." >&2
              exit 1
            fi
          done
          for udp_port in 23443 25443 28443; do
            if ! port_state=$(ss -H -lun "sport = :${udp_port}"); then
              echo "A audit could not inspect UDP port ${udp_port}." >&2
              exit 1
            fi
            if grep -q . <<<"$port_state"; then
              echo "A audit UDP port ${udp_port} is unexpectedly occupied." >&2
              exit 1
            fi
          done

          install_log=/root/rr-audit-install.log
          : > "$install_log"
          chmod 600 "$install_log"
          if ! printf '%s\n' \
            7 1 24443 18080 21443 22443 3 28443 "$naive_domain" \
            23443 25443 y 30000:30010 30s '' '' \
            | bash -c '
                set -o pipefail
                for module_file in /usr/local/lib/rr/modules/*.sh; do
                  # shellcheck disable=SC1090
                  source "$module_file"
                done
                install_deps() { return 0; }
                install_main
              ' >>"$install_log" 2>&1; then
            echo 'A full protocol install failed; root-only log retained on VPS.' >&2
            exit 1
          fi

          panel_pass=$(openssl rand -hex 20)
          test "${#panel_pass}" -ge 12
          (umask 077; printf '%s\n' "$panel_pass" > /root/rr-audit-panel-pass)
          panel_log=/root/rr-audit-nexus.log
          : > "$panel_log"
          chmod 600 "$panel_log"
          if ! printf '%s\n' 2 8443 "$panel_domain" "admin@$panel_domain" \
            auditadmin "$panel_pass" "$panel_pass" '' \
            | bash -c '
                set -o pipefail
                for module_file in /usr/local/lib/rr/modules/*.sh; do
                  # shellcheck disable=SC1090
                  source "$module_file"
                done
                nexus_install
              ' >>"$panel_log" 2>&1; then
            echo 'A Nexus domain install failed; root-only log retained on VPS.' >&2
            exit 1
          fi
          unset panel_pass

          /usr/local/bin/rr --version | grep -F "RR-vps ${expected_version}" >/dev/null
          expected_rr=$(awk '$2 == "rr" {print $1}' /usr/local/lib/rr/manifest.sha256)
          test "$(sha256sum /usr/local/bin/rr | awk '{print $1}')" = "$expected_rr"
          (
            cd /usr/local/lib/rr
            awk '$2 != "rr"' manifest.sha256 | sha256sum -c - >/dev/null
          )
          test "$(grep -c '^INSTALL_COMPLETE=true$' /etc/argo_vmess.conf)" -eq 1
          grep -qx 'SUB_ACCESS_MODE=https' /etc/argo_vmess.conf
          grep -Fqx "SUB_DOMAIN=${naive_domain}" /etc/argo_vmess.conf
          test "$(stat -c %a /etc/argo_vmess.conf)" = 600
          test "$(stat -c %a /etc/sing-box/config.json)" = 600
          test "$(stat -c %a /var/lib/rr-nexus/nexus.db)" = 600
          test "$(stat -c %a /etc/rr-nexus/nexus.json)" = 600
          test "$(stat -c %a /root/rr-audit-panel-pass)" = 600
          test "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA quick_check;')" = ok
          foreign_key_errors=$(sqlite3 /var/lib/rr-nexus/nexus.db \
            'PRAGMA foreign_key_check;') || exit 1
          test -z "$foreign_key_errors"
          test "$(jq -r '.mode' /etc/rr-nexus/nexus.json)" = public
          test "$(jq -r '.listen' /etc/rr-nexus/nexus.json)" = 127.0.0.1
          test "$(jq -r '.port' /etc/rr-nexus/nexus.json)" = 7900
          test "$(jq -r '.public_port' /etc/rr-nexus/nexus.json)" = 8443
          assert_unit_state sing-box.service loaded:active:enabled
          assert_unit_state rr-nexus.service loaded:active:enabled
          assert_unit_state nginx.service loaded:active:enabled
          /usr/local/bin/sing-box check -c /etc/sing-box/config.json
          for inbound_tag in vmess-in vless-in hy2-in tuic5-in anytls-in naive-in; do
            jq -e --arg wanted "$inbound_tag" \
              'any(.inbounds[]; .tag == $wanted)' /etc/sing-box/config.json >/dev/null
          done
          curl -fsS --connect-timeout 5 --max-time 15 http://127.0.0.1:7900/healthz >/dev/null
          curl -fsS --resolve "${panel_domain}:8443:127.0.0.1" \
            --connect-timeout 5 --max-time 20 "https://${panel_domain}:8443/healthz" >/dev/null
          test -s "/etc/letsencrypt/live/${panel_domain}/fullchain.pem"
          test -s "/etc/letsencrypt/live/${naive_domain}/fullchain.pem"
          test -s /etc/rr-naive/fullchain.pem
          test "$panel_domain" != "$naive_domain"
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt \
            -untrusted "/etc/letsencrypt/live/${panel_domain}/chain.pem" \
            "/etc/letsencrypt/live/${panel_domain}/cert.pem" >/dev/null
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt \
            -untrusted "/etc/letsencrypt/live/${naive_domain}/chain.pem" \
            "/etc/letsencrypt/live/${naive_domain}/cert.pem" >/dev/null
          declare -F certificate_identity_matches >/dev/null
          certificate_identity_matches \
            "/etc/letsencrypt/live/${panel_domain}/fullchain.pem" "$panel_domain"
          certificate_identity_matches \
            "/etc/letsencrypt/live/${naive_domain}/fullchain.pem" "$naive_domain"
          if certificate_identity_matches \
            "/etc/letsencrypt/live/${panel_domain}/fullchain.pem" "$naive_domain"; then
            echo 'A panel certificate unexpectedly matches the Naive domain.' >&2
            exit 1
          fi
          if certificate_identity_matches \
            "/etc/letsencrypt/live/${naive_domain}/fullchain.pem" "$panel_domain"; then
            echo 'A Naive certificate unexpectedly matches the panel domain.' >&2
            exit 1
          fi
          test "$(sha256sum "/etc/letsencrypt/live/${panel_domain}/fullchain.pem" | awk '{print $1}')" != \
            "$(sha256sum "/etc/letsencrypt/live/${naive_domain}/fullchain.pem" | awk '{print $1}')"
          ss -H -lnt | awk '{print $4}' | grep -Eq '(:|\])24443$'
          ss -H -lnt | awk '{print $4}' | grep -Eq '(:|\])21443$'
          ss -H -lnt | awk '{print $4}' | grep -Eq '(:|\])22443$'
          ss -H -lnt | awk '{print $4}' | grep -Eq '(:|\])28443$'
          IFS='|' read -r sub_state_port sub_state_bind sub_state_mode \
            sub_state_domain _ < /run/rr-vps-subscription.bind
          test "$sub_state_port" = 18080
          case "$sub_state_bind" in 0.0.0.0|::) ;; *) exit 1 ;; esac
          test "$sub_state_mode" = https
          test "$sub_state_domain" = "$naive_domain"
          ss -H -lnt 'sport = :18080' | awk '{print $4}' \
            | grep -Eq '^(0\.0\.0\.0|\[::\]|\*):18080$'
          ss -H -lnu | awk '{print $4}' | grep -Eq '(:|\])23443$'
          ss -H -lnu | awk '{print $4}' | grep -Eq '(:|\])25443$'
          ss -H -lnu | awk '{print $4}' | grep -Eq '(:|\])28443$'
          test -d /tmp/sub_server
          test "$(stat -c %a /tmp/sub_server)" = 700
          test ! -L /tmp/sub_server
          test -s /run/rr-vps-subscription.pid
          test -s /run/rr-vps-subscription.bind
          bash -c '
            set -e
            for module_file in /usr/local/lib/rr/modules/*.sh; do
              # shellcheck disable=SC1090
              source "$module_file"
            done
            for spec in 24443/tcp 18080/tcp 21443/tcp 22443/tcp \
              28443/tcp 28443/udp 23443/udp 25443/udp 8443/tcp; do
              rr_ufw_rule_state "${spec%/*}" "${spec#*/}" ALLOW \
                argo-rr-managed
            done
          ' >/dev/null
          if ! nexus_journal=$(journalctl -u rr-nexus --no-pager 2>/dev/null); then
            echo 'A could not inspect the RR Nexus journal.' >&2
            exit 1
          fi
          if grep -Eq '/api/subscription/|/sub/' <<<"$nexus_journal"; then
            echo 'A Nexus journal exposed a subscription URL path.' >&2
            exit 1
          fi
          printf 'RR_AUDIT_FULL_COMPLETE role=A os=%s version=%s protocol_services=all client_traffic=not_run panel=domain\n' \
            "$ID" "$VERSION_ID"
          REMOTE
          curl -fsS --connect-timeout 5 --max-time 20 \
            "https://${host}:8443/healthz" >/dev/null
          for tcp_port in 24443 21443 22443 28443; do
            nc -z -w 8 "$host" "$tcp_port" >/dev/null 2>&1
          done
          printf '' | openssl s_client -connect "${host}:28443" \
            -servername "$RR_A_NAIVE_DOMAIN" \
            -verify_hostname "$RR_A_NAIVE_DOMAIN" -verify_return_error -alpn h2 \
            >/dev/null 2>&1
          printf '' | openssl s_client -connect "${host}:18080" \
            -servername "$RR_A_NAIVE_DOMAIN" \
            -verify_hostname "$RR_A_NAIVE_DOMAIN" -verify_return_error \
            >/dev/null 2>&1

  ubuntu-upgrade:
    name: B · Ubuntu 22.04 · v7.1.0 data upgrade and rollback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare SSH client
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass netcat-openbsd
      - name: Build old state, update, rollback, update again
        shell: bash
        env:
          RR_B_HOST: ${{ secrets.RR_B_HOST }}
          RR_B_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A
          RR_B_PASS: ${{ secrets.RR_B_PASS }}
        run: |
          set -euo pipefail
          set +x
          export SSHPASS="$RR_B_PASS"
          host="$RR_B_HOST"
          [[ "$RR_B_HOST_KEY" != *$'\n'* ]]
          read -r host_key_type host_key_data host_key_extra <<<"$RR_B_HOST_KEY"
          [ "$host_key_type" = ssh-ed25519 ]
          [[ "$host_key_data" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          [ -z "$host_key_extra" ]
          bundle_sha=$(sha256sum rr-bundle.tar.gz | awk '{print $1}')
          core_sha=$(sha256sum scripts/install-core.sh | awk '{print $1}')
          guard_sha=$(sha256sum scripts/update-guard.sh | awk '{print $1}')
          known_hosts="$RUNNER_TEMP/known-hosts-B"
          (umask 077; printf '%s %s %s\n' "$host" "$host_key_type" "$host_key_data" > "$known_hosts")
          ssh-keygen -F "$host" -f "$known_hosts" >/dev/null
          ssh_opts=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes
            -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts"
          )
          sshpass -e ssh "${ssh_opts[@]}" "root@$host" \
            'install -d -m 700 /root/rr-audit-candidate /root/rr-audit-old'
          sshpass -e scp "${ssh_opts[@]}" -q \
            rr-bundle.tar.gz scripts/install-core.sh scripts/update-guard.sh \
            "root@$host:/root/rr-audit-candidate/"
          sshpass -e ssh "${ssh_opts[@]}" "root@$host" bash -s -- \
            "$(sed -n '1s/^RR-vps //p' version)" \
            "$bundle_sha" "$core_sha" "$guard_sha" <<'REMOTE'
          set -euo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb
          expected_version="$1"
          expected_bundle_sha="$2"
          expected_core_sha="$3"
          expected_guard_sha="$4"
          audit_exit() {
            rc=$?
            trap - EXIT
            find /root -maxdepth 1 -type f -name 'rr-audit-*.log' \
              -exec chmod 600 {} + 2>/dev/null || true
            exit "$rc"
          }
          trap audit_exit EXIT
          assert_unit_state() {
            local unit="$1" expected="$2" load_state="" active_state="" unit_file_state=""
            load_state=$(systemctl show -p LoadState --value "$unit" 2>/dev/null) || return 1
            active_state=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null) || return 1
            unit_file_state=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null) || return 1
            if [ "$load_state" = not-found ] && [ -z "$unit_file_state" ]; then
              unit_file_state=not-found
            fi
            test "$load_state:$active_state:$unit_file_state" = "$expected"
          }
          quarantine_fully_absent() {
            local artifact="" backend="" rules=""
            for artifact in \
              /var/lib/rr-update/subscription-quarantine \
              /run/rr-subscription-quarantine.ready \
              /etc/systemd/system/rr-subscription-quarantine.service \
