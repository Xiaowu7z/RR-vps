                if ($1 !~ /^[a-f0-9]{64}$/ || $2 != timer || NF != 2) exit 1
              }
              END { if (NR != 2) exit 1 }
            ' "$unit_hashes" || return 1
            sha256sum --check --strict "$unit_hashes" >/dev/null
          }
          validate_bundle() {
            [ -d "$state_dir" ] && [ ! -L "$state_dir" ] || return 1
            [ "$(stat -c '%u:%g:%a' "$state_dir")" = 0:0:700 ] || return 1
            validate_helper
            [ -f "$deadline_file" ] && [ ! -L "$deadline_file" ] || return 1
            [ "$(stat -c '%u:%g:%a:%h' "$deadline_file")" = 0:0:600:1 ] || return 1
            [ "$(wc -l < "$deadline_file")" -eq 2 ] || return 1
            validate_unit_file "$service_file"
            validate_unit_file "$timer_file"
            validate_unit_hashes
            [ -L "$timer_link" ]
            [ "$(readlink -f "$timer_link")" = "$timer_file" ]
            for temporary in "$helper_tmp" "$deadline_tmp" "$unit_hashes_tmp" \
              "$service_tmp" "$timer_tmp"; do
              test ! -e "$temporary" && test ! -L "$temporary"
            done
          }

          residual=false
          for path in "$state_dir" "$service_file" "$timer_file" "$service_tmp" \
            "$timer_tmp" "$timer_link"; do
            if [ -e "$path" ] || [ -L "$path" ]; then residual=true; fi
          done
          if [ "$residual" = false ]; then
            for evidence in "$source_config" "$source_hash" "$source_hash_tmp" \
              "$recover_tmp"; do
              test ! -e "$evidence" && test ! -L "$evidence"
            done
            rm -f -- /run/rr-audit-cross-passphrase \
              /root/rr-audit-cross.rrbak \
              /run/rr-audit-cross-fingerprint.json \
              /root/rr-audit-cross-sync.log \
              /root/rr-audit-cross-backup.log \
