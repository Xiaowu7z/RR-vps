            -o ServerAliveCountMax=2 -N \
            -L 17900:127.0.0.1:7900 "root@$host" >/dev/null 2>&1 &
          tunnel_pid=$!
          tunnel_ok=false
          for _ in {1..20}; do
            if curl -fsS --connect-timeout 1 --max-time 3 \
              http://127.0.0.1:17900/healthz >/dev/null 2>&1; then
              tunnel_ok=true
              break
            fi
            kill -0 "$tunnel_pid" 2>/dev/null || break
