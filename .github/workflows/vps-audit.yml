          fi

          tunnel_pid=
          cleanup_tunnel() {
            if [ -n "$tunnel_pid" ]; then
              kill "$tunnel_pid" >/dev/null 2>&1 || true
              wait "$tunnel_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_tunnel EXIT
          if ! port_state=$(ss -H -ltn 'sport = :17900'); then
            echo 'C runner could not inspect port 17900 before tunnel setup.' >&2
            exit 1
          fi
          if grep -q . <<<"$port_state"; then
            echo 'C runner port 17900 was already occupied before tunnel setup.' >&2
