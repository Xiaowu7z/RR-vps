                timer_stamp=/var/lib/systemd/timers/stamp-rr-audit-cross-cleanup-c.timer
                expected_helper_sha=f9707bccf6f8270423a56ad03beba61b6b3ee12df62bff02b9929552d024da3d
                timer_unit=rr-audit-cross-cleanup-c.timer
                service_unit=rr-audit-cross-cleanup-c.service
                validate_helper() {
                  [ -f "$helper" ] && [ ! -L "$helper" ] || return 1
                  [ "$(stat -c '%u:%g:%a:%h' "$helper")" = 0:0:700:1 ] || return 1
                  [ "$(sha256sum "$helper" | awk '{print $1}')" = \
