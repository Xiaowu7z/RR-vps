              /run/rr-audit-cross-fingerprint.json \
              /root/rr-audit-cross-sync.log \
              /root/rr-audit-cross-backup.log \
              /root/rr-audit-panel-pass; do
              test ! -e "$target" && test ! -L "$target"
            done
            exit 0
          fi

          validate_bundle
          test "$(systemctl show -p LoadState --value "$timer_unit")" = loaded
          test "$(systemctl show -p UnitFileState --value "$timer_unit")" = enabled
          test "$(systemctl show -p Transient --value "$timer_unit")" = no
          test "$(systemctl show -p LoadState --value "$service_unit")" = loaded
          test "$(systemctl show -p UnitFileState --value "$service_unit")" = static
          test "$(systemctl show -p Transient --value "$service_unit")" = no
          test "$(systemctl show -p Restart --value "$service_unit")" = on-failure
          test "$(systemctl show -p RestartUSec --value "$service_unit")" = 30s
          test "$(systemctl show -p StartLimitIntervalUSec --value "$service_unit")" = 0
          test "$(systemctl show -p Triggers --value "$timer_unit")" = "$service_unit"
          test "$(systemctl show -p TriggeredBy --value "$service_unit")" = "$timer_unit"
          test "$(systemctl show -p Environment --value "$service_unit")" = \
            "RR_AUDIT_HELPER_SHA=$expected_helper_sha"
          expected_exec_prefix="{ path=$helper ; argv[]=$helper timer ; "
          exec_start=$(systemctl show -p ExecStart --value "$service_unit")
          case "$exec_start" in
            "$expected_exec_prefix"*) ;;
            *) exit 1 ;;
          esac
          exec_metadata=${exec_start#"$expected_exec_prefix"}
          [[ "$exec_metadata" == *'}' ]]
          [[ "$exec_metadata" != *' path='* ]]
          [[ "$exec_start" != *$'\n'* ]]
          service_state=$(systemctl show -p ActiveState --value "$service_unit")
          if [ "$service_state" != inactive ]; then
            systemctl stop "$service_unit"
            if [ "$(systemctl show -p ActiveState --value "$service_unit")" = failed ]; then
              systemctl reset-failed "$service_unit"
            fi
          fi
          RR_AUDIT_HELPER_SHA="$expected_helper_sha" "$helper" exit
          for target in /run/rr-audit-cross-passphrase \
            /root/rr-audit-cross.rrbak \
            /run/rr-audit-cross-fingerprint.json \
            /root/rr-audit-cross-sync.log \
            /root/rr-audit-cross-backup.log \
            /root/rr-audit-panel-pass; do
            test ! -e "$target" && test ! -L "$target"
          done
          validate_bundle
          rm -f -- "$source_config" "$source_hash" "$source_hash_tmp" "$recover_tmp"
          for evidence in "$source_config" "$source_hash" "$source_hash_tmp" \
            "$recover_tmp"; do
            test ! -e "$evidence" && test ! -L "$evidence"
          done
          validate_bundle
          systemctl disable --now "$timer_unit"
          test ! -e "$timer_link" && test ! -L "$timer_link"
          systemctl stop "$service_unit"
          if [ "$(systemctl show -p ActiveState --value "$service_unit")" = failed ]; then
            systemctl reset-failed "$service_unit"
          fi
          validate_unit_file "$service_file"
          validate_unit_file "$timer_file"
          validate_unit_hashes
          rm -f -- "$service_file" "$timer_file"
          test ! -e "$service_file" && test ! -L "$service_file"
          test ! -e "$timer_file" && test ! -L "$timer_file"
          systemctl daemon-reload
          for attempt in $(seq 1 15); do
            timer_load=$(systemctl show -p LoadState --value "$timer_unit")
            service_load=$(systemctl show -p LoadState --value "$service_unit")
            if [ "$timer_load" = not-found ] && \
               [ "$service_load" = not-found ]; then
              break
            fi
            test "$attempt" -lt 15
            sleep 1
          done
          test "$timer_load" = not-found
          test "$service_load" = not-found
          if [ -e "$timer_stamp" ] || [ -L "$timer_stamp" ]; then
            [ -f "$timer_stamp" ] && [ ! -L "$timer_stamp" ]
            [ "$(stat -c '%u:%g:%h' "$timer_stamp")" = 0:0:1 ]
            rm -f -- "$timer_stamp"
          fi
          test ! -e "$timer_stamp" && test ! -L "$timer_stamp"
          validate_helper
          rm -f -- "$unit_hashes" "$deadline_file" "$helper"
