            test -f "/tmp/sub_server/nexus/${sample_token}${suffix}"
            cmp -s "/var/lib/rr-nexus/subscriptions/${sample_id}${suffix}" \
              "/tmp/sub_server/nexus/${sample_token}${suffix}"
