          # snapshot.  A timeout in that interval therefore has no snapshot
          # as a restart signal; always restore and prove the pre-audit
          # active/enabled runtime state after the config proof succeeds.
          /usr/bin/systemctl restart rr-nexus.service
          assert_unit_state rr-nexus.service loaded:active:enabled
