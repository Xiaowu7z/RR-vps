            exit 1
          }
          cleanup_tunnel
          tunnel_pid=

          if ! sshpass -e ssh "${ssh_opts[@]}" "root@$host" bash -s -- \
            "$expected_version" <<'REMOTE'
          set -euo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb
          expected_version="$1"
          stage=/root/rr-audit-candidate
          audit_exit() {
            rc=$?
            trap - EXIT
            find /root -maxdepth 1 -type f -name 'rr-audit-*.log' \
              -exec chmod 600 {} + 2>/dev/null || true
            exit "$rc"
          }
          trap audit_exit EXIT
          assert_unit_state() {
            local unit="$1" expected="$2" load_state="" active_state="" unit_file_state=""
            load_state=$(systemctl show -p LoadState --value "$unit" 2>/dev/null) || return 1
            active_state=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null) || return 1
            unit_file_state=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null) || return 1
            if [ "$load_state" = not-found ] && [ -z "$unit_file_state" ]; then
              unit_file_state=not-found
            fi
            test "$load_state:$active_state:$unit_file_state" = "$expected"
          }
          install_candidate() {
            RR_BUNDLE_FILE="$stage/rr-bundle.tar.gz" \
            RR_GUARD_FILE="$stage/update-guard.sh" \
              bash "$stage/install-core.sh" --upgrade
          }
          assert_candidate() {
            /usr/local/bin/rr --version | grep -F "RR-vps ${expected_version}" >/dev/null
            test -x /usr/local/sbin/rr-update-recover
            test -x /usr/local/sbin/rr-update-external-state
            (
              cd /usr/local/lib/rr
              expected_rr=$(awk '$2 == "rr" {print $1}' manifest.sha256)
              test "$(sha256sum /usr/local/bin/rr | awk '{print $1}')" = "$expected_rr"
              awk '$2 != "rr"' manifest.sha256 | sha256sum -c - >/dev/null
            )
          }
          assert_local_nexus() {
            assert_candidate
            test "$(jq -r '.mode' /etc/rr-nexus/nexus.json)" = local
            test "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA quick_check;')" = ok
            foreign_key_errors=$(sqlite3 /var/lib/rr-nexus/nexus.db \
              'PRAGMA foreign_key_check;') || return 1
            test -z "$foreign_key_errors"
            assert_unit_state rr-nexus.service loaded:active:enabled
            curl -fsS --connect-timeout 5 --max-time 15 \
              http://127.0.0.1:7900/healthz >/dev/null
            bash -c '
              set -e
              for module_file in /usr/local/lib/rr/modules/*.sh; do
                # shellcheck disable=SC1090
                source "$module_file"
              done
              subscription_server_running
            ' >/dev/null
          }
          crash_at() {
            crash_phase="$1"
            crash_log="$2"
            set +e
            (
              RR_TEST_FAULTS=1 RR_TEST_CRASH_PHASE="$crash_phase" \
              RR_BUNDLE_FILE="$stage/rr-bundle.tar.gz" \
              RR_GUARD_FILE="$stage/update-guard.sh" \
                exec bash "$stage/install-core.sh" --upgrade
            ) >>"$crash_log" 2>&1
            crash_rc=$?
            set -e
            test "$crash_rc" -eq 137
          }
          active_transaction() {
            active_file=/var/lib/rr-update/active
            test -f "$active_file"
            test ! -L "$active_file"
            test "$(stat -c '%U:%G:%a:%h' "$active_file")" = root:root:600:1
            mapfile -t active_lines < "$active_file"
            test "${#active_lines[@]}" -eq 1
            candidate_tx="${active_lines[0]}"
            case "$candidate_tx" in
              /var/lib/rr-update/transactions/*) ;;
              *) return 1 ;;
            esac
            tx_name="${candidate_tx##*/}"
            [[ "$tx_name" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+$ ]]
            test -d "$candidate_tx"
            test ! -L "$candidate_tx"
            test "$(readlink -f "$candidate_tx")" = "$candidate_tx"
            test "$(stat -c '%U:%G:%a' "$candidate_tx")" = root:root:700
            for metadata_file in transaction-format phase; do
              test -f "$candidate_tx/$metadata_file"
              test ! -L "$candidate_tx/$metadata_file"
              test "$(stat -c '%U:%G:%a:%h' "$candidate_tx/$metadata_file")" = \
                root:root:600:1
            done
            test "$(cat "$candidate_tx/transaction-format")" = 2
            assert_unit_state rr-update-recovery.service loaded:inactive:enabled
            maintenance_file=/run/rr-vps/update-maintenance
            test -f "$maintenance_file"
            test ! -L "$maintenance_file"
            test "$(stat -c '%U:%G:%a:%h' "$maintenance_file")" = root:root:600:1
            test "$(cat "$maintenance_file")" = "$candidate_tx"
            printf '%s\n' "$candidate_tx"
          }

          assert_local_nexus
          bash -c '
            set -e
            for module_file in /usr/local/lib/rr/modules/*.sh; do
              # shellcheck disable=SC1090
              source "$module_file"
            done
            if any_node_protocol_enabled; then
              echo "C no-protocol recovery fixture unexpectedly has an enabled node." >&2
              exit 1
            fi
            subscription_server_running
          ' >/dev/null
          runtime_marker=$(openssl rand -hex 24)
          printf '%s\n' "$runtime_marker" > /usr/local/lib/rr/.rr-audit-runtime-instance
          chmod 600 /usr/local/lib/rr/.rr-audit-runtime-instance
          crash_at old_runtime_moved /root/rr-audit-crash-old-runtime.log
          active_tx=$(active_transaction)
          test "$(cat "$active_tx/phase")" = switching
          for writer_marker in writer_state_complete subscription_was_running; do
            test -f "$active_tx/backup/$writer_marker"
            test ! -L "$active_tx/backup/$writer_marker"
            test "$(stat -c '%U:%G:%a:%h' "$active_tx/backup/$writer_marker")" = \
              root:root:600:1
          done
          test -e /run/rr-vps/update-maintenance
          assert_unit_state rr-nexus.service loaded:inactive:enabled
          /usr/local/sbin/rr-update-recover recover \
            >>/root/rr-audit-crash-old-runtime.log 2>&1
          test ! -e /var/lib/rr-update/active
          test ! -e /run/rr-vps/update-maintenance
          test "$(cat "$active_tx/phase")" = rolled_back
          /usr/local/sbin/rr-update-external-state verify "$active_tx/backup" \
            --tx-root /var/lib/rr-update \
            >>/root/rr-audit-crash-old-runtime.log 2>&1
          assert_local_nexus
          test "$(cat /usr/local/lib/rr/.rr-audit-runtime-instance)" = "$runtime_marker"
          rm -f /usr/local/lib/rr/.rr-audit-runtime-instance
          unset runtime_marker

          install_candidate >/root/rr-audit-between-crashes.log 2>&1
          assert_local_nexus
          runtime_marker=$(openssl rand -hex 24)
          printf '%s\n' "$runtime_marker" > /usr/local/lib/rr/.rr-audit-runtime-instance
          chmod 600 /usr/local/lib/rr/.rr-audit-runtime-instance
          crash_at runtime_swapped /root/rr-audit-crash-runtime-swapped.log
          active_tx=$(active_transaction)
          test "$(cat "$active_tx/phase")" = runtime_swapped
          test -e /run/rr-vps/update-maintenance
          assert_unit_state rr-nexus.service loaded:inactive:enabled
          systemctl start rr-update-recovery.service \
            >>/root/rr-audit-crash-runtime-swapped.log 2>&1
          test "$(systemctl show rr-update-recovery.service -p Result --value)" = success
          test ! -e /var/lib/rr-update/active
          test ! -e /run/rr-vps/update-maintenance
          test "$(cat "$active_tx/phase")" = rolled_back
          /usr/local/sbin/rr-update-external-state verify "$active_tx/backup" \
            --tx-root /var/lib/rr-update \
            >>/root/rr-audit-crash-runtime-swapped.log 2>&1
          subscription_pid=$(cat /run/rr-vps-subscription.pid)
          [[ "$subscription_pid" =~ ^[0-9]+$ ]]
          grep -Eq '(^|/)rr-subscription-recovery-[0-9]+-[0-9]+\.scope($|/)' \
            "/proc/$subscription_pid/cgroup"
          unset subscription_pid
          assert_local_nexus
          test "$(cat /usr/local/lib/rr/.rr-audit-runtime-instance)" = "$runtime_marker"
          rm -f /usr/local/lib/rr/.rr-audit-runtime-instance
          unset runtime_marker
          install_candidate >>/root/rr-audit-between-crashes.log 2>&1
          assert_local_nexus
          printf 'RR_AUDIT_C_TRANSACTION_COMPLETE sigkill=2 recover=2 tunnel=runner\n'
          REMOTE
          then
            echo 'C SIGKILL/recovery gate failed; root-only 0600 logs retained on VPS.' >&2
            exit 1
          fi

  cross-machine-migration-scale:
    name: A → C · encrypted migration and 500-device scale
    if: github.ref == 'refs/heads/main'
    needs: [debian-full, ubuntu-transaction]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify candidate and prepare SSH client
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Exercise real scale sync and encrypted A-to-C restore
        shell: bash
        env:
          RR_A_HOST: ${{ secrets.RR_A_HOST }}
          RR_A_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm
          RR_A_PASS: ${{ secrets.RR_A_PASS }}
          RR_C_HOST: ${{ secrets.RR_C_HOST }}
          RR_C_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3
          RR_C_PASS: ${{ secrets.RR_C_PASS }}
        run: |
          set -euo pipefail
          set +x
          a_host="$RR_A_HOST"
          c_host="$RR_C_HOST"
          a_known_hosts="$RUNNER_TEMP/known-hosts-migration-A"
          c_known_hosts="$RUNNER_TEMP/known-hosts-migration-C"
          passphrase_file="$RUNNER_TEMP/rr-audit-cross-passphrase"
          backup_file="$RUNNER_TEMP/rr-audit-cross.rrbak"
          fingerprint_file="$RUNNER_TEMP/rr-audit-cross-fingerprint.json"

          prepare_known_hosts() {
            local host="$1" pinned_key="$2" destination="$3"
            local host_key_type="" host_key_data="" host_key_extra=""
            [[ "$pinned_key" != *$'\n'* ]]
            read -r host_key_type host_key_data host_key_extra <<<"$pinned_key"
            [ "$host_key_type" = ssh-ed25519 ]
            [[ "$host_key_data" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
            [ -z "$host_key_extra" ]
            (umask 077; printf '%s %s %s\n' \
              "$host" "$host_key_type" "$host_key_data" > "$destination")
            ssh-keygen -F "$host" -f "$destination" >/dev/null
          }
          prepare_known_hosts "$a_host" "$RR_A_HOST_KEY" "$a_known_hosts"
          prepare_known_hosts "$c_host" "$RR_C_HOST_KEY" "$c_known_hosts"
          ssh_common=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
          )

          recover_audit_source_config() {
            SSHPASS="$RR_A_PASS" sshpass -e ssh "${ssh_common[@]}" \
              -o UserKnownHostsFile="$a_known_hosts" "root@$a_host" '
                set -euo pipefail
                backup=/root/rr-audit-cross-source-config
                if [ -e "$backup" ] || [ -L "$backup" ]; then
                  [ -f "$backup" ] && [ ! -L "$backup" ]
                  [ "$(stat -c "%U:%G:%a:%h" "$backup")" = root:root:600:1 ]
                  [ "$(grep -c "^NAIVE_ENABLED=true$" "$backup")" -eq 1 ]
                  install -o root -g root -m 600 "$backup" /etc/argo_vmess.conf
                  cmp -s "$backup" /etc/argo_vmess.conf
                  rm -f -- "$backup"
                fi
                rm -f -- /root/rr-audit-cross-passphrase \
                  /root/rr-audit-cross.rrbak \
                  /root/rr-audit-cross-fingerprint.json
              '
          }

          cleanup_audit_target_state() {
            SSHPASS="$RR_C_PASS" sshpass -e ssh "${ssh_common[@]}" \
              -o UserKnownHostsFile="$c_known_hosts" "root@$c_host" '
                set -euo pipefail
                for backend in iptables ip6tables; do
                  command -v "$backend" >/dev/null 2>&1 || continue
                  while "$backend" -w 5 -t filter -C INPUT -p tcp --dport 65431 \
                    -m comment --comment argo-rr-managed-block -j DROP >/dev/null 2>&1; do
                    "$backend" -w 5 -t filter -D INPUT -p tcp --dport 65431 \
                      -m comment --comment argo-rr-managed-block -j DROP
                  done
                  while "$backend" -w 5 -t nat -C PREROUTING -p udp --dport 65432 \
                    -m comment --comment argo-rr-audit-fixture \
                    -j REDIRECT --to-ports 65431 >/dev/null 2>&1; do
                    "$backend" -w 5 -t nat -D PREROUTING -p udp --dport 65432 \
                      -m comment --comment argo-rr-audit-fixture \
                      -j REDIRECT --to-ports 65431
                  done
                done
                if command -v netfilter-persistent >/dev/null 2>&1; then
                  netfilter-persistent save >/dev/null
                elif command -v service >/dev/null 2>&1 && [ -x /etc/init.d/iptables ]; then
                  service iptables save >/dev/null
                fi
                rm -f -- /root/rr-audit-cross-passphrase \
                  /root/rr-audit-cross.rrbak \
                  /root/rr-audit-cross-fingerprint.json \
                  /root/rr-audit-cross-restored-fingerprint.json \
                  /root/rr-audit-cross-target-access.json \
                  /root/rr-audit-cross-target-network.txt \
                  /root/rr-audit-cross-target-channel \
                  /root/rr-audit-cross-target-bind \
                  /root/rr-audit-cross-target-firewall \
                  /root/rr-audit-cross-restored-firewall
              '
          }

          cleanup_cross_audit() {
            rc=$?
            trap - EXIT
            rm -f -- "$passphrase_file" "$backup_file" "$fingerprint_file"
            recover_audit_source_config >/dev/null 2>&1 || rc=1
            cleanup_audit_target_state >/dev/null 2>&1 || rc=1
            exit "$rc"
          }
          trap cleanup_cross_audit EXIT

          recover_audit_source_config
          cleanup_audit_target_state
          (umask 077; openssl rand -base64 48 > "$passphrase_file")
          test "$(stat -c %a "$passphrase_file")" = 600
          test "$(wc -c < "$passphrase_file")" -ge 48
          SSHPASS="$RR_A_PASS" sshpass -e scp "${ssh_common[@]}" \
            -o UserKnownHostsFile="$a_known_hosts" -q "$passphrase_file" \
            "root@$a_host:/root/rr-audit-cross-passphrase"
          SSHPASS="$RR_C_PASS" sshpass -e scp "${ssh_common[@]}" \
            -o UserKnownHostsFile="$c_known_hosts" -q "$passphrase_file" \
            "root@$c_host:/root/rr-audit-cross-passphrase"

          SSHPASS="$RR_A_PASS" sshpass -e ssh "${ssh_common[@]}" \
            -o UserKnownHostsFile="$a_known_hosts" "root@$a_host" bash -s <<'REMOTE_A'
          set -euo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb
          passphrase_file=/root/rr-audit-cross-passphrase
          backup_file=/root/rr-audit-cross.rrbak
          fingerprint_file=/root/rr-audit-cross-fingerprint.json
          source_config_backup=/root/rr-audit-cross-source-config
          source_config_sha=""
          nexus_stopped=false
          health_timer_stopped=false
          source_config_saved=false
          finish_source_audit() {
            rc=$?
            trap - EXIT
            if [ "$source_config_saved" = true ]; then
              if install -o root -g root -m 600 "$source_config_backup" \
                   /etc/argo_vmess.conf && \
                 cmp -s "$source_config_backup" /etc/argo_vmess.conf && \
                 [ "$(sha256sum /etc/argo_vmess.conf | awk '{print $1}')" = \
                   "$source_config_sha" ]; then
                rm -f -- "$source_config_backup" || rc=1
              else
                rc=1
              fi
            fi
            if [ "$nexus_stopped" = true ]; then
              systemctl start rr-nexus.service >/dev/null 2>&1 || rc=1
            fi
            if [ "$health_timer_stopped" = true ]; then
              systemctl start argo-rr-health.timer >/dev/null 2>&1 || rc=1
            fi
            find /root -maxdepth 1 -type f -name 'rr-audit-cross-*' \
              -exec chmod 600 {} + 2>/dev/null || true
            exit "$rc"
          }
          trap finish_source_audit EXIT
          assert_unit_state() {
            local unit="$1" expected="$2" load_state="" active_state="" unit_file_state=""
            load_state=$(systemctl show -p LoadState --value "$unit" 2>/dev/null) || return 1
            active_state=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null) || return 1
            unit_file_state=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null) || return 1
            if [ "$load_state" = not-found ] && [ -z "$unit_file_state" ]; then
              unit_file_state=not-found
            fi
            test "$load_state:$active_state:$unit_file_state" = "$expected"
          }
          wait_local_nexus() {
            local deadline=$((SECONDS + 30))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if ! assert_unit_state rr-nexus.service loaded:active:enabled; then
                echo 'A Nexus became inactive while waiting for local health.' >&2
                return 1
              fi
              if curl -fsS --connect-timeout 1 --max-time 3 \
                   http://127.0.0.1:7900/healthz >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo 'A Nexus local health did not become ready within 30 seconds.' >&2
            return 1
          }
          test "$(id -u)" -eq 0
          test "$(stat -c '%U:%G:%a:%h' "$passphrase_file")" = root:root:600:1
          test -x /usr/local/bin/rr
          grep -qx INSTALL_COMPLETE=true /etc/argo_vmess.conf
          grep -qx SUB_ACCESS_MODE=https /etc/argo_vmess.conf
          assert_unit_state sing-box.service loaded:active:enabled
          assert_unit_state rr-nexus.service loaded:active:enabled
          curl -fsS --connect-timeout 5 --max-time 15 \
            http://127.0.0.1:7900/healthz >/dev/null
          test "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA quick_check;')" = ok
          foreign_key_errors=$(sqlite3 /var/lib/rr-nexus/nexus.db \
            'PRAGMA foreign_key_check;') || exit 1
          test -z "$foreign_key_errors"

          python3 - /var/lib/rr-nexus/nexus.db <<'PY'
          import sqlite3
          import sys
          import uuid

          database = sys.argv[1]
          connection = sqlite3.connect(database, timeout=30)
          try:
              connection.execute("PRAGMA foreign_keys=ON")
              columns = {
                  row[1] for row in connection.execute("PRAGMA table_info(devices)")
              }
              required = {
                  "id", "name", "credential", "subscription_token", "enabled",
                  "quota_bytes", "used_bytes", "uploaded_bytes", "downloaded_bytes",
                  "traffic_updated_at", "group_id", "expires_at", "next_reset_at",
                  "reset_anchor_day", "reset_max", "reset_count", "created_at", "updated_at",
              }
              if not required.issubset(columns):
                  raise RuntimeError("production device schema is incomplete")
              connection.execute("BEGIN IMMEDIATE")
              connection.execute("DELETE FROM devices")
              rows = []
              for index in range(1, 501):
                  device_id = f"dev_a{index:011x}"
                  credential = str(uuid.uuid5(uuid.NAMESPACE_URL, f"rr-audit-{index}"))
                  token = f"RRAuditToken{index:012d}"
                  rows.append((
                      device_id, f"audit-device-{index:03d}", credential, token, 1,
                      10_737_418_240 + index, 1_000_000 + index,
                      400_000 + index, 600_000, "2026-08-30T00:00:00+00:00",
                      None, "2030-08-30", "2029-09-30", 30, 36, 7,
                      "2026-08-30T00:00:00+00:00", "2026-08-30T00:00:00+00:00",
                  ))
              connection.executemany(
                  "INSERT INTO devices("
                  "id,name,credential,subscription_token,enabled,quota_bytes,used_bytes,"
                  "uploaded_bytes,downloaded_bytes,traffic_updated_at,group_id,expires_at,"
                  "next_reset_at,reset_anchor_day,reset_max,reset_count,created_at,updated_at"
                  ") VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",
                  rows,
              )
              connection.commit()
          finally:
              connection.close()
          PY

          install -d -m 700 /var/lib/rr-nexus/subscriptions /tmp/sub_server/nexus
          printf 'stale\n' > /var/lib/rr-nexus/subscriptions/dev_deadbeef0000.txt
          printf 'stale\n' > /tmp/sub_server/nexus/RRAuditStaleToken0001.txt
          chmod 600 /var/lib/rr-nexus/subscriptions/dev_deadbeef0000.txt \
            /tmp/sub_server/nexus/RRAuditStaleToken0001.txt

          for scale in 1 10 100 500; do
            python3 - /var/lib/rr-nexus/nexus.db "$scale" <<'PY'
          import sqlite3
          import sys

          database, scale_raw = sys.argv[1:]
          scale = int(scale_raw)
          connection = sqlite3.connect(database, timeout=30)
          try:
              ids = [
                  row[0] for row in connection.execute(
                      "SELECT id FROM devices ORDER BY id LIMIT ?", (scale,)
                  )
              ]
              if len(ids) != scale:
                  raise RuntimeError("scale fixture is incomplete")
              connection.execute("BEGIN IMMEDIATE")
              connection.execute("UPDATE devices SET enabled=0")
              connection.executemany(
                  "UPDATE devices SET enabled=1 WHERE id=?",
                  ((device_id,) for device_id in ids),
              )
              connection.commit()
          finally:
              connection.close()
          PY
            started_ns=$(date +%s%N)
            timeout --kill-after=5 150 /usr/local/bin/rr --sync-devices \
              >/root/rr-audit-cross-sync.log 2>&1
            elapsed_ms=$((($(date +%s%N) - started_ns) / 1000000))
            test "$elapsed_ms" -gt 0
            test "$elapsed_ms" -lt 60000
            test "$(sqlite3 /var/lib/rr-nexus/nexus.db \
              'SELECT COUNT(*) FROM devices WHERE enabled=1;')" -eq "$scale"
            test "$(sqlite3 /var/lib/rr-nexus/nexus.db \
              'SELECT COUNT(*) FROM devices;')" -eq 500
            test "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA quick_check;')" = ok
            foreign_key_errors=$(sqlite3 /var/lib/rr-nexus/nexus.db \
              'PRAGMA foreign_key_check;') || exit 1
            test -z "$foreign_key_errors"
            python3 - /var/lib/rr-nexus/nexus.db \
              /var/lib/rr-nexus/subscriptions /tmp/sub_server/nexus "$scale" <<'PY'
          import json
          import os
          from pathlib import Path
          import sqlite3
          import stat
          import sys

          database, private_raw, public_raw, scale_raw = sys.argv[1:]
          scale = int(scale_raw)
          private_root = Path(private_raw)
          public_root = Path(public_raw)
          suffixes = (
              ".txt", ".json", ".yaml", "-vl.json", "-mihomo.yaml",
              "-clash-verge.yaml", "-flclash.yaml", "-v2rayn.txt",
              "-v2rayng.txt", "-sr.txt", "-nekobox.txt",
          )
          connection = sqlite3.connect(f"file:{database}?mode=ro", uri=True, timeout=30)
          try:
              rows = connection.execute(
                  "SELECT id,credential,subscription_token FROM devices "
                  "WHERE enabled=1 ORDER BY id"
              ).fetchall()
          finally:
              connection.close()
          if len(rows) != scale:
              raise RuntimeError("generated-tree device count differs from database")
          expected_private = {f"{row[0]}{suffix}" for row in rows for suffix in suffixes}
          expected_public = {f"{row[2]}{suffix}" for row in rows for suffix in suffixes}
          expected_public.add("index.html")
          if {path.name for path in private_root.iterdir()} != expected_private:
              raise RuntimeError("private generated tree is not exact")
