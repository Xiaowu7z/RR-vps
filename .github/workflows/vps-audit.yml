            )
            [ "$role" = B ] || { printf '%s\n' not-applicable; return 0; }
            rr_audit_path_absent "$marker" && { printf '%s\n' not-present; return 0; }
            for spec in "${evidence_specs[@]}"; do
              token="${spec%%:*}"
