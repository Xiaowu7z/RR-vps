# Temporary owner-authorized destructive audit; remove after the three-VPS gate.
name: Temporary VPS candidate transaction audit

on:
  push:
    branches: [main]
    paths: [".github/workflows/vps-audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-vps-audit
  cancel-in-progress: false

jobs:
  transaction:
    name: "${{ matrix.role }} · ${{ matrix.os_name }} · real transaction"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: A
            os_name: Debian 12
            expected_id: debian
            expected_version: "12"
          - role: B
            os_name: Ubuntu 22.04
            expected_id: ubuntu
            expected_version: "22.04"
          - role: C
            os_name: Ubuntu 24.04
            expected_id: ubuntu
            expected_version: "24.04"
    env:
      RR_A_HOST: ${{ secrets.RR_A_HOST }}
      RR_A_PASS: ${{ secrets.RR_A_PASS }}
      RR_B_HOST: ${{ secrets.RR_B_HOST }}
      RR_B_PASS: ${{ secrets.RR_B_PASS }}
      RR_C_HOST: ${{ secrets.RR_C_HOST }}
      RR_C_PASS: ${{ secrets.RR_C_PASS }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f6af28039320135cd6bc342fc93b646ac8e58062
          persist-credentials: false

      - name: Verify candidate and install SSH client
        run: |
          set -euo pipefail
          test "$GITHUB_WORKSPACE" != /
          test "$(git rev-parse HEAD)" = f6af28039320135cd6bc342fc93b646ac8e58062
          python3 scripts/rebuild-bundle.py --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Exercise real update transaction
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
          EXPECTED_ID: ${{ matrix.expected_id }}
          EXPECTED_VERSION: ${{ matrix.expected_version }}
        run: |
          set -euo pipefail
          set +x
          case "$ROLE" in
            A) host="$RR_A_HOST"; export SSHPASS="$RR_A_PASS" ;;
            B) host="$RR_B_HOST"; export SSHPASS="$RR_B_PASS" ;;
            C) host="$RR_C_HOST"; export SSHPASS="$RR_C_PASS" ;;
            *) exit 2 ;;
          esac
          known_hosts="$RUNNER_TEMP/known-hosts-$ROLE"
          ssh_opts=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$known_hosts"
          )
          sshpass -e ssh "${ssh_opts[@]}" "root@$host" \
            'install -d -m 700 /root/rr-audit-candidate'
          sshpass -e scp "${ssh_opts[@]}" -q \
            rr-bundle.tar.gz scripts/install-core.sh scripts/update-guard.sh \
            "root@$host:/root/rr-audit-candidate/"
          sshpass -e ssh "${ssh_opts[@]}" "root@$host" bash -s -- \
            "$ROLE" "$EXPECTED_ID" "$EXPECTED_VERSION" <<'REMOTE'
          set -euo pipefail
          export LANG=C LC_ALL=C
          role="$1"
          expected_id="$2"
          expected_os_version="$3"
          # shellcheck disable=SC1091
          . /etc/os-release
          test "$(id -u)" -eq 0
          test "${ID,,}" = "$expected_id"
          test "$VERSION_ID" = "$expected_os_version"
          test "$(ps -p 1 -o comm= | tr -d '[:space:]')" = systemd
          test ! -e /etc/argo_vmess.conf
          stage=/root/rr-audit-candidate
          chmod 700 "$stage"
          chmod 600 "$stage/rr-bundle.tar.gz" "$stage/install-core.sh" "$stage/update-guard.sh"

          install_candidate() {
            RR_BUNDLE_FILE="$stage/rr-bundle.tar.gz" \
            RR_GUARD_FILE="$stage/update-guard.sh" \
              bash "$stage/install-core.sh" --upgrade
          }
          assert_candidate() {
            /usr/local/bin/rr --version | grep -F 'RR-vps 7.1.1' >/dev/null
            test -x /usr/local/bin/rr
            test -x /usr/local/sbin/rr-update-recover
            test -s /usr/local/lib/rr/manifest.sha256
            expected_rr=$(awk '$2 == "rr" {print $1}' /usr/local/lib/rr/manifest.sha256)
            test "$(sha256sum /usr/local/bin/rr | awk '{print $1}')" = "$expected_rr"
            (cd /usr/local/lib/rr && sha256sum -c <(awk '$2 != "rr"' manifest.sha256) >/dev/null)
            test "$(stat -c %a /var/lib/rr-update)" = 700
            test ! -L /usr/local/lib/rr
          }

          install_candidate
          assert_candidate
          first_manifest=$(sha256sum /usr/local/lib/rr/manifest.sha256 | awk '{print $1}')
          install_candidate
          assert_candidate
          test "$(sha256sum /usr/local/lib/rr/manifest.sha256 | awk '{print $1}')" = "$first_manifest"

          /usr/local/sbin/rr-update-recover rollback
          assert_candidate
          install_candidate
          assert_candidate

          if [ "$role" = C ]; then
            set +e
            RR_TEST_FAULTS=1 RR_TEST_FAIL_PHASE=old_runtime_moved \
              RR_BUNDLE_FILE="$stage/rr-bundle.tar.gz" \
              RR_GUARD_FILE="$stage/update-guard.sh" \
              bash "$stage/install-core.sh" --upgrade
            rc=$?
            set -e
            test "$rc" -ne 0
            assert_candidate
            test ! -e /var/lib/rr-update/active

            set +e
            RR_TEST_FAULTS=1 RR_TEST_CRASH_PHASE=old_runtime_moved \
              RR_BUNDLE_FILE="$stage/rr-bundle.tar.gz" \
              RR_GUARD_FILE="$stage/update-guard.sh" \
              bash "$stage/install-core.sh" --upgrade
            rc=$?
            set -e
            test "$rc" -ne 0
            /usr/local/sbin/rr-update-recover recover
            assert_candidate

            install_candidate
            set +e
            RR_TEST_FAULTS=1 RR_TEST_CRASH_PHASE=runtime_swapped \
              RR_BUNDLE_FILE="$stage/rr-bundle.tar.gz" \
              RR_GUARD_FILE="$stage/update-guard.sh" \
              bash "$stage/install-core.sh" --upgrade
            rc=$?
            set -e
            test "$rc" -ne 0
            /usr/local/sbin/rr-update-recover recover
            assert_candidate
            install_candidate
            assert_candidate
          fi

          test ! -e /etc/argo_vmess.conf
          printf 'RR_AUDIT_TRANSACTION_COMPLETE role=%s os=%s version=%s\n' \
            "$role" "$ID" "$VERSION_ID"
          REMOTE
