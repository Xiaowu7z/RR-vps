              test -f "$candidate_tx/$metadata_file"
              test ! -L "$candidate_tx/$metadata_file"
              test "$(stat -c '%U:%G:%a:%h' "$candidate_tx/$metadata_file")" = \
                root:root:600:1
            done
            test "$(cat "$candidate_tx/transaction-format")" = 2
            assert_unit_state rr-update-recovery.service loaded:inactive:enabled
            maintenance_file=/run/rr-vps/update-maintenance
            test -f "$maintenance_file"
            test ! -L "$maintenance_file"
            test "$(stat -c '%U:%G:%a:%h' "$maintenance_file")" = root:root:600:1
            test "$(cat "$maintenance_file")" = "$candidate_tx"
            printf '%s\n' "$candidate_tx"
          }

          assert_local_nexus
          bash -c '
            set -e
            for module_file in /usr/local/lib/rr/modules/*.sh; do
              # shellcheck disable=SC1090
              source "$module_file"
            done
            if any_node_protocol_enabled; then
              echo "C no-protocol recovery fixture unexpectedly has an enabled node." >&2
              exit 1
            fi
            subscription_server_running
          ' >/dev/null
          runtime_marker=$(openssl rand -hex 24)
          printf '%s\n' "$runtime_marker" > /usr/local/lib/rr/.rr-audit-runtime-instance
          chmod 600 /usr/local/lib/rr/.rr-audit-runtime-instance
          crash_at old_runtime_moved /root/rr-audit-crash-old-runtime.log
          active_tx=$(active_transaction)
          test "$(cat "$active_tx/phase")" = switching
          for writer_marker in writer_state_complete subscription_was_running; do
            test -f "$active_tx/backup/$writer_marker"
            test ! -L "$active_tx/backup/$writer_marker"
            test "$(stat -c '%U:%G:%a:%h' "$active_tx/backup/$writer_marker")" = \
              root:root:600:1
          done
          test -e /run/rr-vps/update-maintenance
          assert_unit_state rr-nexus.service loaded:inactive:enabled
          /usr/local/sbin/rr-update-recover recover \
            >>/root/rr-audit-crash-old-runtime.log 2>&1
          test ! -e /var/lib/rr-update/active
          test ! -e /run/rr-vps/update-maintenance
          test "$(cat "$active_tx/phase")" = rolled_back
          /usr/local/sbin/rr-update-external-state verify "$active_tx/backup" \
            --tx-root /var/lib/rr-update \
            >>/root/rr-audit-crash-old-runtime.log 2>&1
          assert_local_nexus
          test "$(cat /usr/local/lib/rr/.rr-audit-runtime-instance)" = "$runtime_marker"
          rm -f /usr/local/lib/rr/.rr-audit-runtime-instance
          unset runtime_marker

          install_candidate >/root/rr-audit-between-crashes.log 2>&1
          assert_local_nexus
          runtime_marker=$(openssl rand -hex 24)
          printf '%s\n' "$runtime_marker" > /usr/local/lib/rr/.rr-audit-runtime-instance
          chmod 600 /usr/local/lib/rr/.rr-audit-runtime-instance
          crash_at runtime_swapped /root/rr-audit-crash-runtime-swapped.log
          active_tx=$(active_transaction)
          test "$(cat "$active_tx/phase")" = runtime_swapped
          test -e /run/rr-vps/update-maintenance
          assert_unit_state rr-nexus.service loaded:inactive:enabled
          systemctl start rr-update-recovery.service \
            >>/root/rr-audit-crash-runtime-swapped.log 2>&1
          test "$(systemctl show rr-update-recovery.service -p Result --value)" = success
          test ! -e /var/lib/rr-update/active
          test ! -e /run/rr-vps/update-maintenance
          test "$(cat "$active_tx/phase")" = rolled_back
          /usr/local/sbin/rr-update-external-state verify "$active_tx/backup" \
            --tx-root /var/lib/rr-update \
            >>/root/rr-audit-crash-runtime-swapped.log 2>&1
          subscription_pid=$(cat /run/rr-vps-subscription.pid)
          [[ "$subscription_pid" =~ ^[0-9]+$ ]]
          grep -Eq '(^|/)rr-subscription-recovery-[0-9]+-[0-9]+\.scope($|/)' \
            "/proc/$subscription_pid/cgroup"
          unset subscription_pid
          assert_local_nexus
          test "$(cat /usr/local/lib/rr/.rr-audit-runtime-instance)" = "$runtime_marker"
          rm -f /usr/local/lib/rr/.rr-audit-runtime-instance
          unset runtime_marker
          install_candidate >>/root/rr-audit-between-crashes.log 2>&1
          assert_local_nexus
          printf 'RR_AUDIT_C_TRANSACTION_COMPLETE sigkill=2 recover=2 tunnel=runner\n'
          REMOTE
          then
            echo 'C SIGKILL/recovery gate failed; root-only 0600 logs retained on VPS.' >&2
            exit 1
          fi

  cross-machine-migration-scale:
    name: A → C · encrypted migration and 500-device scale
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [debian-full, ubuntu-transaction]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify candidate and prepare SSH client
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Exercise real scale sync and encrypted A-to-C restore
        shell: bash
        env:
          RR_A_HOST: ${{ secrets.RR_A_HOST }}
          RR_A_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm
          RR_A_PASS: ${{ secrets.RR_A_PASS }}
          RR_C_HOST: ${{ secrets.RR_C_HOST }}
          RR_C_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3
          RR_C_PASS: ${{ secrets.RR_C_PASS }}
        run: |
          set -euo pipefail
          set +x
          a_host="$RR_A_HOST"
          c_host="$RR_C_HOST"
          a_known_hosts="$RUNNER_TEMP/known-hosts-migration-A"
          c_known_hosts="$RUNNER_TEMP/known-hosts-migration-C"
          passphrase_file="$RUNNER_TEMP/rr-audit-cross-passphrase"
          backup_file="$RUNNER_TEMP/rr-audit-cross.rrbak"
          fingerprint_file="$RUNNER_TEMP/rr-audit-cross-fingerprint.json"
          audit_stage=runner-preflight

          prepare_known_hosts() {
            local host="$1" pinned_key="$2" destination="$3"
            local host_key_type="" host_key_data="" host_key_extra=""
            [[ "$pinned_key" != *$'\n'* ]]
            read -r host_key_type host_key_data host_key_extra <<<"$pinned_key"
            [ "$host_key_type" = ssh-ed25519 ]
            [[ "$host_key_data" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
            [ -z "$host_key_extra" ]
            (umask 077; printf '%s %s %s\n' \
              "$host" "$host_key_type" "$host_key_data" > "$destination")
            ssh-keygen -F "$host" -f "$destination" >/dev/null
          }
          ssh_common=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
          )

          arm_audit_source_cleanup_timer() {
            SSHPASS="$RR_A_PASS" sshpass -e ssh "${ssh_common[@]}" \
              -o UserKnownHostsFile="$a_known_hosts" "root@$a_host" \
              bash -s <<'REMOTE_A_ARM'
          set -euo pipefail
          umask 077
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          timer_unit=rr-audit-cross-cleanup-a.timer
          service_unit=rr-audit-cross-cleanup-a.service
          state_dir=/var/lib/rr-audit-cross-cleanup-a
          helper="$state_dir/helper"
          helper_tmp="$state_dir/.helper.new"
          deadline_file="$state_dir/deadline"
          deadline_tmp="$state_dir/.deadline.new"
          unit_hashes="$state_dir/units.sha256"
          unit_hashes_tmp="$state_dir/.units.sha256.new"
          service_file=/etc/systemd/system/rr-audit-cross-cleanup-a.service
          timer_file=/etc/systemd/system/rr-audit-cross-cleanup-a.timer
          service_tmp=/etc/systemd/system/.rr-audit-cross-cleanup-a.service.new
          timer_tmp=/etc/systemd/system/.rr-audit-cross-cleanup-a.timer.new
          timer_link=/etc/systemd/system/timers.target.wants/rr-audit-cross-cleanup-a.timer
          timer_stamp=/var/lib/systemd/timers/stamp-rr-audit-cross-cleanup-a.timer
          source_config=/root/rr-audit-cross-source-config
          source_hash=/root/rr-audit-cross-source-config.sha256
          source_hash_tmp=/root/.rr-audit-cross-source-config.sha256.new
          recover_tmp=/etc/.rr-audit-cross-source-config.recover
          expected_helper_sha=6260506ef5a36f37c525c92dc934bf52f043c8600f6c2d1ec497965b83508c25
          live_config=/etc/argo_vmess.conf

          validate_directory() {
            local path="$1" expected_mode="$2"
            [ -d "$path" ] && [ ! -L "$path" ] || return 1
            [ "$(stat -c '%u:%g:%a' "$path")" = "0:0:$expected_mode" ]
          }

          validate_config() {
            local path="$1" expected_sha="$2" size="" actual_sha=""
            [ -f "$path" ] && [ ! -L "$path" ] || return 1
            [ "$(stat -c '%u:%g:%a:%h' "$path")" = 0:0:600:1 ] || return 1
            size=$(stat -c %s "$path") || return 1
            [[ "$size" =~ ^[1-9][0-9]*$ ]] || return 1
            [ "$size" -le 262144 ] || return 1
            actual_sha=$(sha256sum "$path" | awk '{print $1}') || return 1
            [ "$actual_sha" = "$expected_sha" ] || return 1
            [ "$(grep -c '^INSTALL_COMPLETE=true$' "$path")" -eq 1 ] || return 1
            [ "$(grep -c '^NAIVE_ENABLED=true$' "$path")" -eq 1 ] || return 1
            [ "$(grep -c '^NAIVE_ENABLED=' "$path")" -eq 1 ] || return 1
          }

          validate_hash_file() {
            local path="$1"
            [ -f "$path" ] && [ ! -L "$path" ] || return 1
            [ "$(stat -c '%u:%g:%a:%h' "$path")" = 0:0:600:1 ] || return 1
            [ "$(wc -c < "$path")" -eq 65 ] || return 1
            grep -Eq '^[a-f0-9]{64}$' "$path"
          }

          validate_helper() {
            local path="$1"
            [ -f "$path" ] && [ ! -L "$path" ] || return 1
            [ "$(stat -c '%u:%g:%a:%h' "$path")" = 0:0:700:1 ] || return 1
            [ "$(sha256sum "$path" | awk '{print $1}')" = \
              "$expected_helper_sha" ]
          }

          validate_deadline() {
            local epoch="" calendar="" rendered=""
            [ -f "$deadline_file" ] && [ ! -L "$deadline_file" ] || return 1
            [ "$(stat -c '%u:%g:%a:%h' "$deadline_file")" = 0:0:600:1 ] || return 1
            [ "$(wc -l < "$deadline_file")" -eq 2 ] || return 1
            epoch=$(sed -n '1p' "$deadline_file") || return 1
            calendar=$(sed -n '2p' "$deadline_file") || return 1
            [[ "$epoch" =~ ^[1-9][0-9]{9,}$ ]] || return 1
            rendered=$(date -u -d "@$epoch" '+%Y-%m-%d %H:%M:%S UTC') || return 1
            [ "$calendar" = "$rendered" ]
          }

          validate_unit_file() {
            local path="$1"
            [ -f "$path" ] && [ ! -L "$path" ] || return 1
            [ "$(stat -c '%u:%g:%a:%h' "$path")" = 0:0:644:1 ]
          }

          validate_unit_hashes() {
            [ -f "$unit_hashes" ] && [ ! -L "$unit_hashes" ] || return 1
            [ "$(stat -c '%u:%g:%a:%h' "$unit_hashes")" = 0:0:600:1 ] || return 1
            awk -v service="$service_file" -v timer="$timer_file" '
              NR == 1 {
                if ($1 !~ /^[a-f0-9]{64}$/ || $2 != service || NF != 2) exit 1
              }
              NR == 2 {
                if ($1 !~ /^[a-f0-9]{64}$/ || $2 != timer || NF != 2) exit 1
              }
              END { if (NR != 2) exit 1 }
            ' "$unit_hashes" || return 1
            sha256sum --check --strict "$unit_hashes" >/dev/null
          }

          validate_bundle() {
            validate_directory "$state_dir" 700
            validate_helper "$helper"
            test ! -e "$helper_tmp" && test ! -L "$helper_tmp"
            test ! -e "$deadline_tmp" && test ! -L "$deadline_tmp"
            test ! -e "$unit_hashes_tmp" && test ! -L "$unit_hashes_tmp"
            test ! -e "$service_tmp" && test ! -L "$service_tmp"
            test ! -e "$timer_tmp" && test ! -L "$timer_tmp"
            validate_deadline
            validate_unit_file "$service_file"
            validate_unit_file "$timer_file"
            validate_unit_hashes
            [ -L "$timer_link" ]
            [ "$(readlink -f "$timer_link")" = "$timer_file" ]
          }

          disarm_bundle() {
            local timer_load="" service_load="" attempt=""
            validate_bundle
            systemctl disable --now "$timer_unit"
            test ! -e "$timer_link" && test ! -L "$timer_link"
            service_load=$(systemctl show -p LoadState --value "$service_unit")
            if [ "$service_load" != not-found ]; then
              systemctl stop "$service_unit"
              if [ "$(systemctl show -p ActiveState --value "$service_unit")" = failed ]; then
                systemctl reset-failed "$service_unit"
              fi
            fi
            validate_unit_file "$service_file"
            validate_unit_file "$timer_file"
            validate_unit_hashes
            rm -f -- "$service_file" "$timer_file"
            test ! -e "$service_file" && test ! -L "$service_file"
            test ! -e "$timer_file" && test ! -L "$timer_file"
            systemctl daemon-reload
            for attempt in $(seq 1 15); do
              timer_load=$(systemctl show -p LoadState --value "$timer_unit")
              service_load=$(systemctl show -p LoadState --value "$service_unit")
              if [ "$timer_load" = not-found ] && \
                 [ "$service_load" = not-found ]; then
                break
              fi
              test "$attempt" -lt 15
              sleep 1
            done
            test "$timer_load" = not-found
            test "$service_load" = not-found
            if [ -e "$timer_stamp" ] || [ -L "$timer_stamp" ]; then
              [ -f "$timer_stamp" ] && [ ! -L "$timer_stamp" ]
              [ "$(stat -c '%u:%g:%h' "$timer_stamp")" = 0:0:1 ]
              rm -f -- "$timer_stamp"
            fi
            test ! -e "$timer_stamp" && test ! -L "$timer_stamp"
            validate_helper "$helper"
            validate_deadline
            [ -f "$unit_hashes" ] && [ ! -L "$unit_hashes" ]
            rm -f -- "$unit_hashes" "$deadline_file" "$helper"
            test ! -e "$unit_hashes" && test ! -L "$unit_hashes"
            test ! -e "$deadline_file" && test ! -L "$deadline_file"
            test ! -e "$helper" && test ! -L "$helper"
            rmdir "$state_dir"
            sync -f /var/lib
          }

          write_helper() {
            [ ! -e "$helper_tmp" ] && [ ! -L "$helper_tmp" ] || return 1
            (set -C; /usr/bin/tee "$helper_tmp" >/dev/null \
              <<'RR_A_CLEANUP_HELPER'
          #!/bin/bash
          set -euo pipefail
          umask 077
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          state_dir=/var/lib/rr-audit-cross-cleanup-a
          self="$state_dir/helper"
          self_tmp="$state_dir/.helper.new"
          deadline_file="$state_dir/deadline"
          deadline_tmp="$state_dir/.deadline.new"
          unit_hashes="$state_dir/units.sha256"
          unit_hashes_tmp="$state_dir/.units.sha256.new"
          service_unit=rr-audit-cross-cleanup-a.service
          timer_unit=rr-audit-cross-cleanup-a.timer
          service_file=/etc/systemd/system/rr-audit-cross-cleanup-a.service
          timer_file=/etc/systemd/system/rr-audit-cross-cleanup-a.timer
          service_tmp=/etc/systemd/system/.rr-audit-cross-cleanup-a.service.new
          timer_tmp=/etc/systemd/system/.rr-audit-cross-cleanup-a.timer.new
          timer_link=/etc/systemd/system/timers.target.wants/rr-audit-cross-cleanup-a.timer
          timer_stamp=/var/lib/systemd/timers/stamp-rr-audit-cross-cleanup-a.timer
          cleanup_mode="${1:-}"
          source_config=/root/rr-audit-cross-source-config
          source_hash=/root/rr-audit-cross-source-config.sha256
          recover_tmp=/etc/.rr-audit-cross-source-config.recover
          live_config=/etc/argo_vmess.conf

          validate_directory() {
            local path="$1" expected_mode="$2"
            [ -d "$path" ] && [ ! -L "$path" ] || return 1
            [ "$(/usr/bin/stat -c '%u:%g:%a' "$path")" = \
              "0:0:$expected_mode" ]
          }

          validate_unit_file() {
            local path="$1"
            [ -f "$path" ] && [ ! -L "$path" ] || return 1
            [ "$(/usr/bin/stat -c '%u:%g:%a:%h' "$path")" = 0:0:644:1 ]
          }

          validate_deadline() {
            local epoch="" calendar="" rendered=""
            [ -f "$deadline_file" ] && [ ! -L "$deadline_file" ] || return 1
            [ "$(/usr/bin/stat -c '%u:%g:%a:%h' "$deadline_file")" = \
              0:0:600:1 ] || return 1
            [ "$(/usr/bin/wc -l < "$deadline_file")" -eq 2 ] || return 1
            epoch=$(/usr/bin/sed -n '1p' "$deadline_file") || return 1
            calendar=$(/usr/bin/sed -n '2p' "$deadline_file") || return 1
            [[ "$epoch" =~ ^[1-9][0-9]{9,}$ ]] || return 1
            rendered=$(/usr/bin/date -u -d "@$epoch" \
              '+%Y-%m-%d %H:%M:%S UTC') || return 1
            [ "$calendar" = "$rendered" ]
          }

          validate_unit_hashes() {
            [ -f "$unit_hashes" ] && [ ! -L "$unit_hashes" ] || return 1
            [ "$(/usr/bin/stat -c '%u:%g:%a:%h' "$unit_hashes")" = \
              0:0:600:1 ] || return 1
            /usr/bin/awk -v service="$service_file" -v timer="$timer_file" '
              NR == 1 {
                if ($1 !~ /^[a-f0-9]{64}$/ || $2 != service || NF != 2) exit 1
              }
              NR == 2 {
                if ($1 !~ /^[a-f0-9]{64}$/ || $2 != timer || NF != 2) exit 1
              }
              END { if (NR != 2) exit 1 }
            ' "$unit_hashes" || return 1
            /usr/bin/sha256sum --check --strict "$unit_hashes" >/dev/null
          }

          validate_bundle() {
            validate_directory "$state_dir" 700
            [ -f "$self" ] && [ ! -L "$self" ] || return 1
            [ "$(/usr/bin/stat -c '%u:%g:%a:%h' "$self")" = 0:0:700:1 ] || return 1
            [ "$(/usr/bin/sha256sum "$self" | /usr/bin/awk '{print $1}')" = \
              "$RR_AUDIT_HELPER_SHA" ] || return 1
            [ ! -e "$self_tmp" ] && [ ! -L "$self_tmp" ] || return 1
            [ ! -e "$deadline_tmp" ] && [ ! -L "$deadline_tmp" ] || return 1
            [ ! -e "$unit_hashes_tmp" ] && [ ! -L "$unit_hashes_tmp" ] || return 1
            [ ! -e "$service_tmp" ] && [ ! -L "$service_tmp" ] || return 1
            [ ! -e "$timer_tmp" ] && [ ! -L "$timer_tmp" ] || return 1
            validate_deadline
            validate_unit_file "$service_file"
            validate_unit_file "$timer_file"
            validate_unit_hashes
            [ -L "$timer_link" ]
            [ "$(/usr/bin/readlink -f "$timer_link")" = "$timer_file" ]
          }

          self_disarm() {
            validate_bundle
            /usr/bin/systemctl disable --now "$timer_unit"
            [ ! -e "$timer_link" ] && [ ! -L "$timer_link" ]
            validate_unit_file "$service_file"
            validate_unit_file "$timer_file"
            validate_unit_hashes
            /usr/bin/rm -f -- "$service_file" "$timer_file"
            [ ! -e "$service_file" ] && [ ! -L "$service_file" ]
            [ ! -e "$timer_file" ] && [ ! -L "$timer_file" ]
            /usr/bin/systemctl daemon-reload
            [ "$(/usr/bin/systemctl show -p LoadState --value \
              "$timer_unit")" = not-found ]
            if [ -e "$timer_stamp" ] || [ -L "$timer_stamp" ]; then
              [ -f "$timer_stamp" ] && [ ! -L "$timer_stamp" ]
              [ "$(/usr/bin/stat -c '%u:%g:%h' "$timer_stamp")" = 0:0:1 ]
              /usr/bin/rm -f -- "$timer_stamp"
            fi
            [ ! -e "$timer_stamp" ] && [ ! -L "$timer_stamp" ]
            /usr/bin/rm -f -- "$unit_hashes" "$deadline_file" "$self"
            [ ! -e "$unit_hashes" ] && [ ! -L "$unit_hashes" ]
            [ ! -e "$deadline_file" ] && [ ! -L "$deadline_file" ]
            [ ! -e "$self" ] && [ ! -L "$self" ]
            /usr/bin/rmdir "$state_dir"
            /usr/bin/sync -f /var/lib
          }

          validate_config() {
            local path="$1" expected_sha="$2" size="" actual_sha=""
            [ -f "$path" ] && [ ! -L "$path" ] || return 1
            [ "$(/usr/bin/stat -c '%u:%g:%a:%h' "$path")" = 0:0:600:1 ] || return 1
            size=$(/usr/bin/stat -c %s "$path") || return 1
            [[ "$size" =~ ^[1-9][0-9]*$ ]] || return 1
            [ "$size" -le 262144 ] || return 1
            actual_sha=$(/usr/bin/sha256sum "$path" | /usr/bin/awk '{print $1}') || return 1
            [ "$actual_sha" = "$expected_sha" ] || return 1
            [ "$(/usr/bin/grep -c '^INSTALL_COMPLETE=true$' "$path")" -eq 1 ] || return 1
            [ "$(/usr/bin/grep -c '^NAIVE_ENABLED=true$' "$path")" -eq 1 ] || return 1
            [ "$(/usr/bin/grep -c '^NAIVE_ENABLED=' "$path")" -eq 1 ] || return 1
          }

          assert_unit_state() {
            local unit="$1" expected="$2" load_state="" active_state=""
            local unit_file_state=""
            load_state=$(/usr/bin/systemctl show -p LoadState --value "$unit" \
              2>/dev/null) || return 1
            active_state=$(/usr/bin/systemctl show -p ActiveState --value "$unit" \
              2>/dev/null) || return 1
            unit_file_state=$(/usr/bin/systemctl show -p UnitFileState --value "$unit" \
              2>/dev/null) || return 1
            [ "$load_state:$active_state:$unit_file_state" = "$expected" ]
          }

          wait_local_nexus() {
            local deadline=$((SECONDS + 30))
            while [ "$SECONDS" -lt "$deadline" ]; do
              assert_unit_state rr-nexus.service loaded:active:enabled || return 1
              if /usr/bin/curl -fsS --connect-timeout 1 --max-time 3 \
                   http://127.0.0.1:7900/healthz >/dev/null 2>&1; then
                return 0
              fi
              /usr/bin/sleep 1
            done
            return 1
          }

          [ "$0" = "$self" ]
          [ "$#" -eq 1 ]
          case "$cleanup_mode" in timer|exit) ;; *) exit 1 ;; esac
          [[ "${RR_AUDIT_HELPER_SHA:-}" =~ ^[a-f0-9]{64}$ ]]
          validate_bundle
          deadline_epoch=$(/usr/bin/sed -n '1p' "$deadline_file")
          if [ "$cleanup_mode" = timer ] && \
             [ "$(/usr/bin/date +%s)" -lt "$deadline_epoch" ]; then
            exit 0
          fi
          [ -f "$source_hash" ] && [ ! -L "$source_hash" ]
          [ "$(/usr/bin/stat -c '%u:%g:%a:%h' "$source_hash")" = 0:0:600:1 ]
          [ "$(/usr/bin/wc -c < "$source_hash")" -eq 65 ]
          /usr/bin/grep -Eq '^[a-f0-9]{64}$' "$source_hash"
          expected_source_sha=$(<"$source_hash")
