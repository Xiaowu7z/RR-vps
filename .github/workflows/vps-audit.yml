              printf '%s\n' parent-type
              return 0
            }
            command -v mountpoint >/dev/null 2>&1 || {
              printf '%s\n' parent-mount-check
              return 0
            }
            mountpoint -q -- "$parent" && { printf '%s\n' parent-mount; return 0; }
            canonical=$(readlink -e -- "$parent" 2>/dev/null) || {
              printf '%s\n' parent-canonical
              return 0
            }
            [ "$canonical" = "$parent" ] || { printf '%s\n' parent-canonical; return 0; }
            [ "$(stat -c '%u:%g:%a' -- "$parent" 2>/dev/null)" = 0:0:700 ] || {
              printf '%s\n' parent-meta
              return 0
            }
            [ -f "$marker" ] && [ ! -L "$marker" ] || {
              printf '%s\n' marker-type
              return 0
            }
            [ "$(stat -c '%u:%g:%a:%h' -- "$marker" 2>/dev/null)" = 0:0:600:1 ] || {
              printf '%s\n' marker-meta
