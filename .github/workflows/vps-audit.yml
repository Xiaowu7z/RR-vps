                  [ "$path_identity" = "$descriptor_identity" ] && lock_file_is_safe
                }
                release_firewall_lock() {
                  local path_identity="" descriptor_identity=""
                  [[ "$firewall_lock_fd" =~ ^[0-9]+$ ]] || return 1
                  path_identity=$(stat -Lc '%d:%i:%u:%g:%h' \
