name: Temporary safe VPS pre-clean diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-safe-vps-preclean-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Safe diagnostic · ${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: A
            host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm
          - role: B
            host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A
          - role: C
            host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare SSH client
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/rebuild-bundle.py --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Collect fixed-enum pre-clean evidence
        shell: bash
        env:
          TARGET_HOST: ${{ matrix.role == 'A' && secrets.RR_A_HOST || (matrix.role == 'B' && secrets.RR_B_HOST || secrets.RR_C_HOST) }}
          TARGET_PASS: ${{ matrix.role == 'A' && secrets.RR_A_PASS || (matrix.role == 'B' && secrets.RR_B_PASS || secrets.RR_C_PASS) }}
          TARGET_HOST_KEY: ${{ matrix.host_key }}
          TARGET_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          set +x
          export SSHPASS="$TARGET_PASS"
          host="$TARGET_HOST"
          [[ "$TARGET_ROLE" =~ ^[ABC]$ ]]
          [[ "$TARGET_HOST_KEY" != *$'\n'* ]]
          read -r host_key_type host_key_data host_key_extra <<<"$TARGET_HOST_KEY"
          test "$host_key_type" = ssh-ed25519
          [[ "$host_key_data" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          test -z "$host_key_extra"
          known_hosts="$RUNNER_TEMP/known-hosts-${TARGET_ROLE}"
          (umask 077; printf '%s %s %s\n' "$host" "$host_key_type" "$host_key_data" > "$known_hosts")
          ssh_opts=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts"
          )
          stage=$(sshpass -e ssh "${ssh_opts[@]}" "root@$host" \
            'umask 077; mktemp -d /root/rr-safe-diag.XXXXXX')
          [[ "$stage" =~ ^/root/rr-safe-diag\.[A-Za-z0-9]+$ ]]
          bundle_sha=$(sha256sum rr-bundle.tar.gz | awk '{print $1}')
          sshpass -e scp "${ssh_opts[@]}" -q rr-bundle.tar.gz \
            "root@$host:$stage/rr-bundle.tar.gz"
          sshpass -e ssh "${ssh_opts[@]}" "root@$host" bash -s -- \
            "$TARGET_ROLE" "$stage" "$bundle_sha" <<'REMOTE'
          set -uo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb
          role="$1"
          stage="$2"
          expected_bundle_sha="$3"
          [[ "$role" =~ ^[ABC]$ ]] || exit 2
          [[ "$stage" =~ ^/root/rr-safe-diag\.[A-Za-z0-9]+$ ]] || exit 2
          runtime="$stage/runtime"
          trace="$stage/trace.log"
          product_log="$stage/product.log"
          install -d -m 700 "$runtime" || exit 3
          test "$(sha256sum "$stage/rr-bundle.tar.gz" | awk '{print $1}')" = \
            "$expected_bundle_sha" || exit 3
          tar --no-same-owner --no-same-permissions -xzf \
            "$stage/rr-bundle.tar.gz" -C "$runtime" --strip-components=1 || exit 3
          for module_file in "$runtime"/modules/*.sh; do
            source "$module_file" || exit 3
          done
          safe_object_state() {
            local label="$1" target="$2" state=""
            if [ -L "$target" ]; then state=symlink
            elif [ ! -e "$target" ]; then state=absent
            elif [ -f "$target" ]; then state=regular
            elif [ -d "$target" ]; then state=directory
            else state=other
            fi
            printf 'SAFE_DIAG role=%s object=%s state=%s\n' "$role" "$label" "$state"
          }
          safe_unit_value() {
            local unit="$1" property="$2" value=""
            value=$(systemctl show "$unit" --property="$property" --value 2>/dev/null) || value=query-error
            case "$value" in
              loaded|not-found|masked|active|inactive|failed|activating|deactivating|\
              enabled|disabled|static|indirect|generated|transient|query-error|'') ;;
              *) value=other ;;
            esac
            printf '%s\n' "${value:-empty}"
          }
          safe_object_state launcher /usr/local/bin/rr
          safe_object_state runtime /usr/local/lib/rr
          safe_object_state config /etc/argo_vmess.conf
          safe_object_state active_tx /var/lib/rr-update/active
          safe_object_state maintenance /run/rr-vps/update-maintenance
          safe_object_state restore_active /var/lib/rr-backup/active
          safe_object_state recovery_helper /usr/local/sbin/rr-update-recover
          safe_object_state recovery_unit /etc/systemd/system/rr-update-recovery.service
          for unit in rr-update-recovery.service rr-nexus.service sing-box.service \
            argo-rr-health.timer rr-subscription-quarantine.service; do
            load=$(safe_unit_value "$unit" LoadState)
            active=$(safe_unit_value "$unit" ActiveState)
            enabled=$(safe_unit_value "$unit" UnitFileState)
            printf 'SAFE_DIAG role=%s unit=%s load=%s active=%s enabled=%s\n' \
              "$role" "$unit" "$load" "$active" "$enabled"
          done
          ufw_state=absent
          dpkg-query -W -f='${db:Status-Abbrev}' ufw 2>/dev/null | grep -q '^ii' && ufw_state=installed
          persistence_state=absent
          command -v netfilter-persistent >/dev/null 2>&1 && persistence_state=present
          printf 'SAFE_DIAG role=%s ufw=%s persistence=%s\n' \
            "$role" "$ufw_state" "$persistence_state"
          set +e
          rr_run_with_update_locks direct 5 true >/dev/null 2>&1
          lock_rc=$?
          set -e
          printf 'SAFE_DIAG role=%s lock_probe_rc=%s\n' "$role" "$lock_rc"
          for backend in iptables ip6tables; do
            backend_state=missing
            if command -v "$backend" >/dev/null 2>&1; then
              "$backend" -w 5 -t filter -S INPUT >/dev/null 2>&1
              backend_rc=$?
              [ "$backend_rc" -eq 0 ] && backend_state=ready || backend_state=error
            fi
            printf 'SAFE_DIAG role=%s backend=%s state=%s\n' \
              "$role" "$backend" "$backend_state"
          done
          exec 9>"$trace"
          PS4='+SAFE_TRACE:${BASH_SOURCE[0]##*/}:${LINENO}:${FUNCNAME[0]:-top}: '
          set +e
          (
            BASH_XTRACEFD=9
            set -x
            rr_run_with_update_locks direct 120 uninstall_all_locked
          ) >"$product_log" 2>&1
          uninstall_rc=$?
          set -e
          exec 9>&-
          chmod 600 "$trace" "$product_log"
          printf 'SAFE_DIAG role=%s uninstall_rc=%s\n' "$role" "$uninstall_rc"
          grep -oE 'SAFE_TRACE:[A-Za-z0-9._-]+:[0-9]+:[A-Za-z0-9_+-]+' \
            "$trace" | tail -n 80 | while IFS= read -r token; do
              printf 'SAFE_DIAG role=%s trace=%s\n' "$role" "$token"
            done
          safe_object_state launcher_after /usr/local/bin/rr
          safe_object_state runtime_after /usr/local/lib/rr
          safe_object_state config_after /etc/argo_vmess.conf
          safe_object_state active_tx_after /var/lib/rr-update/active
          safe_object_state maintenance_after /run/rr-vps/update-maintenance
          cleanup_rc=0
          rm -rf -- "$stage" || cleanup_rc=$?
          printf 'SAFE_DIAG role=%s cleanup_rc=%s\n' "$role" "$cleanup_rc"
          exit 0
          REMOTE
