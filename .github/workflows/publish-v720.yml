name: Publish verified v7.2.0

on:
  push:
    branches: [audit/stability-20260907]
    paths: [.github/workflows/publish-v720.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: finalize-v720
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/audit/stability-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the existing publisher after both exact main checks
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 23c9c86a103c7acbd7c4f9709ab527ccdf804adc
        run: |
          set -euo pipefail
          api="/repos/$GITHUB_REPOSITORY"
          current=$(gh api "$api/git/ref/heads/main" --jq '.object.sha')
          [ "$current" = "$EXPECTED_SHA" ] || exit 0
          version=$(gh api "$api/contents/version?ref=$EXPECTED_SHA" --jq '.content' | base64 -d | head -n 1)
          [ "$version" = 'RR-vps 7.2.0' ] || exit 0
          for workflow in ci.yml vps-stability.yml; do
            runs=$(gh api "$api/actions/workflows/$workflow/runs?branch=main&event=push&head_sha=$EXPECTED_SHA&per_page=100")
            if ! jq -e --arg sha "$EXPECTED_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")]
              | sort_by([.run_number,.run_attempt]) | last
              | .status == "completed" and .conclusion == "success"
            ' <<<"$runs" >/dev/null; then
              echo 'Waiting for both main checks.'
              exit 0
            fi
          done
          # The publisher independently rechecks main, complete run inventories,
          # immutable-release settings and asset ownership before every mutation.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "sha=$EXPECTED_SHA"
          gh api --method PUT "$api/actions/workflows/publish-v720.yml/disable"
