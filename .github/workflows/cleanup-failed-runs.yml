name: Cleanup failed Actions history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-failed-runs.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let deleted = 0;

            for (let batch = 0; batch < 10; batch += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                status: "failure",
                per_page: 100,
                page: 1,
              });

              if (data.workflow_runs.length === 0) {
                core.info(`Deleted ${deleted} failed workflow runs.`);
                return;
              }

              for (const run of data.workflow_runs) {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted += 1;
              }
            }

            core.setFailed(`Cleanup stopped after 10 batches; deleted ${deleted} runs.`);
