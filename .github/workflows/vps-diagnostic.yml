# Temporary, structured diagnostic for the 7.1.1 B/C audit failures.
name: VPS diagnostic

on:
  push:
    branches:
      - audit/vps-diagnostic-v711

permissions:
  actions: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RR_B_HOST: ${{ secrets.RR_B_HOST }}
      RR_B_PASS: ${{ secrets.RR_B_PASS }}
      RR_C_HOST: ${{ secrets.RR_C_HOST }}
      RR_C_PASS: ${{ secrets.RR_C_PASS }}
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Run structured B and C probes
        shell: bash
        run: |
          set -uo pipefail
          set +x
          pin_b='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A'
          pin_c='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3'

          run_remote() {
            local label="$1" host="$2" pass="$3" pin="$4" known="" rc=0
            known="$RUNNER_TEMP/diagnostic-known-hosts-$label"
            (umask 077; printf '%s %s\n' "$host" "$pin" > "$known")
            export SSHPASS="$pass"
            sshpass -e ssh \
              -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2 \
              -o LogLevel=ERROR -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519 \
              -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
              -o UserKnownHostsFile="$known" "root@$host" bash -s -- "$label" <<'REMOTE'
          set +e
          set -o pipefail
          label="$1"

          result() {
            local prefix="$1" name="$2" rc=0
            shift 2
            "$@" >/dev/null 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              printf '%s_ASSERT name=%s result=pass\n' "$prefix" "$name"
            else
              printf '%s_ASSERT name=%s result=fail rc=%s\n' "$prefix" "$name" "$rc"
            fi
          }

          unit_state() {
            local prefix="$1" unit="$2" load="" active="" enabled=""
            load=$(systemctl show -p LoadState --value "$unit" 2>/dev/null || printf query-error)
            active=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null || printf query-error)
            enabled=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null || printf query-error)
            if [ "$load" = not-found ] && [ -z "$enabled" ]; then enabled=not-found; fi
            printf '%s_UNIT name=%s state=%s:%s:%s\n' "$prefix" "$unit" "$load" "$active" "$enabled"
          }

          source_live_modules() {
            local module_file=""
            for module_file in /usr/local/lib/rr/modules/*.sh; do
              [ -f "$module_file" ] || return 1
              # shellcheck disable=SC1090
              source "$module_file" || return 1
            done
          }

          probe_version_711() {
            /usr/local/bin/rr --version 2>/dev/null | grep -Fx 'RR-vps 7.1.1'
          }

          probe_manifest() {
            local expected_rr=""
            expected_rr=$(awk '$2 == "rr" {print $1}' /usr/local/lib/rr/manifest.sha256) || return 1
            [ -n "$expected_rr" ] || return 1
            [ "$(sha256sum /usr/local/bin/rr | awk '{print $1}')" = "$expected_rr" ] || return 1
            (
              cd /usr/local/lib/rr || exit 1
              awk '$2 != "rr"' manifest.sha256 | sha256sum -c -
            )
          }

          probe_subscription() {
            source_live_modules || return 1
            subscription_server_running
          }

          probe_pid_file() {
            local pid=""
            [ -s /run/rr-vps-subscription.pid ] || return 1
            [ ! -L /run/rr-vps-subscription.pid ] || return 1
            pid=$(cat /run/rr-vps-subscription.pid) || return 1
            [[ "$pid" =~ ^[0-9]+$ ]] || return 1
            kill -0 "$pid"
          }

          if [ "$label" = B ]; then
            printf 'B_STATE stage=%s\n' "$(cat /root/rr-audit-stage 2>/dev/null || printf absent)"
            result B version probe_version_711
            result B manifest probe_manifest
            result B singbox-check /usr/local/bin/sing-box check -c /etc/sing-box/config.json
            for unit in sing-box.service rr-nexus.service nginx.service argo-rr-health.timer; do
              unit_state B "$unit"
            done
            result B subscription-running probe_subscription
            result B subscription-pid probe_pid_file

            b_subscription_config() {
              grep -qx 'SUB_ACCESS_MODE=local' /etc/argo_vmess.conf || return 1
              grep -qx 'SUB_DOMAIN=' /etc/argo_vmess.conf
            }
            b_subscription_bind() {
              local port="" bind="" mode="" domain="" ignored=""
              IFS='|' read -r port bind mode domain ignored < /run/rr-vps-subscription.bind || return 1
              [ "$port" = 18081 ] && [ "$bind" = 127.0.0.1 ] && \
                [ "$mode" = local ] && [ -z "$domain" ]
            }
            b_firewall_closed() {
              source_live_modules || return 1
              rr_validate_protocol_firewall 18081 tcp closed
            }
            b_db_quickcheck() {
              [ "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA quick_check;')" = ok ]
            }
            b_db_foreign_keys() {
              [ -z "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA foreign_key_check;')" ]
            }
            b_device_count() {
              [ "$(sqlite3 /var/lib/rr-nexus/nexus.db 'SELECT COUNT(*) FROM devices;')" = 1 ]
            }
            b_device_exact() {
              local actual="" before=""
              [ -s /root/rr-audit-before-device.txt ] || return 1
              actual=$(sqlite3 -separator '|' /var/lib/rr-nexus/nexus.db \
                "SELECT id,name,credential,subscription_token,enabled,quota_bytes,
                        used_bytes,uploaded_bytes,downloaded_bytes,traffic_updated_at,
                        COALESCE(group_id,'<NULL>'),expires_at,next_reset_at,
                        reset_anchor_day,reset_max,reset_count,created_at,updated_at
                   FROM devices WHERE id='dev_a1b2c3d4e5f6';") || return 1
              before=$(cat /root/rr-audit-before-device.txt) || return 1
              [ "$actual" = "$before" ]
            }
            b_protocol_config_exact() {
              local key="" before="" after=""
              for key in UUID PORT SUB_PORT SUB_PUBLIC_PORT_IPV4 SUB_PUBLIC_PORT_IPV6 \
                VM_ENABLED VM_TLS_ENABLED VL_ENABLED VL_PORT \
                HY2_ENABLED HY2_PORT HY2_HOP_PORTS HY2_HOP_INTERVAL TU5_ENABLED TU5_PORT \
                TU5_HOP_PORTS AN_ENABLED AN_PORT NAIVE_ENABLED PRIVATE_KEY PUBLIC_KEY \
                SHORT_ID CERT_SHA256; do
                before=$(grep -m1 "^${key}=" /root/rr-audit-before.conf) || return 1
                after=$(grep -m1 "^${key}=" /etc/argo_vmess.conf) || return 1
                [ "$before" = "$after" ] || return 1
              done
            }
            b_nexus_config_exact() {
              jq -cS '{mode,listen,port,domain,stats_port,ssh_host,public_port,traffic_mode}' \
                /etc/rr-nexus/nexus.json | cmp -s /root/rr-audit-before-nexus-stable.json -
            }
            b_panel_health() {
              local port=""
              port=$(jq -r '.public_port' /etc/rr-nexus/nexus.json) || return 1
              [[ "$port" =~ ^[0-9]+$ ]] || return 1
              curl -kfsS --connect-timeout 5 --max-time 15 \
                "https://127.0.0.1:${port}/healthz"
            }

            result B subscription-config b_subscription_config
            result B subscription-bind b_subscription_bind
            result B firewall-closed b_firewall_closed
            result B db-quickcheck b_db_quickcheck
            result B db-foreign-keys b_db_foreign_keys
            result B device-count b_device_count
            result B device-exact b_device_exact
            result B protocol-config-exact b_protocol_config_exact
            result B nexus-config-exact b_nexus_config_exact
            result B panel-health b_panel_health

            for certificate_path in /etc/rr-nexus/certs/ip.crt /etc/rr-nexus/certs/ip.key; do
              certificate_state=absent
              if [ -e "$certificate_path" ] || [ -L "$certificate_path" ]; then
                certificate_state=$(stat -c '%u:%g:%a:%h' -- "$certificate_path" 2>/dev/null || printf unsafe)
              fi
              printf 'B_CERT name=%s metadata=%s\n' "${certificate_path##*/}" "$certificate_state"
            done
            if [ -x /usr/local/sbin/rr-update-recover ]; then
              status_json=$(/usr/local/sbin/rr-update-recover status 2>/dev/null)
              status_rc=$?
              if [ "$status_rc" -eq 0 ]; then
                printf 'B_TX active=%s phase=%s format=%s settled=%s\n' \
                  "$(jq -r '.active // false' <<<"$status_json")" \
                  "$(jq -r '.phase // "none"' <<<"$status_json")" \
                  "$(jq -r '.format // "none"' <<<"$status_json")" \
                  "$(jq -r '.committed_settled // false' <<<"$status_json")"
              else
                printf 'B_TX status=query-failed rc=%s\n' "$status_rc"
              fi
            fi

            cleanup_rc=0
            if [ -d /usr/local/lib/rr/modules ]; then
              printf 'y\n' | bash -c '
                set -o pipefail
                for module_file in /usr/local/lib/rr/modules/*.sh; do
                  # shellcheck disable=SC1090
                  source "$module_file"
                done
                uninstall_all
              ' >/root/rr-diagnostic-uninstall.log 2>&1
              cleanup_rc=$?
            fi
            if [ "$cleanup_rc" -ne 0 ] || [ -e /var/lib/rr-nexus ] || [ -e /etc/rr-nexus ]; then
              systemctl disable --now rr-nexus.service >/dev/null 2>&1 || true
              rm -f -- /etc/systemd/system/rr-nexus.service \
                /etc/nginx/sites-enabled/rr-nexus-ip.conf \
                /etc/nginx/sites-available/rr-nexus-ip.conf
              rm -rf -- /var/lib/rr-nexus /etc/rr-nexus
              systemctl daemon-reload >/dev/null 2>&1 || true
            fi
            rm -f -- /root/rr-audit-panel-pass /root/rr-diagnostic-uninstall.log
            find /root -maxdepth 1 -type f -name 'rr-audit-*.log' -delete 2>/dev/null || true
            if [ ! -e /var/lib/rr-nexus ] && [ ! -L /var/lib/rr-nexus ] && \
               [ ! -e /etc/rr-nexus ] && [ ! -L /etc/rr-nexus ] && \
               ! systemctl is-active --quiet rr-nexus.service; then
              printf 'B_CLEANUP credentials=revoked\n'
            else
              printf 'B_CLEANUP credentials=revocation-failed\n'
            fi
            exit 0
          fi

          if [ "$label" = C ]; then
            result C version probe_version_711
            result C manifest probe_manifest
            for unit in sing-box.service rr-nexus.service nginx.service \
              argo-rr-health.timer rr-update-recovery.service; do
              unit_state C "$unit"
            done
            result C subscription-running probe_subscription
            result C subscription-pid probe_pid_file

            c_db_quickcheck() {
              [ "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA quick_check;')" = ok ]
            }
            c_db_foreign_keys() {
              [ -z "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA foreign_key_check;')" ]
            }
            c_panel_health() {
              curl -fsS --connect-timeout 5 --max-time 15 http://127.0.0.1:7900/healthz
            }
            c_no_protocols() {
              source_live_modules || return 1
              ! any_node_protocol_enabled
            }
            result C db-quickcheck c_db_quickcheck
            result C db-foreign-keys c_db_foreign_keys
            result C panel-health c_panel_health
            result C no-protocols c_no_protocols

            active_state=absent
            active_tx=""
            if [ -f /var/lib/rr-update/active ] && [ ! -L /var/lib/rr-update/active ]; then
              active_tx=$(cat /var/lib/rr-update/active 2>/dev/null)
              case "$active_tx" in
                /var/lib/rr-update/transactions/*)
                  if [ -d "$active_tx" ] && [ ! -L "$active_tx" ] && \
                     [ "$(readlink -f "$active_tx" 2>/dev/null)" = "$active_tx" ]; then
                    active_state=trusted
                  else
                    active_state=unsafe
                  fi
                  ;;
                *) active_state=unsafe ;;
              esac
            elif [ -e /var/lib/rr-update/active ] || [ -L /var/lib/rr-update/active ]; then
              active_state=unsafe
            fi
            printf 'C_TX active=%s\n' "$active_state"
            if [ "$active_state" = trusted ]; then
              printf 'C_TX_DETAIL name=%s format=%s phase=%s settled=%s old_runtime=%s\n' \
                "${active_tx##*/}" \
                "$(cat "$active_tx/transaction-format" 2>/dev/null || printf absent)" \
                "$(cat "$active_tx/phase" 2>/dev/null || printf absent)" \
                "$([ -f "$active_tx/committed-settled" ] && printf present || printf absent)" \
                "$([ -e "$active_tx/old-runtime" ] && printf present || printf absent)"
              for marker in writer_state_complete subscription_was_running; do
                marker_state=absent
                if [ -e "$active_tx/backup/$marker" ] || [ -L "$active_tx/backup/$marker" ]; then
                  marker_state=$(stat -c '%u:%g:%a:%h' "$active_tx/backup/$marker" 2>/dev/null || printf unsafe)
                fi
                printf 'C_MARKER name=%s metadata=%s\n' "$marker" "$marker_state"
              done
              c_external_verify() {
                /usr/local/sbin/rr-update-external-state verify "$active_tx/backup" \
                  --tx-root /var/lib/rr-update
              }
              result C external-verify c_external_verify
            fi

            maintenance_state=absent
            if [ -f /run/rr-vps/update-maintenance ] && \
               [ ! -L /run/rr-vps/update-maintenance ]; then
              maintenance_state=present
              if [ "$active_state" = trusted ] && \
                 [ "$(cat /run/rr-vps/update-maintenance 2>/dev/null)" = "$active_tx" ]; then
                maintenance_state=strict-match
              fi
            elif [ -e /run/rr-vps/update-maintenance ] || \
                 [ -L /run/rr-vps/update-maintenance ]; then
              maintenance_state=unsafe
            fi
            printf 'C_STATE maintenance=%s runtime_marker=%s\n' \
              "$maintenance_state" \
              "$([ -f /usr/local/lib/rr/.rr-audit-runtime-instance ] && printf present || printf absent)"
            printf 'C_RECOVERY result=%s exit_status=%s\n' \
              "$(systemctl show rr-update-recovery.service -p Result --value 2>/dev/null || printf query-error)" \
              "$(systemctl show rr-update-recovery.service -p ExecMainStatus --value 2>/dev/null || printf query-error)"

            for log in /root/rr-audit-crash-old-runtime.log \
              /root/rr-audit-between-crashes.log \
              /root/rr-audit-crash-runtime-swapped.log; do
              [ -f "$log" ] || continue
              printf 'C_LOG name=%s size=%s mtime=%s lines=%s\n' \
                "${log##*/}" \
                "$(stat -c %s "$log" 2>/dev/null || printf unknown)" \
                "$(stat -c %Y "$log" 2>/dev/null || printf unknown)" \
                "$(wc -l < "$log" 2>/dev/null || printf unknown)"
              grep -Eqi '模块化热更新完成|modular update completed' "$log" && \
                printf 'C_LOG_EVENT name=%s event=install-complete\n' "${log##*/}"
              grep -Eqi '订阅.*恢复.*失败|subscription.*(restore|resume).*(failed|failure)' "$log" && \
                printf 'C_LOG_EVENT name=%s event=subscription-restore-failed\n' "${log##*/}"
              grep -Eqi 'writer.*(failed|failure)|写入.*失败' "$log" && \
                printf 'C_LOG_EVENT name=%s event=writer-verify-failed\n' "${log##*/}"
              grep -Eqi '恢复.*完成|recovery.*complete' "$log" && \
                printf 'C_LOG_EVENT name=%s event=recovery-complete\n' "${log##*/}"
              grep -Eqi '(^|[^[:alpha:]])(error|failed|failure|fatal)([^[:alpha:]]|$)|失败|错误' "$log" && \
                printf 'C_LOG_EVENT name=%s event=error-present\n' "${log##*/}"
            done
            exit 0
          fi
          REMOTE
            rc=$?
            unset SSHPASS
            printf 'REMOTE_PROBE slot=%s rc=%s\n' "$label" "$rc"
            return "$rc"
          }

          run_remote B "$RR_B_HOST" "$RR_B_PASS" "$pin_b" || true
          run_remote C "$RR_C_HOST" "$RR_C_PASS" "$pin_c" || true

      - name: Delete superseded diagnostic run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/33315223851")
          case "$status" in
            204|404) printf 'DIAGNOSTIC_RUN_CLEANUP result=complete\n' ;;
            *) printf 'DIAGNOSTIC_RUN_CLEANUP result=failed status=%s\n' "$status"; exit 1 ;;
          esac
