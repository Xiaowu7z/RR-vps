name: VPS diagnostic

on:
  push:
    branches:
      - audit/vps-diagnostic-v711

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RR_A_HOST: ${{ secrets.RR_A_HOST }}
      RR_A_PASS: ${{ secrets.RR_A_PASS }}
      RR_B_HOST: ${{ secrets.RR_B_HOST }}
      RR_B_PASS: ${{ secrets.RR_B_PASS }}
      RR_C_HOST: ${{ secrets.RR_C_HOST }}
      RR_C_PASS: ${{ secrets.RR_C_PASS }}
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Collect sanitized audit evidence
        shell: bash
        run: |
          set -uo pipefail
          set +x
          pin_a='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm'
          pin_b='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A'
          pin_c='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3'
          probe() {
            local label="$1" host="$2" pass="$3" pin="$4" known=""
            known="$RUNNER_TEMP/diagnostic-known-hosts-$label"
            (umask 077; printf '%s %s\n' "$host" "$pin" > "$known")
            export SSHPASS="$pass"
            sshpass -e ssh \
              -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2 \
              -o LogLevel=ERROR -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519 \
              -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
              -o UserKnownHostsFile="$known" "root@$host" bash -s -- "$label" <<'REMOTE'
          set -uo pipefail
          label="$1"
          . /etc/os-release
          rr_version=absent
          [ ! -x /usr/local/bin/rr ] || \
            rr_version=$(/usr/local/bin/rr --version 2>/dev/null | head -n 1 || true)
          stage=$(cat /root/rr-audit-stage 2>/dev/null || printf none)
          printf 'AUTH_OK slot=%s os=%s version=%s rr=%s stage=%s\n' \
            "$label" "$ID" "$VERSION_ID" "$rr_version" "$stage"
          if [ "$label" = C ]; then
            for path in /usr/local/bin/rr /usr/local/lib/rr \
              /var/lib/rr-update/active /run/rr-vps/update-maintenance; do
              if [ -e "$path" ] || [ -L "$path" ]; then
                printf 'PATH_STATE slot=C path=%s stat=%s target=%s\n' \
                  "$path" "$(stat -c '%F:%U:%G:%a:%s:%h' "$path" 2>/dev/null || true)" \
                  "$(readlink "$path" 2>/dev/null || true)"
              else
                printf 'PATH_STATE slot=C path=%s state=absent\n' "$path"
              fi
            done
            for tx in /var/lib/rr-update/transactions/*; do
              [ -d "$tx" ] || continue
              printf 'TX_STATE slot=C tx=%s phase=%s format=%s\n' \
                "${tx##*/}" "$(cat "$tx/phase" 2>/dev/null || printf missing)" \
                "$(cat "$tx/transaction-format" 2>/dev/null || printf missing)"
            done
          fi
          if [ "$label" = A ]; then
            probe_http() {
              local kind="$1" url="$2" code="" rc=0
              if code=$(curl -sS -L --proto '=https' --proto-redir '=https' \
                --tlsv1.2 --connect-timeout 10 --max-time 40 \
                -o /dev/null --write-out '%{http_code}' "$url"); then
                rc=0
              else
                rc=$?
              fi
              printf 'HTTP_PROBE slot=A kind=%s rc=%s code=%s\n' \
                "$kind" "$rc" "$code"
            }
            probe_http upstream-api \
              'https://api.github.com/repos/SagerNet/sing-box/releases/latest'
            probe_http exact-api \
              'https://api.github.com/repos/Xiaowu7z/RR-vps/releases/tags/rr-nexus-core-v1.13.20-r1'
            probe_http exact-page \
              'https://github.com/Xiaowu7z/RR-vps/releases/tag/rr-nexus-core-v1.13.20-r1'
            if [ -d /usr/local/lib/rr/modules ]; then
              for module_file in /usr/local/lib/rr/modules/*.sh; do
                # shellcheck disable=SC1090
                source "$module_file"
              done
              probe_root=$(mktemp -d /root/rr-nexus-probe.XXXXXX)
              mkdir -m 700 "$probe_root/download"
              if nexus_validate_pinned_core_constants; then
                constants_rc=0
              else
                constants_rc=$?
              fi
              if nexus_fetch_traffic_core_release "$probe_root/release.json" \
                >/dev/null 2>&1; then
                fetch_rc=0
              else
                fetch_rc=$?
              fi
              if nexus_download_traffic_core "$probe_root/download" \
                >/dev/null 2>&1; then
                download_rc=0
              else
                download_rc=$?
              fi
              printf 'NEXUS_PROBE slot=A product=%s arch=%s constants=%s fetch=%s download=%s\n' \
                "${SCRIPT_VERSION:-unset}" "${SYS_ARCH:-unset}" \
                "$constants_rc" "$fetch_rc" "$download_rc"
              rm -rf "$probe_root"
            fi
          fi
          for unit in sing-box.service rr-nexus.service nginx.service \
            rr-subscription-quarantine.service argo-rr-health.timer; do
            load=$(systemctl show -p LoadState --value "$unit" 2>/dev/null || true)
            active=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null || true)
            enabled=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null || true)
            printf 'UNIT slot=%s name=%s state=%s:%s:%s\n' \
              "$label" "$unit" "$load" "$active" "$enabled"
          done
          for port in 8443 10443 18080 18081 21443 22443 24443 28443; do
            pids=$(ss -H -ltnp "sport = :${port}" 2>/dev/null |
              sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | sort -u)
            [ -n "$pids" ] || continue
            for pid in $pids; do
              comm=$(ps -p "$pid" -o comm= 2>/dev/null || true)
              exe=$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)
              cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)
              printf 'PORT_OWNER slot=%s port=%s pid=%s comm=%s exe=%s cwd=%s\n' \
                "$label" "$port" "$pid" "$comm" "$exe" "$cwd" |
                sed -E 's#[[:alnum:]_+/=-]{24,}#<token>#g'
            done
          done
          while IFS= read -r log_file; do
            base=$(basename "$log_file")
            size=$(stat -c %s "$log_file" 2>/dev/null || printf 0)
            lines=$(wc -l < "$log_file" 2>/dev/null || printf 0)
            printf 'LOG_META slot=%s file=%s size=%s lines=%s\n' \
              "$label" "$base" "$size" "$lines"
            grep -Eai 'error|failed|failure|invalid|missing|not found|unable|timeout|denied|refus|404|403|traceback|exception|失败|错误|拒绝' \
              "$log_file" 2>/dev/null | tail -n 16 |
              sed -E \
                -e 's#https?://[^[:space:]]+#<url>#g' \
                -e 's#([[:alnum:]_-]+\.)+[[:alpha:]]{2,}#<domain>#g' \
                -e 's#([0-9]{1,3}\.){3}[0-9]{1,3}#<ip>#g' \
                -e 's#[[:alnum:]_+/=-]{24,}#<token>#g' |
              grep -Eiv 'password|passwd|密码|uuid|secret|credential|authorization|用户名|username|订阅地址|subscription[ _-]?url' |
              while IFS= read -r line; do
                printf 'LOG_ERROR slot=%s file=%s text=%s\n' "$label" "$base" "$line"
              done
          done < <(find /root -maxdepth 1 -type f -name 'rr-audit-*.log' -print | sort)
          if [ "$label" = C ]; then
            for base in rr-audit-crash-old-runtime.log \
              rr-audit-between-crashes.log; do
              log_file="/root/$base"
              [ -f "$log_file" ] || continue
              sed -E \
                -e 's#https?://[^[:space:]]+#<url>#g' \
                -e 's#([[:alnum:]_-]+\.)+[[:alpha:]]{2,}#<domain>#g' \
                -e 's#([0-9]{1,3}\.){3}[0-9]{1,3}#<ip>#g' \
                -e 's#[[:alnum:]_+/=-]{24,}#<token>#g' "$log_file" |
                grep -Eiv 'password|passwd|密码|uuid|secret|credential|authorization|用户名|username|恢复码|订阅地址|subscription[ _-]?url' |
                tail -n 80 |
                while IFS= read -r line; do
                  printf 'RECOVERY_DETAIL slot=C file=%s text=%s\n' "$base" "$line"
                done
            done
          fi
          exit 0
          REMOTE
            rc=$?
            unset SSHPASS
            if [ "$rc" -ne 0 ]; then
              printf 'PROBE_FAILED slot=%s rc=%s\n' "$label" "$rc"
            fi
          }
          probe A "$RR_A_HOST" "$RR_A_PASS" "$pin_a"
          probe B "$RR_B_HOST" "$RR_B_PASS" "$pin_b"
          probe C "$RR_C_HOST" "$RR_C_PASS" "$pin_c"
