name: VPS diagnostic

on:
  push:
    branches:
      - audit/vps-diagnostic-v711

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RR_A_HOST: ${{ secrets.RR_A_HOST }}
      RR_A_PASS: ${{ secrets.RR_A_PASS }}
      RR_B_HOST: ${{ secrets.RR_B_HOST }}
      RR_B_PASS: ${{ secrets.RR_B_PASS }}
      RR_C_HOST: ${{ secrets.RR_C_HOST }}
      RR_C_PASS: ${{ secrets.RR_C_PASS }}
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Collect non-sensitive failure evidence
        shell: bash
        run: |
          set -uo pipefail
          set +x
          set +e
          pin_a='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm'
          pin_b='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A'
          pin_c='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3'
          probe() {
            local label="$1" host="$2" pass="$3" pin="$4" known output rc
            known="$RUNNER_TEMP/diagnostic-known-hosts-$label"
            (umask 077; printf '%s %s\n' "$host" "$pin" > "$known")
            export SSHPASS="$pass"
            output=$(sshpass -e ssh               -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2               -o LogLevel=ERROR -o PreferredAuthentications=password               -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519               -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null               -o UserKnownHostsFile="$known" "root@$host" bash -s -- "$label" <<'REMOTE'
          set -uo pipefail
          label="$1"
          . /etc/os-release
          rr_version=absent
          if [ -x /usr/local/bin/rr ]; then
            rr_version=$(/usr/local/bin/rr --version 2>/dev/null | head -n 1 || true)
          fi
          printf 'AUTH_OK slot=%s os=%s version=%s arch=%s pid1=%s rr=%s\n'             "$label" "$ID" "$VERSION_ID" "$(uname -m)"             "$(ps -p 1 -o comm= | tr -d '[:space:]')" "$rr_version"
          for unit in sing-box.service rr-nexus.service nginx.service             rr-subscription-quarantine.service argo-rr-health.timer; do
            load=$(systemctl show -p LoadState --value "$unit" 2>/dev/null || true)
            active=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null || true)
            enabled=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null || true)
            printf 'UNIT slot=%s name=%s state=%s:%s:%s\n'               "$label" "$unit" "$load" "$active" "$enabled"
          done
          while IFS= read -r log_file; do
            base=$(basename "$log_file")
            size=$(stat -c %s "$log_file" 2>/dev/null || printf 0)
            lines=$(wc -l < "$log_file" 2>/dev/null || printf 0)
            printf 'LOG_META slot=%s file=%s size=%s lines=%s\n'               "$label" "$base" "$size" "$lines"
            grep -Eai 'error|failed|failure|invalid|missing|not found|unable|timeout|denied|refus|traceback|exception|失败|错误|拒绝'               "$log_file" 2>/dev/null | tail -n 12 |
              sed -E                 -e 's#https?://[^[:space:]]+#<url>#g'                 -e 's#([[:alnum:]_-]+\.)+[[:alpha:]]{2,}#<domain>#g'                 -e 's#[[:alnum:]_+/=-]{32,}#<token>#g' |
              while IFS= read -r line; do
                printf 'LOG_ERROR slot=%s file=%s text=%s\n' "$label" "$base" "$line"
              done
          done < <(find /root -maxdepth 1 -type f -name 'rr-audit-*.log' -print | sort)
          case "$label" in
            A) detail_logs="rr-audit-nexus.log rr-audit-ufw-enable.log" ;;
            B) detail_logs="rr-audit-upgrade.log rr-audit-old-deps.log rr-audit-old-nexus.log" ;;
            C) detail_logs="rr-audit-clean-install.log rr-audit-clean-rollback.log rr-audit-idempotent.log rr-audit-idempotent-rollback.log rr-audit-framework.log rr-audit-deps.log" ;;
            *) detail_logs="" ;;
          esac
          for base in $detail_logs; do
            log_file="/root/$base"
            [ -f "$log_file" ] || continue
            sed -E               -e 's#https?://[^[:space:]]+#<url>#g'               -e 's#([[:alnum:]_-]+\.)+[[:alpha:]]{2,}#<domain>#g'               -e 's#([0-9]{1,3}\.){3}[0-9]{1,3}#<ip>#g'               -e 's#[[:alnum:]_+/=-]{24,}#<token>#g' "$log_file" |
              grep -Eiv 'password|passwd|密码|uuid|secret|credential|authorization|用户名|username|订阅地址|subscription[ _-]?url' |
              tail -n 160 |
              while IFS= read -r line; do
                printf 'LOG_DETAIL slot=%s file=%s text=%s\n' "$label" "$base" "$line"
              done
          done
          exit 0
          REMOTE
            )
            rc=$?
            unset SSHPASS
            printf '%s\n' "$output"
            if [ "$rc" -ne 0 ]; then
              printf 'PROBE_FAILED slot=%s rc=%s\n' "$label" "$rc"
              return 0
            fi
          }
          probe A "$RR_A_HOST" "$RR_A_PASS" "$pin_a"
          probe B "$RR_B_HOST" "$RR_B_PASS" "$pin_b"
          probe C "$RR_C_HOST" "$RR_C_PASS" "$pin_c"
