name: VPS release audit diagnosis

on:
  push:
    branches:
      - audit/fix-v720-ip-acme-final
    paths:
      - .github/workflows/vps-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Read and sanitize retained root logs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RR_A_HOST: ${{ secrets.RR_A_HOST }}
      RR_A_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm
      RR_A_PASS: ${{ secrets.RR_A_PASS }}
      RR_B_HOST: ${{ secrets.RR_B_HOST }}
      RR_B_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A
      RR_B_PASS: ${{ secrets.RR_B_PASS }}
      RR_C_HOST: ${{ secrets.RR_C_HOST }}
      RR_C_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNn4M3kE0+DoV//4xOYwweoLnTrwS+bJmmD6pK4ios3
      RR_C_PASS: ${{ secrets.RR_C_PASS }}
    steps:
      - name: Prepare SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Collect structured, redacted evidence
        shell: bash
        run: |
          set -uo pipefail
          set +x

          diagnose_host() {
            local label="$1" host="$2" password="$3" host_key="$4"
            local known_hosts="$RUNNER_TEMP/known-hosts-${label}"
            local host_key_type="" host_key_data="" host_key_extra=""
            local rc=0

            if [ -z "$host" ] || [ -z "$password" ] || [ -z "$host_key" ]; then
              printf 'DIAG_HOST label=%s result=missing-secret\n' "$label"
              return 1
            fi
            if [[ "$host_key" == *$'\n'* ]]; then
              printf 'DIAG_HOST label=%s result=invalid-host-key\n' "$label"
              return 1
            fi
            read -r host_key_type host_key_data host_key_extra <<<"$host_key"
            if [ "$host_key_type" != ssh-ed25519 ] ||
               [[ ! "$host_key_data" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] ||
               [ -n "$host_key_extra" ]; then
              printf 'DIAG_HOST label=%s result=invalid-host-key\n' "$label"
              return 1
            fi
            (umask 077; printf '%s %s %s\n' "$host" "$host_key_type" \
              "$host_key_data" > "$known_hosts")
            export SSHPASS="$password"

            printf 'DIAG_HOST label=%s result=start\n' "$label"
            sshpass -e ssh \
              -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2 \
              -o LogLevel=ERROR -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519 \
              -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
              -o UserKnownHostsFile="$known_hosts" "root@$host" \
              python3 - "$label" <<'PY' || rc=$?
          import glob
          import hashlib
          import os
          import re
          import subprocess
          import sys

          label = sys.argv[1]
          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          sensitive_line = re.compile(
              r"(?i)(secret|(?:^|[^A-Za-z])pass(?:word|wd)?(?:[^A-Za-z]|$)|"
              r"authorization|cookie|private[_ -]?key|api[_ -]?key|token|"
              r"credential|密码|口令|令牌|凭据|私钥|密钥)"
          )
          relevant = re.compile(
              r"(?i)(fail|error|unable|invalid|denied|timeout|not found|"
              r"curl:|wget:|http/[0-9]| 40[134]| 50[0-9]|checksum|digest|"
              r"release|immutable|download|sing-box|nexus|systemctl|dpkg|apt|"
              r"rollback|transaction|lock|manifest|sha256|certificate)"
          )
          url = re.compile(r"(?i)https?://[^\s\"'<>]+")
          email = re.compile(
              r"(?i)(?<![A-Za-z0-9.!#$%&'*+/=?^_`{|}~-])"
              r"[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@"
              r"[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+(?![A-Za-z0-9-])"
          )
          fqdn = re.compile(
              r"(?i)(?<![A-Za-z0-9_-])"
              r"(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+"
              r"[A-Za-z]{2,63}(?![A-Za-z0-9_-])"
          )
          ipv4 = re.compile(r"(?<![0-9])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![0-9])")
          ipv6 = re.compile(r"(?i)(?<![0-9a-f])(?:[0-9a-f]{0,4}:){2,7}[0-9a-f]{0,4}(?![0-9a-f])")
          uuid = re.compile(r"(?i)(?<![0-9a-f])[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}(?![0-9a-f])")
          long_secret = re.compile(r"(?<![A-Za-z0-9+/])[A-Za-z0-9+/=_-]{20,}(?![A-Za-z0-9+/])")
          sub_path = re.compile(r"(?i)/(?:api/subscription|sub)/[^\s\"'<>]+")
          expected_logs = {
              "rr-audit-710-uninstall.log",
              "rr-audit-between-crashes.log",
              "rr-audit-candidate-preclean.log",
              "rr-audit-clean-install.log",
              "rr-audit-clean-rollback.log",
              "rr-audit-core.log",
              "rr-audit-crash-old-runtime.log",
              "rr-audit-crash-runtime-swapped.log",
              "rr-audit-cross-backup.log",
              "rr-audit-cross-firewall-validate.log",
              "rr-audit-cross-restore.log",
              "rr-audit-cross-sync.log",
              "rr-audit-deps.log",
              "rr-audit-framework.log",
              "rr-audit-idempotent-rollback.log",
              "rr-audit-idempotent.log",
              "rr-audit-install.log",
              "rr-audit-ip-acme.log",
              "rr-audit-manual-rollback.log",
              "rr-audit-nexus.log",
              "rr-audit-old-core.log",
              "rr-audit-old-deps.log",
              "rr-audit-old-install.log",
              "rr-audit-old-nexus.log",
              "rr-audit-orphan-cleanup.log",
              "rr-audit-pre710-uninstall-rollback.log",
              "rr-audit-preclean.log",
              "rr-audit-transfer-sha.log",
              "rr-audit-ufw-enable.log",
              "rr-audit-ufw-prepare.log",
              "rr-audit-upgrade.log",
          }

          def sanitize(line: str) -> str:
              line = ansi.sub("", line).replace("\r", "")
              if sensitive_line.search(line):
                  return "<sensitive-line-redacted>"
              line = url.sub("<URL>", line)
              line = email.sub("<EMAIL>", line)
              line = sub_path.sub("/<SUBSCRIPTION_PATH_REDACTED>", line)
              line = uuid.sub("<UUID>", line)
              line = ipv4.sub("<IPV4>", line)
              line = ipv6.sub("<IPV6>", line)
              line = fqdn.sub("<DOMAIN>", line)
              line = long_secret.sub("<LONG_VALUE>", line)
              return line[:500]

          def command(name, argv):
              try:
                  proc = subprocess.run(argv, text=True, capture_output=True, timeout=15)
                  value = (proc.stdout or proc.stderr).strip().splitlines()
                  safe = sanitize(value[-1]) if value else "empty"
                  print(f"DIAG_STATE label={label} name={name} rc={proc.returncode} value={safe}")
              except Exception as exc:
                  print(f"DIAG_STATE label={label} name={name} rc=exception value={type(exc).__name__}")

          print(f"DIAG_REMOTE label={label} stage={sanitize(open('/root/rr-audit-stage').read().strip()) if os.path.isfile('/root/rr-audit-stage') else 'absent'}")
          command("rr-version", ["/usr/local/bin/rr", "--version"])
          command("sing-box-version", ["/usr/local/bin/sing-box", "version"])
          for unit in ("rr-nexus.service", "sing-box.service", "nginx.service", "rr-update-recovery.service"):
              command("unit-" + unit, ["systemctl", "is-active", unit])

          log_paths = sorted(glob.glob("/root/rr-audit-*.log"))
          print(f"DIAG_LOG_COUNT label={label} count={len(log_paths)}")
          for path in log_paths:
              try:
                  basename = os.path.basename(path)
                  safe_name = basename if basename in expected_logs else "<UNEXPECTED_LOG>"
                  st = os.lstat(path)
                  if not os.path.isfile(path) or os.path.islink(path) or st.st_uid != 0 or (st.st_mode & 0o077):
                      print(f"DIAG_LOG label={label} file={safe_name} result=unsafe-metadata")
                      continue
                  with open(path, "rb") as fh:
                      raw = fh.read(2_000_000)
                  digest = hashlib.sha256(raw).hexdigest()
                  text = raw.decode("utf-8", "replace")
                  lines = text.splitlines()
                  chosen = []
                  for index, line in enumerate(lines, 1):
                      if relevant.search(line):
                          chosen.append((index, line))
                  chosen = chosen[-25:]
                  tail = list(enumerate(lines[-20:], max(1, len(lines) - 19)))
                  chosen = sorted(dict(chosen + tail).items())
                  print(
                      f"DIAG_LOG label={label} file={safe_name} "
                      f"bytes={len(raw)} lines={len(lines)} sha256={digest} excerpts={len(chosen)}"
                  )
                  for index, line in chosen:
                      print(
                          f"DIAG_EXCERPT label={label} file={safe_name} "
                          f"line={index} text={sanitize(line)}"
                      )
              except Exception as exc:
                  print(
                      f"DIAG_LOG label={label} file=<UNEXPECTED_OR_UNREADABLE_LOG> "
                      f"result=read-error type={type(exc).__name__}"
                  )
          PY
            unset SSHPASS
            rm -f -- "$known_hosts"
            printf 'DIAG_HOST label=%s result=complete rc=%s\n' "$label" "$rc"
            return "$rc"
          }

          overall=0
          diagnose_host A "$RR_A_HOST" "$RR_A_PASS" "$RR_A_HOST_KEY" || overall=1
          diagnose_host B "$RR_B_HOST" "$RR_B_PASS" "$RR_B_HOST_KEY" || overall=1
          diagnose_host C "$RR_C_HOST" "$RR_C_PASS" "$RR_C_HOST_KEY" || overall=1
          exit "$overall"
