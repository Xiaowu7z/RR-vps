name: VPS B diagnostic cleanup

on:
  push:
    branches:
      - audit/vps-diagnostic-v711

permissions:
  actions: write
  contents: read

jobs:
  cleanup-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RR_B_HOST: ${{ secrets.RR_B_HOST }}
      RR_B_PASS: ${{ secrets.RR_B_PASS }}
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Remove the disposable B fixture
        shell: bash
        run: |
          set -euo pipefail
          set +x
          pin_b='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A'
          known_hosts="$RUNNER_TEMP/cleanup-known-hosts-B"
          (umask 077; printf '%s %s\n' "$RR_B_HOST" "$pin_b" > "$known_hosts")
          ssh-keygen -F "$RR_B_HOST" -f "$known_hosts" >/dev/null
          export SSHPASS="$RR_B_PASS"
          ssh_opts=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts"
          )
          sshpass -e ssh "${ssh_opts[@]}" "root@$RR_B_HOST" bash -s \
            2>/dev/null <<'REMOTE'
          set -euo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb

          assert_unit_absent() {
            local unit="$1" load_state="" active_state="" unit_file_state=""
            load_state=$(systemctl show -p LoadState --value "$unit" 2>/dev/null) || return 1
            active_state=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null) || return 1
            unit_file_state=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null) || return 1
            if [ "$load_state" = not-found ] && [ -z "$unit_file_state" ]; then
              unit_file_state=not-found
            fi
            test "$load_state:$active_state:$unit_file_state" = \
              not-found:inactive:not-found
          }

          systemctl reset-failed rr-subscription-quarantine.service \
            >/dev/null 2>&1 || true
          if [ -x /usr/local/bin/rr ] && [ -d /usr/local/lib/rr/modules ]; then
            if ! printf '%s\n' y | bash -c '
                set -o pipefail
                for module_file in /usr/local/lib/rr/modules/*.sh; do
                  # shellcheck disable=SC1090
                  source "$module_file"
                done
                uninstall_all
              ' >/root/rr-diagnostic-cleanup.log 2>&1; then
              exit 1
            fi
          fi
          systemctl daemon-reload >/dev/null 2>&1
          systemctl reset-failed rr-subscription-quarantine.service \
            rr-nexus.service sing-box.service >/dev/null 2>&1 || true

          test ! -e /usr/local/bin/rr
          test ! -L /usr/local/bin/rr
          test ! -e /usr/local/lib/rr
          test ! -L /usr/local/lib/rr
          test ! -e /etc/argo_vmess.conf
          test ! -L /etc/argo_vmess.conf
          test ! -e /etc/rr-nexus
          test ! -L /etc/rr-nexus
          test ! -e /var/lib/rr-nexus
          test ! -L /var/lib/rr-nexus
          test ! -e /var/lib/rr-update
          test ! -L /var/lib/rr-update
          test ! -e /run/rr-vps/update-maintenance
          test ! -L /run/rr-vps/update-maintenance
          test ! -e /var/lib/rr-update/subscription-quarantine
          test ! -L /var/lib/rr-update/subscription-quarantine
          test ! -e /run/rr-subscription-quarantine.ready
          test ! -L /run/rr-subscription-quarantine.ready
          test ! -e /etc/systemd/system/rr-subscription-quarantine.service
          test ! -L /etc/systemd/system/rr-subscription-quarantine.service
          test ! -e /var/lib/rr-quarantine/guard-state
          test ! -L /var/lib/rr-quarantine/guard-state
          test ! -e /usr/local/libexec/rr-vps/subscription-quarantine-guard
          test ! -L /usr/local/libexec/rr-vps/subscription-quarantine-guard
          test ! -e /usr/local/sbin/rr-update-recover
          test ! -L /usr/local/sbin/rr-update-recover
          assert_unit_absent rr-subscription-quarantine.service
          assert_unit_absent rr-nexus.service
          assert_unit_absent sing-box.service
          for backend in iptables ip6tables; do
            command -v "$backend" >/dev/null 2>&1 || continue
            rules=$("$backend" -w 5 -t raw -S PREROUTING 2>/dev/null)
            [[ "$rules" != *'rr-vps unsafe rollback subscription quarantine'* ]]
          done
          for port in 10443 18081 21444 22444 23444 24444 25444; do
            test -z "$(ss -H -ltn "sport = :${port}" 2>/dev/null)"
            test -z "$(ss -H -lun "sport = :${port}" 2>/dev/null)"
          done
          find /root -maxdepth 1 -type f \
            \( -name 'rr-audit-*' -o -name 'rr-diagnostic-cleanup.log' \) \
            -delete
          rm -rf -- /root/rr-audit-candidate /root/rr-audit-old
          printf 'B_CLEANUP result=pass\n'
          REMOTE
          unset SSHPASS

      - name: Delete superseded diagnostic runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          for run_id in 33319396858 33319478272; do
            curl -fsS -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Xiaowu7z/RR-vps/actions/runs/${run_id}"
          done
