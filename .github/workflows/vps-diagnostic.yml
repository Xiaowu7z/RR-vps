name: VPS B structured diagnostic

on:
  push:
    branches:
      - audit/vps-diagnostic-v711

permissions:
  contents: read

jobs:
  diagnose-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RR_B_HOST: ${{ secrets.RR_B_HOST }}
      RR_B_PASS: ${{ secrets.RR_B_PASS }}
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass netcat-openbsd

      - name: Run named checks without exposing values
        shell: bash
        run: |
          set -euo pipefail
          set +x
          pin_b='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJWJw40hog64SpnWDcp4mvlSJIZ1qspCoOhNrn0L/B5A'
          known_hosts="$RUNNER_TEMP/diagnostic-known-hosts-B"
          (umask 077; printf '%s %s\n' "$RR_B_HOST" "$pin_b" > "$known_hosts")
          ssh-keygen -F "$RR_B_HOST" -f "$known_hosts" >/dev/null
          export SSHPASS="$RR_B_PASS"
          ssh_opts=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts"
          )
          set +e
          sshpass -e ssh "${ssh_opts[@]}" "root@$RR_B_HOST" bash -s \
            2>/dev/null <<'REMOTE'
          set -uo pipefail
          umask 077
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb

          report() {
            local name="$1" rc=0
            shift
            "$@" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf 'B_CHECK name=%s result=pass\n' "$name"
            else
              printf 'B_CHECK name=%s result=fail\n' "$name"
            fi
          }

          stage_rank=0
          if [ -r /root/rr-audit-stage ]; then
            IFS= read -r stage_candidate < /root/rr-audit-stage || true
            case "$stage_candidate" in
              preclean-complete) stage_rank=1 ;;
              old-state-built) stage_rank=2 ;;
              first-upgrade-complete) stage_rank=3 ;;
              manual-rollback-complete) stage_rank=4 ;;
              second-upgrade-complete) stage_rank=5 ;;
            esac
          fi
          stage_at_least() {
            test "$stage_rank" -ge "$1"
          }

          assert_unit_state() {
            local unit="$1" expected="$2" load_state="" active_state="" unit_file_state=""
            load_state=$(systemctl show -p LoadState --value "$unit" 2>/dev/null) || return 1
            active_state=$(systemctl show -p ActiveState --value "$unit" 2>/dev/null) || return 1
            unit_file_state=$(systemctl show -p UnitFileState --value "$unit" 2>/dev/null) || return 1
            if [ "$load_state" = not-found ] && [ -z "$unit_file_state" ]; then
              unit_file_state=not-found
            fi
            test "$load_state:$active_state:$unit_file_state" = "$expected"
          }

          source_candidate_modules() {
            local module_file=""
            [ -d /usr/local/lib/rr/modules ] || return 1
            for module_file in /usr/local/lib/rr/modules/*.sh; do
              [ -f "$module_file" ] || return 1
              # shellcheck disable=SC1090
              source "$module_file" || return 1
            done
          }

          candidate_version() {
            /usr/local/bin/rr --version | grep -F 'RR-vps 7.1.1'
          }
          candidate_cli_manifest() {
            local expected_rr=""
            expected_rr=$(awk '$2 == "rr" {print $1}' /usr/local/lib/rr/manifest.sha256) || return 1
            [ -n "$expected_rr" ] || return 1
            test "$(sha256sum /usr/local/bin/rr | awk '{print $1}')" = "$expected_rr"
          }
          candidate_runtime_manifest() {
            (
              cd /usr/local/lib/rr || exit 1
              awk '$2 != "rr"' manifest.sha256 | sha256sum -c -
            )
          }
          candidate_subscription() {
            subscription_server_running
          }
          subscription_pid_live() {
            local pid=""
            IFS= read -r pid < /run/rr-vps-subscription.pid || return 1
            [[ "$pid" =~ ^[0-9]+$ ]] || return 1
            kill -0 "$pid"
          }
          subscription_config_access_local() {
            test "${SUB_ACCESS_MODE-}" = local
          }
          subscription_config_domain_empty() {
            test -z "${SUB_DOMAIN-}"
          }
          subscription_bind_trusted() {
            [ -f /run/rr-vps-subscription.bind ] || return 1
            [ ! -L /run/rr-vps-subscription.bind ] || return 1
            test "$(stat -c '%U:%G:%a:%h' /run/rr-vps-subscription.bind)" = \
              root:root:600:1
          }
          subscription_bind() {
            local sub_port="" sub_bind="" sub_mode="" sub_domain="" ignored=""
            IFS='|' read -r sub_port sub_bind sub_mode sub_domain ignored \
              < /run/rr-vps-subscription.bind || return 1
            test "$sub_port" = 18081
            test "$sub_bind" = 127.0.0.1
            test "$sub_mode" = local
            test -z "$sub_domain"
          }
          subscription_firewall_transition() {
            load_config_with_defaults
            rr_validate_local_subscription_firewall_transition 18081
          }
          device_row_preserved() {
            [ -s /root/rr-audit-before-device.txt ] || return 1
            sqlite3 -separator '|' /var/lib/rr-nexus/nexus.db \
              "SELECT id,name,credential,subscription_token,enabled,quota_bytes,
                      used_bytes,uploaded_bytes,downloaded_bytes,traffic_updated_at,
                      COALESCE(group_id,'<NULL>'),expires_at,next_reset_at,
                      reset_anchor_day,reset_max,reset_count,created_at,updated_at
                 FROM devices WHERE id='dev_a1b2c3d4e5f6';" \
              | cmp -s - /root/rr-audit-before-device.txt
          }
          config_keys_preserved() {
            local key="" before="" after=""
            [ -s /root/rr-audit-before.conf ] || return 1
            for key in UUID PORT SUB_PORT SUB_PUBLIC_PORT_IPV4 SUB_PUBLIC_PORT_IPV6 \
              VM_ENABLED VM_TLS_ENABLED VL_ENABLED VL_PORT \
              HY2_ENABLED HY2_PORT HY2_HOP_PORTS HY2_HOP_INTERVAL \
              TU5_ENABLED TU5_PORT TU5_HOP_PORTS AN_ENABLED AN_PORT \
              NAIVE_ENABLED PRIVATE_KEY PUBLIC_KEY SHORT_ID CERT_SHA256; do
              before=$(grep -m1 "^${key}=" /root/rr-audit-before.conf) || return 1
              after=$(grep -m1 "^${key}=" /etc/argo_vmess.conf) || return 1
              test "$before" = "$after" || return 1
            done
          }
          nexus_config_preserved() {
            [ -s /root/rr-audit-before-nexus-stable.json ] || return 1
            jq -cS '{
              mode,listen,port,domain,stats_port,ssh_host,public_port,traffic_mode
            }' /etc/rr-nexus/nexus.json \
              | cmp -s - /root/rr-audit-before-nexus-stable.json
          }
          database_integrity() {
            test "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA quick_check;')" = ok
            test -z "$(sqlite3 /var/lib/rr-nexus/nexus.db 'PRAGMA foreign_key_check;')"
          }
          panel_health() {
            local panel_port=""
            panel_port=$(jq -r '.public_port' /etc/rr-nexus/nexus.json) || return 1
            [[ "$panel_port" =~ ^[0-9]+$ ]] || return 1
            curl -kfsS --connect-timeout 5 --max-time 15 \
              "https://127.0.0.1:${panel_port}/healthz"
          }
          quarantine_status_inactive() {
            local status_json=""
            status_json=$(/usr/local/sbin/rr-update-recover status) || return 1
            jq -e '.active == false and .subscription_quarantine.active == false' \
              <<<"$status_json"
          }
          recovery_status_readable() {
            /usr/local/sbin/rr-update-recover status | jq -e 'type == "object"'
          }
          config_mode_600() {
            test "$(stat -c %a /etc/argo_vmess.conf 2>/dev/null)" = 600
          }
          database_mode_600() {
            test "$(stat -c %a /var/lib/rr-nexus/nexus.db 2>/dev/null)" = 600
          }
          path_absent() {
            [ ! -e "$1" ] && [ ! -L "$1" ]
          }
          raw_quarantine_rule_absent() {
            local backend="$1" rc=0
            command -v "$backend" >/dev/null 2>&1 || return 0
            "$backend" -w 5 -t raw -C PREROUTING ! -i lo -p tcp --dport 18081 \
              -m addrtype --dst-type LOCAL -m comment \
              --comment 'rr-vps unsafe rollback subscription quarantine' -j DROP \
              >/dev/null 2>&1
            rc=$?
            test "$rc" -eq 1
          }

          report stage_first_upgrade_reached stage_at_least 3
          report stage_manual_rollback_reached stage_at_least 4
          report stage_second_upgrade_reached stage_at_least 5
          report candidate_modules source_candidate_modules
          report candidate_version candidate_version
          report cli_manifest candidate_cli_manifest
          report runtime_manifest candidate_runtime_manifest
          report sing_box_config /usr/local/bin/sing-box check -c /etc/sing-box/config.json
          report sing_box_unit assert_unit_state sing-box.service loaded:active:enabled
          report nexus_unit assert_unit_state rr-nexus.service loaded:active:enabled
          report nginx_unit assert_unit_state nginx.service loaded:active:enabled
          report subscription_worker candidate_subscription
          report subscription_pid_file test -s /run/rr-vps-subscription.pid
          report subscription_pid_live subscription_pid_live
          report subscription_config_load load_config_with_defaults
          report subscription_config_access_local subscription_config_access_local
          report subscription_config_domain_empty subscription_config_domain_empty
          report subscription_bind_trusted subscription_bind_trusted
          report subscription_bind subscription_bind
          report firewall_transition subscription_firewall_transition
          report database_integrity database_integrity
          report device_row_preserved device_row_preserved
          report config_keys_preserved config_keys_preserved
          report nexus_config_preserved nexus_config_preserved
          report panel_health panel_health
          report recovery_status_readable recovery_status_readable
          report quarantine_status_inactive quarantine_status_inactive
          report quarantine_marker_absent path_absent /var/lib/rr-update/subscription-quarantine
          report quarantine_ready_absent path_absent /run/rr-subscription-quarantine.ready
          report quarantine_unit_file_absent path_absent /etc/systemd/system/rr-subscription-quarantine.service
          report quarantine_guard_state_absent path_absent /var/lib/rr-quarantine/guard-state
          report quarantine_guard_absent path_absent /usr/local/libexec/rr-vps/subscription-quarantine-guard
          report quarantine_unit_absent assert_unit_state rr-subscription-quarantine.service \
            not-found:inactive:not-found
          report quarantine_ipv4_rule_absent raw_quarantine_rule_absent iptables
          report quarantine_ipv6_rule_absent raw_quarantine_rule_absent ip6tables
          report config_mode_600 config_mode_600
          report database_mode_600 database_mode_600
          printf 'B_DIAGNOSTIC result=complete\n'
          exit 0
          REMOTE
          ssh_rc=$?
          set -e
          unset SSHPASS
          if [ "$ssh_rc" -eq 0 ]; then
            printf 'B_CHECK name=ssh_session result=pass\n'
          else
            printf 'B_CHECK name=ssh_session result=fail\n'
          fi

          if nc -z -w 8 "$RR_B_HOST" 18081 >/dev/null 2>&1; then
            printf 'B_CHECK name=external_subscription_closed result=fail\n'
          else
            printf 'B_CHECK name=external_subscription_closed result=pass\n'
          fi
          if curl -kfsS --connect-timeout 5 --max-time 20 \
            "https://${RR_B_HOST}:10443/healthz" >/dev/null 2>&1; then
            printf 'B_CHECK name=external_panel_health result=pass\n'
          else
            printf 'B_CHECK name=external_panel_health result=fail\n'
          fi
