name: A health-freeze normalization diagnostic

on:
  push:
    branches:
      - audit/vps-diagnostic-v711

permissions:
  contents: read

jobs:
  diagnose-a-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Verify failed oneshot can be normalized and frozen
        shell: bash
        env:
          RR_A_HOST: ${{ secrets.RR_A_HOST }}
          RR_A_PASS: ${{ secrets.RR_A_PASS }}
        run: |
          set -euo pipefail
          set +x
          pin_a='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICmpYE2GN+xGyCxDQW1e/NrwzmApHDMz+zLigsrhXhRm'
          known_hosts="$RUNNER_TEMP/diagnostic-known-hosts-A"
          (umask 077; printf '%s %s\n' "$RR_A_HOST" "$pin_a" > "$known_hosts")
          ssh-keygen -F "$RR_A_HOST" -f "$known_hosts" >/dev/null
          export SSHPASS="$RR_A_PASS"
          ssh_opts=(
            -o BatchMode=no -o ConnectTimeout=20 -o ConnectionAttempts=2
            -o LogLevel=ERROR -o PreferredAuthentications=password
            -o PubkeyAuthentication=no -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
            -o UserKnownHostsFile="$known_hosts"
          )
          sshpass -e ssh "${ssh_opts[@]}" "root@$RR_A_HOST" bash -s             2>/dev/null <<'REMOTE'
          set -euo pipefail
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=dumb
          resume_timer=true
          finish_probe() {
            rc=$?
            trap - EXIT
            if [ "$resume_timer" = true ]; then
              systemctl start argo-rr-health.timer >/dev/null 2>&1 || rc=1
            fi
            exit "$rc"
          }
          trap finish_probe EXIT

          test "$(systemctl show -p LoadState --value argo-rr-health.timer)" = loaded
          test "$(systemctl show -p ActiveState --value argo-rr-health.timer)" = active
          test "$(systemctl show -p UnitFileState --value argo-rr-health.timer)" = enabled
          test "$(systemctl show -p LoadState --value argo-rr-health.service)" = loaded
          test "$(systemctl show -p UnitFileState --value argo-rr-health.service)" = static

          systemctl stop argo-rr-health.timer
          systemctl stop argo-rr-health.service
          systemctl reset-failed argo-rr-health.service
          test "$(systemctl show -p ActiveState --value argo-rr-health.timer)" = inactive
          test "$(systemctl show -p UnitFileState --value argo-rr-health.timer)" = enabled
          test "$(systemctl show -p ActiveState --value argo-rr-health.service)" = inactive
          test "$(systemctl show -p UnitFileState --value argo-rr-health.service)" = static
          printf 'A_FREEZE_NORMALIZATION class=strict_inactive\n'

          systemctl start argo-rr-health.timer
          resume_timer=false
          test "$(systemctl show -p ActiveState --value argo-rr-health.timer)" = active
          test "$(systemctl show -p UnitFileState --value argo-rr-health.timer)" = enabled
          printf 'A_FREEZE_RESUME class=active_enabled\n'
          REMOTE
          unset SSHPASS
