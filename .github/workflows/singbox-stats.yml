name: singbox-stats-build

# RR-vps 面板流量统计需要 with_v2ray_api 标签的 sing-box 构建。
# 官方 SagerNet release 自 1.12 起不再默认包含 v2ray_api，此 workflow
# 每天检查官方最新正式版，若对应带统计构建尚未发布则编译并上传到
# 本仓库 release（tag: sing-box-<version>，资产: sing-box-<version>-linux-<arch>.tar.gz）。
# 用户机器 install_singbox 优先下载本构建，缺失时回退官方构建。

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - { go: amd64, tag: amd64 }
          - { go: arm64, tag: arm64 }
    steps:
      - name: 获取官方最新正式版
        id: meta
        run: |
          VER=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          echo "version=${VER#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${VER}" >> "$GITHUB_OUTPUT"

      - name: 检查是否已构建
        id: existing
        run: |
          URL="https://api.github.com/repos/Xiaowu7z/RR-vps/releases/tags/sing-box-${{ steps.meta.outputs.version }}"
          if curl -fsSL -o /dev/null "$URL" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Go
        if: steps.existing.outputs.exists == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: 克隆官方源码并检出
        if: steps.existing.outputs.exists == 'false'
        run: |
          git clone --depth 1 --branch "${{ steps.meta.outputs.tag }}" \
            https://github.com/SagerNet/sing-box.git

      - name: 编译（含 with_v2ray_api）
        if: steps.existing.outputs.exists == 'false'
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch.go }}
          CGO_ENABLED: "0"
        run: |
          cd sing-box
          go build -v -trimpath -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${{ steps.meta.outputs.version }}" \
            -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_v2ray_api" \
            -o "sing-box-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch.tag }}/sing-box" ./cmd/sing-box
          tar czf "sing-box-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch.tag }}.tar.gz" \
            "sing-box-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch.tag }}/"

      - name: 创建/获取 release 并上传
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "sing-box-${{ steps.meta.outputs.version }}" \
            "sing-box/sing-box-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch.tag }}.tar.gz" \
            --repo Xiaowu7z/RR-vps \
            --title "sing-box ${{ steps.meta.outputs.version }} (with_v2ray_api)" \
            --notes "官方 sing-box ${{ steps.meta.outputs.version }} 源码 + with_v2ray_api 标签编译，供 RR-vps 面板流量统计使用。amd64 与 arm64 由两个 job 上传到同一 release。" \
            || gh release upload "sing-box-${{ steps.meta.outputs.version }}" \
            "sing-box/sing-box-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch.tag }}.tar.gz" \
            --repo Xiaowu7z/RR-vps --clobber
