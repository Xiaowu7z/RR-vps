name: Enable stable release finalizer
on:
  push:
    branches: [audit/stability-20260907]
    paths: [.github/workflows/enable-publish-v720.yml]
permissions:
  contents: read
  actions: write
jobs:
  enable:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Restore automatic finalization after verified main checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "/repos/$GITHUB_REPOSITORY/actions/workflows/publish-v720.yml/enable"
