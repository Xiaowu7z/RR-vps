name: Retry busy stability job
on:
  push:
    branches: [audit/stability-20260907]
    paths: [.github/workflows/enable-publish-v720.yml]
permissions:
  contents: read
  actions: write
jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Retry only failed jobs after the current matrix completes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="/repos/$GITHUB_REPOSITORY"
          for attempt in {1..20}; do
            run=$(gh api "$api/actions/runs/34087070629")
            jq -e '.head_sha == "fb2d0d3fa0e75d23c3441e408b1fcaf7a9259ad7" and .event == "push"' <<<"$run" >/dev/null
            if [ "$(jq -r .status <<<"$run")" = completed ]; then
              [ "$(jq -r .conclusion <<<"$run")" = failure ] || exit 0
              gh api --method POST "$api/actions/runs/34087070629/rerun-failed-jobs"
              exit 0
            fi
            sleep 15
          done
          exit 1
